<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 820px; height: 820px; top: -300px; right: -280px; background: radial-gradient(circle, rgba(8,145,178,0.10) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 820px; height: 820px; bottom: -320px; left: -300px; background: radial-gradient(circle, rgba(99,102,241,0.09) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 100px 84px 150px; display: flex; flex-direction: column; justify-content: center; }
  .counter { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .counter-line { width: 44px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .counter-text { font-size: 19px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; }
  .counter-text b { color: #0891b2; font-weight: 800; }
  .title { font-size: 66px; font-weight: 900; color: #0f172a; line-height: 1.08; letter-spacing: -0.03em; margin-bottom: 36px; }
  .note { margin-top: 32px; font-size: 28px; font-weight: 500; color: #64748b; line-height: 1.5; padding-left: 22px; border-left: 3px solid #e2e8f0; }
  .note b { color: #0f172a; font-weight: 700; }

  .cover-content { padding: 100px 84px 150px; justify-content: flex-start; }
  .eyebrow { font-size: 21px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #0891b2; margin-bottom: 26px; }
  .headline { font-size: 90px; font-weight: 900; line-height: 1.03; letter-spacing: -0.035em; color: #0f172a; }
  .sub { margin-top: 28px; font-size: 36px; font-weight: 500; color: #475569; line-height: 1.45; max-width: 860px; }
  .mid { flex: 1; display: flex; align-items: center; justify-content: center; }
  .q { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 26px; padding: 34px 36px; box-shadow: 0 30px 60px -36px rgba(15,23,42,0.3); }
  .q-n { font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #0891b2; margin-bottom: 14px; }
  .q-t { font-size: 52px; font-weight: 900; letter-spacing: -0.025em; line-height: 1.12; color: #0f172a; }
  .stem { width: 4px; height: 44px; margin: 0 auto; background: linear-gradient(180deg, #0891b2, #6366f1); border-radius: 2px; }
  .ans { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .a { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 20px; padding: 26px 28px; display: flex; flex-direction: column; gap: 12px; }
  .a.go { border-left: 5px solid #0891b2; box-shadow: 0 18px 40px -24px rgba(8,145,178,0.45); }
  .a-k { font-size: 20px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; }
  .a.go .a-k { color: #0891b2; }
  .a-t { font-size: 31px; font-weight: 800; color: #0f172a; line-height: 1.2; }
  .a-to { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; color: #64748b; }
  .a.go .a-to { color: #0891b2; }
  .trail { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .step { font-size: 17px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 100px; padding: 8px 16px; }
  .step.on { color: #fff; border: none; background: linear-gradient(135deg, #0891b2, #6366f1); }
  .step.done { color: #0891b2; }
  .sep { width: 18px; height: 3px; background: #e2e8f0; border-radius: 2px; }
  </style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="trail"><span class="step done">Início</span><span class="sep"></span><span class="step on">Pergunta 2</span><span class="sep"></span><span class="step">Resultado</span></div>
    <div class="q"><div class="q-n">Pergunta 2 de 3</div><div class="q-t">Pergunta objetiva, respondível com sim ou não?</div></div>
    <div class="stem"></div>
    <div class="ans">
      <div class="a"><div class="a-k">Não</div><div class="a-t">Resposta curta</div><div class="a-to"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 10 5 5-5 5" /><path d="M4 4v7a4 4 0 0 0 4 4h12" /></svg>Segue para a pergunta 3</div></div>
      <div class="a go"><div class="a-k">Sim</div><div class="a-t">Resposta curta</div><div class="a-to"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>Resultado A</div></div>
    </div>
    <p class="note"><b>Por que perguntamos isso:</b> uma frase que explica o critério, em linguagem de negócio.</p>
  </div>
  <div class="progress"><div class="dot"></div><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
