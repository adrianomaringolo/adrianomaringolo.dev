<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0a1226; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0a1226; }

  .bg-photo { position: absolute; inset: 0;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.10) 0 26px, transparent 26px 52px),
      linear-gradient(185deg, #a2b0c4 0%, #72819a 48%, #3d4c64 100%); }

  /* com legenda, o véu de rodapé sobe para 22% */
  .scrim-foot { position: absolute; bottom: 0; left: 0; right: 0; height: 22%;
    background: linear-gradient(to top,
      rgba(10,18,38,0.72) 0%,
      rgba(10,18,38,0.40) 48%,
      rgba(10,18,38,0.00) 100%); }

  .photo-tag { position: absolute; left: 0; right: 0; top: 46%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 6; color: rgba(255,255,255,0.72); }
  .photo-tag-label { font-size: 22px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
  .photo-tag-file { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.52); }
  .photo-tag-note { margin-top: 10px; font-size: 19px; font-weight: 600; color: rgba(255,255,255,0.44); }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }

  .caption { position: absolute; left: 84px; right: 200px; bottom: 112px; z-index: 15;
    font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.92); line-height: 1.4;
    text-shadow: 0 2px 20px rgba(10,18,38,0.6); }

  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.30); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }

  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 24px; font-weight: 700; color: #f1f5f9; z-index: 30;
    text-shadow: 0 2px 16px rgba(10,18,38,0.65); }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-photo"></div>
  <div class="scrim-foot"></div>

  <div class="photo-tag">
    <svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
    </svg>
    <div class="photo-tag-label">Sequência com legenda</div>
    <div class="photo-tag-file">foto-03.jpg</div>
    <div class="photo-tag-note">Variação opcional, decidida slide a slide.</div>
  </div>

  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="caption">O que se vê aqui, em uma linha de contexto.</div>

  <div class="progress"><span class="dot"></span><span class="dot"></span><span class="dot active"></span></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
