<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0a1226; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0a1226; }

  /* placeholder de foto — ocupa o slide inteiro */
  .bg-photo { position: absolute; inset: 0;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.10) 0 26px, transparent 26px 52px),
      linear-gradient(158deg, #9aa8bd 0%, #6b7a91 46%, #3a4a61 100%); }

  .scrim-top { position: absolute; top: 0; left: 0; right: 0; height: 38%;
    background: linear-gradient(to bottom,
      rgba(10,18,38,0.88)  0%,
      rgba(10,18,38,0.78) 38%,
      rgba(10,18,38,0.52) 68%,
      rgba(10,18,38,0.00) 100%); }

  .scrim-foot { position: absolute; bottom: 0; left: 0; right: 0; height: 15%;
    background: linear-gradient(to top,
      rgba(10,18,38,0.55) 0%,
      rgba(10,18,38,0.28) 45%,
      rgba(10,18,38,0.00) 100%); }

  .photo-tag { position: absolute; left: 0; right: 0; top: 62%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 14px; z-index: 6; color: rgba(255,255,255,0.72); }
  .photo-tag-label { font-size: 21px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
  .photo-tag-file { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.52); }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }

  .content { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 84px 84px 0; }

  .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(255,255,255,0.58); margin-bottom: 22px; }

  .title { font-size: 84px; font-weight: 900; line-height: 1.03; letter-spacing: -0.035em;
    color: #f1f5f9; text-shadow: 0 2px 28px rgba(10,18,38,0.45); }
  .title em { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.30); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }

  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 24px; font-weight: 700; color: #f1f5f9; z-index: 30;
    text-shadow: 0 2px 16px rgba(10,18,38,0.65); }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-photo"></div>
  <div class="scrim-top"></div>
  <div class="scrim-foot"></div>

  <div class="photo-tag">
    <svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
    </svg>
    <div class="photo-tag-label">Foto própria, slide inteiro</div>
    <div class="photo-tag-file">foto-01.jpg · mínimo 1080×1350</div>
  </div>

  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">
    <div class="eyebrow">Categoria opcional</div>
    <h1 class="title">Título curto que<br>nomeia <em>a imagem</em></h1>
  </div>

  <div class="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
