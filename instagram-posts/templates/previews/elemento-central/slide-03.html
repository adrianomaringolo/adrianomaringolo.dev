<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #f5f7fa; }

  .bg-dots { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(15,23,42,0.045) 1.5px, transparent 1.5px);
    background-size: 40px 40px; }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }

  /* Palco: o elemento mora aqui, centro óptico um pouco acima do meio */
  .stage { position: absolute; left: 50%; top: 560px; transform: translate(-50%, -50%);
    width: 560px; height: 560px; border-radius: 50%; z-index: 10;
    display: flex; align-items: center; justify-content: center; }
  .stage.light { background: #ffffff; border: 1px solid #e2e8f0;
    box-shadow: 0 40px 90px -30px rgba(99,102,241,0.35), 0 20px 50px -20px rgba(8,145,178,0.25); }
  .stage.dark { background: radial-gradient(circle at 50% 40%, rgba(99,102,241,0.22), rgba(8,145,178,0.06) 60%, transparent 72%);
    border: 1px solid rgba(6,182,212,0.22); }
  .stage.photo { border-radius: 0; width: 640px; height: 640px;
    background: repeating-linear-gradient(45deg, rgba(15,23,42,0.05) 0 14px, transparent 14px 28px);
    border: 2px dashed #94a3b8; }
  .stage.photo span { font-size: 22px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; text-align: center; line-height: 1.6; }

  .phrase { position: absolute; left: 110px; right: 110px; top: 960px; z-index: 10;
    text-align: center; font-size: 60px; font-weight: 800; line-height: 1.12; letter-spacing: -0.03em; text-wrap: balance;
    color: #0f172a; }
  .phrase em { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .handle { position: absolute; bottom: 64px; left: 0; right: 0; text-align: center; font-size: 24px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div>
  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="stage photo"><span>Objeto recortado<br>objeto.png · fundo transparente<br>mín. 1200×1200</span></div>

  <p class="phrase">Variante com <em>objeto real.</em></p>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
