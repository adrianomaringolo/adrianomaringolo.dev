<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0a1226; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #0a1226; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(99,102,241,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.08) 1px, transparent 1px); background-size: 54px 54px;
    -webkit-mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(248,250,252,0.04) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .bg-glow { position: absolute; top: -200px; right: -160px; width: 760px; height: 760px; background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 70%); }
  .bg-glow-low { position: absolute; bottom: -220px; left: -180px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 92px 84px 150px; display: flex; flex-direction: column; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 21px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #64748b; margin-bottom: 26px; }
  .headline { font-size: 88px; font-weight: 900; line-height: 1.03; letter-spacing: -0.035em; color: #f1f5f9; }
  .tag { font-size: 16px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #06b6d4; background: rgba(6,182,212,0.14); border-radius: 100px; padding: 7px 14px; white-space: nowrap; }
  .cta-label { font-size: 29px; font-weight: 600; color: #94a3b8; margin-bottom: 14px; }
  .cta-site { font-size: 66px; font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .cta { position: absolute; bottom: 158px; left: 88px; right: 80px; z-index: 15; }

  .hatch { background: repeating-linear-gradient(135deg, rgba(148,163,184,0.12) 0 14px, rgba(148,163,184,0.05) 14px 28px); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 18px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; line-height: 1.5; padding: 20px; }
  .split { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-radius: 26px; overflow: hidden; border: 1.5px solid rgba(148,163,184,0.22); box-shadow: 0 34px 80px -26px rgba(0,0,0,0.7); }
  .half { display: flex; flex-direction: column; }
  .half-tag { padding: 20px 26px; font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; background: rgba(255,255,255,0.04); }
  .half.after .half-tag { color: #67e8f9; background: linear-gradient(135deg, rgba(6,182,212,0.20), rgba(99,102,241,0.20)); }
  .half .hatch { height: 560px; }
  .half.before .hatch { filter: grayscale(1); opacity: .8; }
  .half.after .hatch { background: repeating-linear-gradient(135deg, rgba(6,182,212,0.16) 0 14px, rgba(99,102,241,0.10) 14px 28px); color: #67e8f9; }
  .divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: linear-gradient(180deg, #06b6d4, #6366f1); }
  .knob { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; background: #0a1226; border: 4px solid #06b6d4; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 40px rgba(6,182,212,0.4); }
  .caption { margin-top: 30px; font-size: 32px; font-weight: 500; color: #94a3b8; line-height: 1.45; }
  .caption b { color: #e2e8f0; font-weight: 700; }
  </style>
</head>
<body>
<div class="slide">
  <div class="bg-grid"></div><div class="bg-glow"></div><div class="bg-glow-low"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="eyebrow">Antes e depois</div>
    <h1 class="headline">Título da <span class="g">transformação</span></h1>
    <div class="mid">
      <div class="split">
        <div class="half before"><div class="half-tag">Antes</div><div class="hatch">Área do antes<br>print ou ilustração<br>(em tons de cinza)</div></div>
        <div class="half after"><div class="half-tag">Depois</div><div class="hatch">Área do depois<br>print ou ilustração<br>(colorida)</div></div>
        <div class="divider"></div><div class="knob"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4" /><path d="M4 7h16" /><path d="m16 21 4-4-4-4" /><path d="M20 17H4" /></svg></div>
      </div>
      <p class="caption">Frase de apoio. <b>Deslize para ver cada mudança.</b></p>
    </div>
  </div>
  <div class="progress"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
