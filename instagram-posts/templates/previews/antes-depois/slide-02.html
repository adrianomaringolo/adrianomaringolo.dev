<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 820px; height: 820px; top: -300px; right: -280px; background: radial-gradient(circle, rgba(8,145,178,0.10) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 820px; height: 820px; bottom: -320px; left: -300px; background: radial-gradient(circle, rgba(99,102,241,0.09) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 100px 84px 150px; display: flex; flex-direction: column; justify-content: center; }
  .counter { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .counter-line { width: 44px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .counter-text { font-size: 19px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; }
  .counter-text b { color: #0891b2; font-weight: 800; }
  .title { font-size: 66px; font-weight: 900; color: #0f172a; line-height: 1.08; letter-spacing: -0.03em; margin-bottom: 36px; }
  .note { margin-top: 32px; font-size: 28px; font-weight: 500; color: #64748b; line-height: 1.5; padding-left: 22px; border-left: 3px solid #e2e8f0; }
  .note b { color: #0f172a; font-weight: 700; }

  .hatch { background: repeating-linear-gradient(135deg, rgba(148,163,184,0.12) 0 14px, rgba(148,163,184,0.05) 14px 28px); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 18px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; line-height: 1.5; padding: 20px; }
  .split { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-radius: 26px; overflow: hidden; border: 1.5px solid rgba(148,163,184,0.22); box-shadow: 0 34px 80px -26px rgba(0,0,0,0.7); }
  .half { display: flex; flex-direction: column; }
  .half-tag { padding: 20px 26px; font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; background: rgba(255,255,255,0.04); }
  .half.after .half-tag { color: #67e8f9; background: linear-gradient(135deg, rgba(6,182,212,0.20), rgba(99,102,241,0.20)); }
  .half .hatch { height: 560px; }
  .half.before .hatch { filter: grayscale(1); opacity: .8; }
  .half.after .hatch { background: repeating-linear-gradient(135deg, rgba(6,182,212,0.16) 0 14px, rgba(99,102,241,0.10) 14px 28px); color: #67e8f9; }
  .divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: linear-gradient(180deg, #06b6d4, #6366f1); }
  .knob { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; background: #0a1226; border: 4px solid #06b6d4; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 40px rgba(6,182,212,0.4); }
  
  
  
  .hatch { height: 300px; border-radius: 18px; border: 1.5px solid #e2e8f0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pcard { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 22px; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 16px; }
  .pcard.win { border-left: 5px solid #0891b2; box-shadow: 0 18px 40px -24px rgba(8,145,178,0.45); }
  .ptag { font-size: 18px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; padding: 0 6px; }
  .pcard.win .ptag { color: #0891b2; }
  .pcard .hatch { filter: none; opacity: 1; background: repeating-linear-gradient(135deg, rgba(148,163,184,0.14) 0 14px, rgba(148,163,184,0.06) 14px 28px); }
  .pcard.win .hatch { background: repeating-linear-gradient(135deg, rgba(8,145,178,0.14) 0 14px, rgba(99,102,241,0.08) 14px 28px); color: #0891b2; }
  .ptxt { font-size: 27px; font-weight: 600; color: #64748b; line-height: 1.4; padding: 0 6px; }
  .pcard.win .ptxt { color: #334155; }
  .why { margin-top: 28px; background: linear-gradient(135deg, #f0f9ff 0%, #ede9fe 100%); border: 1.5px solid #e0f2fe; border-radius: 20px; padding: 32px 36px; font-size: 32px; font-weight: 700; color: #0f172a; line-height: 1.45; }
  .why span { display: block; margin-top: 10px; font-size: 25px; font-weight: 500; color: #64748b; }
  </style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="counter"><div class="counter-line"></div><span class="counter-text">Mudança <b>01</b> / 03</span></div>
    <div class="title">O que mudou, em <em class="g">uma frase</em></div>
    <div class="pair">
      <div class="pcard"><div class="ptag">Antes</div><div class="hatch">Recorte do antes</div><div class="ptxt">Como era, em uma linha.</div></div>
      <div class="pcard win"><div class="ptag">Depois</div><div class="hatch">Recorte do depois</div><div class="ptxt">Como ficou, em uma linha.</div></div>
    </div>
    <div class="why">Por que isso importa para o cliente.<span>Efeito percebido, sem prometer número que não se controla.</span></div>
  </div>
  <div class="progress"><div class="dot"></div><div class="dot active"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
