<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 40; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.14); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #64748b; z-index: 40; }
  .handle em { font-style: normal; color: #0891b2; }
  .g { background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.07) 2px, transparent 2px); background-size: 36px 36px; }
  .wrap { position: absolute; inset: 0; padding: 90px 84px 150px; z-index: 5; display: flex; flex-direction: column; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .ab { font-family: 'Archivo Black', sans-serif; text-transform: uppercase; letter-spacing: -0.02em; }
  .mark { background: linear-gradient(transparent 52%, rgba(6,182,212,0.42) 52%, rgba(6,182,212,0.42) 92%, transparent 92%); padding: 0 8px; margin: 0 -8px; }
  .mark2 { background: linear-gradient(transparent 52%, rgba(99,102,241,0.38) 52%, rgba(99,102,241,0.38) 92%, transparent 92%); padding: 0 8px; margin: 0 -8px; }
  .h1 { font-size: 100px; line-height: 1.0; color: #0f172a; transform: rotate(-3deg); transform-origin: left top; }
  .hand { font-family: 'Caveat', cursive; font-weight: 700; color: #0891b2; }
  .polaroid { background: #fff; padding: 22px 22px 70px; box-shadow: 0 30px 60px -26px rgba(15,23,42,0.45); width: 470px; transform: rotate(5deg); position: relative; }
  .ph { height: 420px; background: repeating-linear-gradient(135deg, rgba(148,163,184,0.2) 0 14px, rgba(148,163,184,0.08) 14px 28px); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 18px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; line-height: 1.5; }
  .polaroid .hand { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 40px; color: #0f172a; }
  .tape { position: absolute; width: 150px; height: 44px; background: rgba(99,102,241,0.28); border: 1px solid rgba(99,102,241,0.2); }
  .sticker { position: absolute; width: 170px; height: 170px; border-radius: 50%; background: linear-gradient(135deg, #06b6d4, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 36px; line-height: 1; transform: rotate(-12deg); box-shadow: 0 18px 36px -14px rgba(99,102,241,0.7); border: 5px solid #fff; }
  .note { position: relative; background: #fff; padding: 44px 48px 50px; box-shadow: 0 26px 50px -26px rgba(15,23,42,0.4); margin-bottom: 36px; }
  .note.a { transform: rotate(-2deg); } .note.b { transform: rotate(1.8deg); margin-left: 60px; background: #eef2ff; }
  .note .hand { font-size: 68px; line-height: 1; margin-bottom: 12px; }
  .note p { font-size: 37px; font-weight: 600; color: #334155; line-height: 1.45; }
  .note p b { color: #0f172a; font-weight: 800; }
  .circle { display: inline-flex; width: 76px; height: 76px; border-radius: 50%; align-items: center; justify-content: center; background: #0f172a; color: #fff; font-size: 40px; position: absolute; left: -26px; top: -28px; transform: rotate(-8deg); }
  .torn { background: #f8fafc; padding: 64px 56px 70px; clip-path: polygon(0 2%, 8% 0, 17% 2%, 28% 0, 40% 2%, 52% 0, 64% 2%, 76% 0, 88% 2%, 100% 0, 100% 98%, 90% 100%, 78% 98%, 64% 100%, 50% 98%, 36% 100%, 22% 98%, 10% 100%, 0 98%); transform: rotate(-2deg); }
  </style>
</head>
<body>
<div class="slide">
  <div class="dots"></div>
  <div class="wrap">
    <div class="mid">
      <div class="hand" style="font-size:54px;transform:rotate(-3deg);margin-bottom:10px">uma frase à mão, de abertura</div>
      <h1 class="ab h1">Título em <span class="mark">caixa alta</span> e <span class="mark2">torto</span></h1>
      <div style="position:relative;margin-top:44px;display:flex;justify-content:flex-end;padding-right:40px">
        <div class="polaroid"><div class="tape" style="top:-20px;left:150px;transform:rotate(-4deg)"></div><div class="ph">Foto · foto.jpg<br>4:5, borda branca</div><div class="hand">legenda à mão</div></div>
      </div>
      <div class="sticker ab" style="left:20px;bottom:40px;font-size:34px">Novo<br>post</div>
    </div>
  </div>
  <div class="progress"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
