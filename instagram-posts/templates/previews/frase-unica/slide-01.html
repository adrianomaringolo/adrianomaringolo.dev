<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #f5f7fa; }

  .bg-dots { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px);
    background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 880px; height: 880px; top: -340px; right: -320px;
    background: radial-gradient(circle, rgba(8,145,178,0.13) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 880px; height: 880px; bottom: -360px; left: -320px;
    background: radial-gradient(circle, rgba(99,102,241,0.11) 0%, transparent 70%); }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }

  .content { position: absolute; inset: 0; z-index: 10; padding: 120px 84px;
    display: flex; flex-direction: column; justify-content: center; }

  .mark { color: #0891b2; margin-bottom: 46px; }
  .headline { font-size: 108px; font-weight: 900; line-height: 1.02; letter-spacing: -0.042em; color: #0f172a; }
  .headline em { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { margin-top: 38px; font-size: 36px; font-weight: 500; color: #64748b; line-height: 1.45; max-width: 860px; }

  .handle { position: absolute; bottom: 64px; right: 72px; font-size: 24px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div>
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">
    <div class="mark">
      <svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/>
      </svg>
    </div>

    <h1 class="headline">Uma ideia forte<br>cabe em <em>uma frase</em>.</h1>
    <p class="subtitle">O desenvolvimento mora na legenda. Aqui, no máximo 12 palavras.</p>
  </div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
