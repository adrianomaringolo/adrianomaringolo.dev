<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0a1226; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0a1226; }

  .bg-photo { position: absolute; inset: 0;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.10) 0 24px, transparent 24px 48px),
      linear-gradient(160deg, #9aa8bd 0%, #6b7a91 50%, #3a4a61 100%); }
  .gradient-overlay { position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(10,18,38,0.92) 0%, rgba(10,18,38,0.80) 45%, rgba(10,18,38,0.88) 100%); }

  .photo-tag { position: absolute; left: 0; right: 0; bottom: 172px;
    display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 6; color: #94a3b8; }
  .photo-tag-label { font-size: 19px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
  .photo-tag-file { font-size: 17px; font-weight: 600; color: #64748b; }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }

  .content { position: absolute; inset: 0; z-index: 10; padding: 120px 84px;
    display: flex; flex-direction: column; justify-content: center; }

  .eyebrow { font-size: 21px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #94a3b8; margin-bottom: 30px; }
  .headline { font-size: 104px; font-weight: 900; line-height: 1.02; letter-spacing: -0.042em; color: #f1f5f9; }
  .headline em { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { margin-top: 38px; font-size: 35px; font-weight: 500; color: #cbd5e1; line-height: 1.45; max-width: 860px; }

  .handle { position: absolute; bottom: 64px; right: 72px; font-size: 26px; font-weight: 700; color: #f1f5f9; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-photo"></div>
  <div class="gradient-overlay"></div>

  <div class="photo-tag">
    <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
    </svg>
    <div class="photo-tag-label">Variante B · sobre foto</div>
    <div class="photo-tag-file">bg.jpg · área uniforme atrás do texto</div>
  </div>

  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">
    <div class="eyebrow">Opinião</div>
    <h1 class="headline">A mesma frase,<br>sobre <em>uma foto</em>.</h1>
    <p class="subtitle">Overlay escuro o bastante para o texto passar em contraste AA.</p>
  </div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
