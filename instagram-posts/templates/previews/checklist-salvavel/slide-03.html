<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #0f172a; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(99,102,241,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.08) 1px, transparent 1px); background-size: 54px 54px;
    -webkit-mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(248,250,252,0.04) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .bg-glow { position: absolute; top: -200px; right: -160px; width: 760px; height: 760px; background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 70%); }
  .bg-glow-low { position: absolute; bottom: -220px; left: -180px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 92px 84px 150px; display: flex; flex-direction: column; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 21px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #64748b; margin-bottom: 26px; }
  .headline { font-size: 88px; font-weight: 900; line-height: 1.03; letter-spacing: -0.035em; color: #f1f5f9; }
  .tag { font-size: 16px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #06b6d4; background: rgba(6,182,212,0.14); border-radius: 100px; padding: 7px 14px; white-space: nowrap; }
  .cta-label { font-size: 29px; font-weight: 600; color: #94a3b8; margin-bottom: 14px; }
  .cta-site { font-size: 66px; font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .cta { position: absolute; bottom: 158px; left: 88px; right: 80px; z-index: 15; }

  .content { padding: 116px 88px 0 88px; }
  .headline { font-size: 82px; line-height: 1.06; }
  .outs { margin-top: 56px; display: flex; flex-direction: column; gap: 20px; }
  .out { display: flex; gap: 26px; align-items: center; border-radius: 22px; padding: 30px 32px; background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.20); }
  .out.hi { background: linear-gradient(135deg, rgba(6,182,212,0.14), rgba(99,102,241,0.14)); border-color: rgba(6,182,212,0.40); }
  .out-ic { width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(148,163,184,0.14); color: #cbd5e1; }
  .out.hi .out-ic { background: linear-gradient(135deg, #06b6d4, #6366f1); color: #fff; }
  .out-if { font-size: 20px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
  .out.hi .out-if { color: #67e8f9; }
  .out-then { font-size: 36px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.015em; line-height: 1.25; }

  .save-big { width: 96px; height: 96px; border-radius: 24px; background: linear-gradient(135deg, #06b6d4, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 36px; box-shadow: 0 26px 50px -24px rgba(99,102,241,0.8); }
  </style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="bg-glow"></div><div class="bg-glow-low"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="save-big"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z" /></svg></div>
    <h1 class="headline">Salve para <em class="g">conferir antes</em> de decidir.</h1>
        <div class="outs">
      <div class="out"><div class="out-ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg></div><div><div class="out-if">Se faltou item</div><div class="out-then">Comente qual e eu respondo.</div></div></div>
      <div class="out hi"><div class="out-ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8" /><path d="M13 12h8" /><path d="M13 19h8" /><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /></svg></div><div><div class="out-if">Se vários estão sem marca</div><div class="out-then">Peça um orçamento e a gente resolve.</div></div></div>
    </div>
  </div>
  <div class="cta"><div class="cta-label">Peça um orçamento:</div><div class="cta-site">adrianomaringolo.dev</div></div>
  <div class="progress"><div class="dot"></div><div class="dot"></div><div class="dot active"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
