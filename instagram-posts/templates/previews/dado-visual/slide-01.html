<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #f5f7fa; }

  .bg-dots { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px);
    background-size: 40px 40px; }
  .blob-1 { position: absolute; top: -140px; right: -160px; width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(8,145,178,0.12) 0%, transparent 70%); }
  .blob-2 { position: absolute; bottom: -160px; left: -160px; width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%); }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }

  .content { position: absolute; inset: 0; z-index: 10; padding: 92px 84px 130px;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }

  .label { display: inline-flex; align-items: center; gap: 10px; width: fit-content;
    background: rgba(8,145,178,0.10); border: 1.5px solid rgba(8,145,178,0.25);
    border-radius: 100px; padding: 10px 22px; margin-bottom: 30px; }
  .label-dot { width: 8px; height: 8px; background: #0891b2; border-radius: 50%; }
  .label-text { font-size: 15px; font-weight: 700; color: #0891b2; letter-spacing: 0.1em; text-transform: uppercase; }

  .headline { font-size: 88px; font-weight: 900; line-height: 1.03; letter-spacing: -0.038em; color: #0f172a; }
  .headline em { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .chart-row { display: flex; align-items: center; gap: 60px; margin-top: 54px; width: 100%; }

  .chart { position: relative; width: 380px; height: 380px; border-radius: 50%; flex-shrink: 0;
    background: conic-gradient(#0891b2 0 84%, #e2e8f0 84% 100%); }
  .chart-center { position: absolute; inset: 52px; border-radius: 50%; background: #f5f7fa;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .chart-value { font-size: 100px; font-weight: 900; letter-spacing: -0.04em; line-height: 1;
    background: linear-gradient(90deg, #0891b2, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .chart-caption { font-size: 21px; font-weight: 700; color: #64748b; }

  .legend { display: flex; flex-direction: column; gap: 22px; flex: 1; }
  .legend-row { display: flex; align-items: center; gap: 16px; }
  .legend-chip { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0; }
  .chip-a { background: #0891b2; } .chip-b { background: #e2e8f0; }
  .legend-label { font-size: 25px; font-weight: 600; color: #475569; flex: 1; }
  .legend-value { font-size: 32px; font-weight: 800; color: #0f172a; }

  .footnote { margin-top: 54px; background: #fff; border: 1.5px solid #e2e8f0; border-left: 4px solid #0891b2;
    border-radius: 16px; padding: 26px 30px; }
  .footnote-text { font-size: 27px; font-weight: 600; color: #0f172a; line-height: 1.45; }

  .source { position: absolute; bottom: 46px; left: 84px; font-size: 17px; font-weight: 600; color: #94a3b8; z-index: 30; }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 22px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div>
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">
    <div class="label">
      <div class="label-dot"></div>
      <span class="label-text">Pesquisa · 2026</span>
    </div>

    <h1 class="headline">84% fazem<br>a <em>mesma coisa</em>.</h1>

    <div class="chart-row">
      <div class="chart">
        <div class="chart-center">
          <div class="chart-value">84%</div>
          <div class="chart-caption">do total</div>
        </div>
      </div>

      <div class="legend">
        <div class="legend-row">
          <span class="legend-chip chip-a"></span>
          <span class="legend-label">O que o dado mede</span>
          <span class="legend-value">84%</span>
        </div>
        <div class="legend-row">
          <span class="legend-chip chip-b"></span>
          <span class="legend-label">O resto</span>
          <span class="legend-value">16%</span>
        </div>
      </div>
    </div>

    <div class="footnote">
      <p class="footnote-text">A frase que traduz o número em consequência prática.</p>
    </div>
  </div>

  <div class="source">Fonte: Instituição, 2026</div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
