<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #080f1e; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; }

  .bg-grid { position: absolute; inset: 0; background-color: #080f1e;
    background-image:
      linear-gradient(rgba(99,102,241,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.09) 1px, transparent 1px);
    background-size: 54px 54px; }
  .bg-vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 30%, transparent 40%, rgba(8,15,30,0.6) 100%); }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }

  .content { position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: 88px 80px 0 88px; display: flex; flex-direction: column; gap: 18px; }

  .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: #475569; }
  .headline { font-size: 96px; font-weight: 900; line-height: 1.0; letter-spacing: -0.03em; color: #f1f5f9; }
  .headline-kicker { display: block; font-size: 46px; font-weight: 700; letter-spacing: -0.01em; color: #06b6d4; margin-bottom: 10px; }
  .headline-gradient { background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { font-size: 34px; font-weight: 500; color: #cbd5e1; line-height: 1.45; max-width: 820px; }

  .preview-wrap { position: absolute; bottom: 118px; left: 72px; right: 72px; z-index: 15; }
  .preview-glow { position: absolute; inset: -24px; border-radius: 28px;
    background: radial-gradient(ellipse at center, rgba(6,182,212,0.22), transparent 70%); filter: blur(28px); }
  .preview-frame { position: relative; border-radius: 18px; overflow: hidden;
    border: 1.5px solid rgba(148,163,184,0.22); box-shadow: 0 32px 80px rgba(0,0,0,0.55); background: #0f172a; }
  .preview-topbar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1e293b; }
  .preview-topbar span { width: 11px; height: 11px; border-radius: 50%; }
  .dot-r { background: #ef4444; } .dot-y { background: #eab308; } .dot-g { background: #22c55e; }

  /* placeholder de screenshot */
  .shot { height: 600px; position: relative; background: #111c30;
    background-image:
      repeating-linear-gradient(135deg, rgba(148,163,184,0.06) 0 20px, transparent 20px 40px); }
  .shot-inner { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; color: #64748b; }
  .shot-label { font-size: 20px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #94a3b8; }
  .shot-file { font-size: 17px; font-weight: 600; color: #64748b; }
  .shot-nav { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center;
    gap: 14px; padding: 0 28px; border-bottom: 1px solid rgba(148,163,184,0.12); }
  .shot-logo { width: 96px; height: 14px; border-radius: 7px; background: rgba(148,163,184,0.28); }
  .shot-li { width: 54px; height: 10px; border-radius: 5px; background: rgba(148,163,184,0.16); }

  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }

  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #f1f5f9; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">
    <div class="eyebrow">Case de projeto</div>
    <h1 class="headline">
      <span class="headline-kicker">Nome do Cliente</span>
      Site <span class="headline-gradient">completo</span>
    </h1>
    <p class="subtitle">O que foi entregue, em uma frase que o dono do negócio entenderia.</p>
  </div>

  <div class="preview-wrap">
    <div class="preview-glow"></div>
    <div class="preview-frame">
      <div class="preview-topbar"><span class="dot-r"></span><span class="dot-y"></span><span class="dot-g"></span></div>
      <div class="shot">
        <div class="shot-nav">
          <div class="shot-logo"></div>
          <div style="flex:1"></div>
          <div class="shot-li"></div><div class="shot-li"></div><div class="shot-li"></div>
        </div>
        <div class="shot-inner">
          <svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>
          </svg>
          <div class="shot-label">Screenshot do projeto</div>
          <div class="shot-file">shot-home.png · captura em 1440×900</div>
        </div>
      </div>
    </div>
  </div>

  <div class="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
