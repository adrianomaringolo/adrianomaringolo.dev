<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 820px; height: 820px; top: -300px; right: -280px; background: radial-gradient(circle, rgba(8,145,178,0.10) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 820px; height: 820px; bottom: -320px; left: -300px; background: radial-gradient(circle, rgba(99,102,241,0.09) 0%, transparent 70%); }

  .content { position: absolute; inset: 0; z-index: 10; padding: 100px 84px 150px; display: flex; flex-direction: column; justify-content: center; }
  .counter { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .counter-line { width: 44px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .counter-text { font-size: 19px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; }
  .counter-text b { color: #0891b2; font-weight: 800; }
  .eyebrow { font-size: 19px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #0891b2; margin-bottom: 26px; }
  .icon-wrap { width: 78px; height: 78px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: rgba(8,145,178,0.10); color: #0891b2; margin-bottom: 30px; }
  .bg-num { position: absolute; top: 24px; right: -46px; font-size: 440px; font-weight: 900; letter-spacing: -0.06em; line-height: 1; background: linear-gradient(135deg, rgba(8,145,178,0.08) 0%, rgba(99,102,241,0.05) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .title { font-size: 68px; font-weight: 900; color: #0f172a; line-height: 1.08; letter-spacing: -0.03em; margin-bottom: 26px; }
  .desc { font-size: 34px; font-weight: 500; color: #475569; line-height: 1.48; max-width: 912px; margin-bottom: 42px; }
  .rows { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-direction: column; gap: 8px; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 22px 26px; }
  .row.warn { border-left: 4px solid #94a3b8; }
  .row.do { border-left: 4px solid #0891b2; }
  .row-tag { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; }
  .row.do .row-tag { color: #0891b2; }
  .row-text { font-size: 30px; font-weight: 600; color: #334155; line-height: 1.4; }
  .highlight { background: linear-gradient(135deg, #f0f9ff 0%, #ede9fe 100%); border: 1.5px solid #e0f2fe; border-radius: 20px; padding: 34px 38px; font-size: 32px; font-weight: 700; color: #0f172a; line-height: 1.45; }
  .highlight span { display: block; margin-top: 12px; font-size: 25px; font-weight: 500; color: #64748b; }
  .note { margin-top: 30px; font-size: 25px; font-weight: 500; color: #64748b; line-height: 1.5; padding-left: 22px; border-left: 3px solid #e2e8f0; }
  .note b { color: #0f172a; font-weight: 700; }
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .vs-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 28px 28px 30px; display: flex; flex-direction: column; gap: 14px; }
  .vs-card.win { border-left: 5px solid #0891b2; box-shadow: 0 18px 40px -24px rgba(8,145,178,0.45); }
  .vs-tag { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8; }
  .vs-card.win .vs-tag { color: #0891b2; }
  .vs-text { font-size: 29px; font-weight: 600; color: #334155; line-height: 1.42; }
  .vs-card:not(.win) .vs-text { color: #64748b; }
  .steps3 { display: flex; gap: 16px; margin-bottom: 44px; }
  .step3 { flex: 1; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 24px 22px; display: flex; flex-direction: column; gap: 12px; color: #94a3b8; }
  .step3 .n { font-size: 18px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .step3 .l { font-size: 30px; font-weight: 800; color: #94a3b8; letter-spacing: -0.01em; }
  .step3.on { border: none; background: linear-gradient(135deg, #0891b2, #6366f1); color: #e0f2fe; box-shadow: 0 20px 44px -22px rgba(99,102,241,0.6); }
  .step3.on .l { color: #fff; }
  .step3.done { color: #0891b2; }
  .step3.done .l { color: #0f172a; }

  .content { position: absolute; inset: 0; z-index: 10; padding: 110px 84px 0 84px; display: flex; flex-direction: column; justify-content: flex-start; }
  .eyebrow { font-size: 20px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #0891b2; margin-bottom: 28px; }
  .headline { font-size: 84px; font-weight: 900; line-height: 1.05; letter-spacing: -0.035em; color: #0f172a; }
  .art { margin-top: 56px; }
  .art svg { width: 100%; height: auto; display: block; }
  .cta { position: absolute; bottom: 150px; left: 84px; right: 84px; z-index: 15; padding-top: 34px; border-top: 2px solid #e2e8f0; }
  .follow { display: inline-flex; align-items: center; gap: 16px; margin-bottom: 30px; padding: 16px 28px 16px 20px; border-radius: 100px; background: #ffffff; border: 1.5px solid #e2e8f0; box-shadow: 0 14px 34px -22px rgba(8,145,178,0.5); }
  .follow-ic { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #0891b2, #6366f1); color: #fff; display: flex; align-items: center; justify-content: center; }
  .follow-text { font-size: 29px; font-weight: 700; color: #0f172a; }
  .follow-text b { font-weight: 800; color: #0891b2; }
  .cta-label { font-size: 28px; font-weight: 600; color: #64748b; margin-bottom: 10px; }
  .cta-site { font-size: 66px; font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="eyebrow">Rótulo do fecho</div>
    <h1 class="headline">Frase de fechamento<br>com <em class="g">destaque</em>.</h1>
    <div class="art"><svg viewBox="0 0 912 470" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
        <filter id="sk" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="9" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/>
        </filter>
      </defs>
      <g filter="url(#sk)" fill="none" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- pedido -->
        <rect x="150" y="10" width="612" height="88" rx="44" fill="#ffffff"/>
        <circle cx="716" cy="54" r="30" fill="url(#g)" stroke="none"/>
        <!-- ramos -->
        <path d="M456 98 C456 140, 152 140, 152 196" stroke-dasharray="9 9"/>
        <path d="M456 98 L456 196" stroke-dasharray="9 9"/>
        <path d="M456 98 C456 140, 760 140, 760 196" stroke-dasharray="9 9"/>
        <!-- texto -->
        <rect x="36" y="196" width="232" height="208" rx="18" fill="#ffffff"/>
        <rect x="64" y="232" width="150" height="12" rx="6" fill="#cbd5e1" stroke="none"/>
        <rect x="64" y="262" width="176" height="12" rx="6" fill="#e2e8f0" stroke="none"/>
        <rect x="64" y="292" width="164" height="12" rx="6" fill="#e2e8f0" stroke="none"/>
        <rect x="64" y="322" width="176" height="12" rx="6" fill="#e2e8f0" stroke="none"/>
        <rect x="64" y="352" width="110" height="12" rx="6" fill="#e2e8f0" stroke="none"/>
        <!-- imagem -->
        <rect x="340" y="196" width="232" height="208" rx="18" fill="#ffffff"/>
        <rect x="364" y="220" width="184" height="160" rx="10" fill="#f1f5f9"/>
        <circle cx="510" cy="256" r="16"/>
        <polyline points="364,360 420,292 462,336 492,306 548,360"/>
        <!-- som -->
        <rect x="644" y="196" width="232" height="208" rx="18" fill="#ffffff"/>
        <line x1="682" y1="286" x2="682" y2="314"/><line x1="706" y1="266" x2="706" y2="334"/>
        <line x1="730" y1="246" x2="730" y2="354"/><line x1="754" y1="276" x2="754" y2="324"/>
        <line x1="778" y1="256" x2="778" y2="344"/><line x1="802" y1="282" x2="802" y2="318"/>
        <line x1="826" y1="268" x2="826" y2="332"/><line x1="850" y1="290" x2="850" y2="310"/>
      </g>
      <g transform="translate(698 36) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g>
      <text x="194" y="63" font-family="Manrope, sans-serif" font-size="28" font-weight="600" fill="#475569">o ponto de partida do tema…</text>
      <g font-family="Manrope, sans-serif" font-size="25" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="1.5">
        <text x="152" y="452">ITEM 1</text><text x="456" y="452">ITEM 2</text><text x="760" y="452">ITEM 3</text>
      </g>
    </svg></div>
  </div>
  <div class="cta">
    <div class="cta-label">Convite para o próximo passo:</div>
    <div class="cta-site">adrianomaringolo.dev</div>
  </div>
  <div class="progress"><div class="dot"></div><div class="dot"></div><div class="dot active"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
