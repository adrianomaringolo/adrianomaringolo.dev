<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0f172a; }
  .bg-dots { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(241,245,249,0.05) 1.5px, transparent 1.5px);
    background-size: 40px 40px; }
  .halo { position: absolute; left: 50%; top: 540px; width: 900px; height: 900px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(99,102,241,0.20) 0%, transparent 65%); }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }

  .art { position: absolute; left: 50%; top: 150px; width: 720px; height: 720px; transform: translateX(-50%); z-index: 10; }
  .art svg { width: 100%; height: 100%; display: block; }

  .phrase { position: absolute; left: 110px; right: 110px; top: 930px; z-index: 10;
    text-align: center; font-size: 60px; font-weight: 800; line-height: 1.12; letter-spacing: -0.03em; text-wrap: balance;
    color: #f1f5f9; }
  .phrase em { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .handle { position: absolute; bottom: 64px; left: 0; right: 0; text-align: center; font-size: 24px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
