<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0a1226; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #0a1226; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .bg-photo { position: absolute; inset: 0; background: url('bg-cover.jpg') 46% 0 / 132% auto no-repeat; }
  .gradient-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom,
    rgba(10,18,38,1.00) 0%, rgba(10,18,38,0.97) 24%, rgba(10,18,38,0.92) 40%, rgba(10,18,38,0.78) 54%,
    rgba(10,18,38,0.62) 68%, rgba(10,18,38,0.52) 82%, rgba(10,18,38,0.50) 100%); }
  .content { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 88px 80px 0 88px; display: flex; flex-direction: column; gap: 22px; }
  .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: #64748b; }
  .headline { font-size: 90px; font-weight: 900; line-height: 1.02; letter-spacing: -0.03em; color: #f1f5f9; }
  .headline-kicker { display: block; font-size: 44px; font-weight: 700; letter-spacing: -0.01em; color: #06b6d4; margin-bottom: 14px; }
  .subtitle { font-size: 36px; font-weight: 500; color: #cbd5e1; line-height: 1.5; max-width: 840px; }
  .arrow { margin-top: 6px; color: #ffffff; opacity: 0.75; }
  .handle { color: #f1f5f9; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-photo"></div>
  <div class="gradient-overlay"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="eyebrow">SEO · Busca local</div>
    <h1 class="headline">
      <span class="headline-kicker">A pergunta que incomoda</span>
      Por que o Google mostra o <span class="g">concorrente</span> e não você?
    </h1>
    <p class="subtitle">Quase nunca é sorte. É o que ele fez e você ainda não fez.</p>
    <div class="arrow"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></div>
  </div>
  <div class="progress"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
