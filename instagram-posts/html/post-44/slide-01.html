<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .poll { position: absolute; left: 50%; top: 520px; transform: translate(-50%, -50%); width: 760px; z-index: 10;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 40px; padding: 44px 44px 40px;
    box-shadow: 0 40px 90px -30px rgba(99,102,241,0.35), 0 20px 50px -20px rgba(8,145,178,0.25); }
  .poll-head { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; margin-bottom: 26px; }
  .poll-head i { width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #0891b2, #6366f1); }
  .opt { display: flex; align-items: center; gap: 22px; border: 1.5px solid #e2e8f0; border-radius: 22px; padding: 20px 24px; margin-top: 16px; }
  .letter { width: 58px; height: 58px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: #fff; background: linear-gradient(135deg, #0891b2, #6366f1); }
  .opt span { font-size: 33px; font-weight: 700; color: #0f172a; letter-spacing: -0.01em; }
  .phrase { position: absolute; left: 110px; right: 110px; top: 1000px; z-index: 10; text-align: center; font-size: 60px; font-weight: 800; line-height: 1.12; letter-spacing: -0.03em; text-wrap: balance; color: #0f172a; }
  .phrase em { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .handle { bottom: 64px; left: 0; right: 0; text-align: center; font-size: 24px; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="poll"><div class="poll-head"><i></i>Enquete</div><div class="opt"><div class="letter">A</div><span>Tenho e gosto</span></div><div class="opt"><div class="letter">B</div><span>Tenho, mas tenho vergonha</span></div><div class="opt"><div class="letter">C</div><span>Só tenho Instagram</span></div><div class="opt"><div class="letter">D</div><span>Ainda não tenho</span></div></div>
  <p class="phrase">Seu negócio tem site? <em>Comente a letra.</em></p>
  
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
