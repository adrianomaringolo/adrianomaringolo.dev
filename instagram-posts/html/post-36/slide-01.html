<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0a1226; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #0a1226; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .bg-grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(99,102,241,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.08) 1px, transparent 1px);
    background-size: 54px 54px;
    -webkit-mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); }
  .bg-glow { position: absolute; top: -200px; right: -160px; width: 760px; height: 760px; background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 70%); }
  .bg-glow-low { position: absolute; bottom: -220px; left: -180px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 70%); }

  .content { position: absolute; inset: 0; z-index: 10; padding: 92px 84px 150px; display: flex; flex-direction: column; }
  .eyebrow { font-size: 21px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #64748b; margin-bottom: 26px; }
  .headline { font-size: 90px; font-weight: 900; line-height: 1.03; letter-spacing: -0.035em; color: #f1f5f9; margin-bottom: 44px; }
  .panel { background: #0c1730; border: 1px solid rgba(6,182,212,0.24); border-radius: 22px; box-shadow: 0 34px 80px -22px rgba(0,0,0,0.62), inset 0 1px 0 rgba(255,255,255,0.05); padding: 32px 36px 30px; }
  .sbar { display: flex; align-items: center; gap: 16px; border: 1.5px solid rgba(148,163,184,0.28); border-radius: 100px; padding: 16px 26px; color: #94a3b8; margin-bottom: 26px; }
  .sbar span { font-size: 29px; font-weight: 600; color: #e2e8f0; }
  .res { display: flex; align-items: center; gap: 20px; padding: 14px 4px; border-bottom: 1px solid rgba(148,163,184,0.12); }
  .pos { width: 46px; height: 46px; border-radius: 12px; background: rgba(148,163,184,0.12); color: #cbd5e1; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .res-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .dom { font-size: 26px; font-weight: 700; color: #cbd5e1; }
  .line { height: 10px; border-radius: 5px; background: rgba(148,163,184,0.18); }
  .pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 22px 0 18px; font-size: 22px; font-weight: 700; color: #64748b; letter-spacing: 0.1em; text-transform: uppercase; }
  .pager .pg { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(148,163,184,0.25); letter-spacing: 0; }
  .pager .pg.on { background: linear-gradient(135deg, #06b6d4, #6366f1); border: none; color: #fff; }
  .res.you { border: 1.5px dashed rgba(6,182,212,0.6); border-radius: 14px; padding: 14px 16px; background: rgba(6,182,212,0.06); }
  .res.you .dom { color: #f1f5f9; }
  .tag { font-size: 16px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #06b6d4; background: rgba(6,182,212,0.14); border-radius: 100px; padding: 7px 14px; }
  .footnote { margin-top: 30px; font-size: 30px; font-weight: 500; color: #94a3b8; line-height: 1.45; }
  .footnote b { color: #e2e8f0; font-weight: 700; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-grid"></div><div class="bg-glow"></div><div class="bg-glow-low"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="eyebrow">Como o Google decide</div>
    <h1 class="headline">Você está na<br><span class="g">página 2</span> do Google?</h1>
    <div class="panel">
      <div class="sbar"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>fisioterapeuta em campinas</span></div>
      <div class="res"><div class="pos">1</div><div class="res-body"><div class="dom">concorrente-a.com.br</div><div class="line" style="width:78%"></div></div></div>
      <div class="res"><div class="pos">2</div><div class="res-body"><div class="dom">concorrente-b.com.br</div><div class="line" style="width:64%"></div></div></div>
      <div class="res"><div class="pos">3</div><div class="res-body"><div class="dom">concorrente-c.com.br</div><div class="line" style="width:70%"></div></div></div>
      <div class="pager"><span class="pg">1</span><span class="pg on">2</span><span class="pg">3</span><span>Próxima</span></div>
      <div class="res you"><div class="pos">14</div><div class="res-body"><div class="dom">seusite.com.br</div><div class="line" style="width:60%"></div></div><span class="tag">Você</span></div>
    </div>
    <p class="footnote">A página 2 é onde quase ninguém chega. <b>Veja como o Google decide quem fica na 1.</b></p>
  </div>
  <div class="progress"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
