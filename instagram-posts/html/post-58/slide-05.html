<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 820px; height: 820px; top: -300px; right: -280px; background: radial-gradient(circle, rgba(8,145,178,0.10) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 820px; height: 820px; bottom: -320px; left: -300px; background: radial-gradient(circle, rgba(99,102,241,0.09) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 100px 84px 150px; display: flex; flex-direction: column; justify-content: center; }
  .counter { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .counter-line { width: 44px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .counter-text { font-size: 19px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; }
  .counter-text b { color: #0891b2; font-weight: 800; }
  .kind { margin-left: auto; font-size: 16px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #0891b2; background: rgba(8,145,178,0.10); border-radius: 100px; padding: 8px 16px; }
  .kind.pain { color: #64748b; background: rgba(148,163,184,0.18); }
  .title { font-size: 66px; font-weight: 900; color: #0f172a; line-height: 1.08; letter-spacing: -0.03em; margin-bottom: 40px; }
  .note { margin-top: 34px; font-size: 28px; font-weight: 500; color: #64748b; line-height: 1.5; padding-left: 22px; border-left: 3px solid #e2e8f0; }
  .note b { color: #0f172a; font-weight: 700; }
  .ui { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 24px; padding: 34px 36px 30px; box-shadow: 0 30px 60px -36px rgba(15,23,42,0.28); }
  .ui-cap { margin-top: 22px; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; }
  /* chat */
  .chat { display: flex; flex-direction: column; gap: 16px; }
  .b { max-width: 640px; font-size: 31px; font-weight: 600; line-height: 1.38; padding: 20px 26px; border-radius: 22px; }
  .b.in { align-self: flex-start; background: #eef2f6; color: #334155; border-bottom-left-radius: 6px; }
  .b.out { align-self: flex-end; background: linear-gradient(135deg, #0891b2, #6366f1); color: #fff; border-bottom-right-radius: 6px; }
  .b small { display: block; margin-top: 6px; font-size: 19px; font-weight: 700; opacity: .7; letter-spacing: .02em; }
  /* serp */
  .sbar { display: flex; align-items: center; gap: 16px; border: 1.5px solid #e2e8f0; border-radius: 100px; padding: 18px 26px; font-size: 30px; font-weight: 600; color: #334155; margin-bottom: 22px; color: #0f172a; }
  .sbar svg { color: #94a3b8; flex-shrink: 0; }
  .res { padding: 16px 6px; border-top: 1px solid #eef2f6; }
  .res .u { font-size: 20px; font-weight: 600; color: #64748b; margin-bottom: 4px; }
  .res .t { font-size: 31px; font-weight: 800; color: #1d4ed8; line-height: 1.2; }
  .res .d { font-size: 22px; font-weight: 500; color: #94a3b8; margin-top: 4px; }
  .res.you { border: 2.5px dashed #cbd5e1; border-radius: 16px; margin-top: 14px; padding: 20px 24px; display: flex; align-items: center; gap: 18px; background: #f8fafc; }
  .res.you .t { color: #64748b; font-size: 28px; }
  .res.you .x { width: 44px; height: 44px; border-radius: 12px; background: rgba(148,163,184,0.2); color: #64748b; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  /* repeated questions */
  .qs { display: flex; flex-direction: column; gap: 14px; }
  .q { display: flex; align-items: center; gap: 20px; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 20px 24px; background: #fff; }
  .q-ic { width: 50px; height: 50px; border-radius: 13px; flex-shrink: 0; background: rgba(148,163,184,0.16); color: #64748b; display: flex; align-items: center; justify-content: center; }
  .q-t { font-size: 31px; font-weight: 700; color: #0f172a; flex: 1; }
  .q-n { font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #64748b; background: #f1f5f9; border-radius: 100px; padding: 7px 14px; white-space: nowrap; }
  /* sources diagram */
  .flow { display: flex; flex-direction: column; gap: 20px; }
  .lane { border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 22px 26px; background: #fff; }
  .lane.win { border-left: 5px solid #0891b2; box-shadow: 0 18px 40px -24px rgba(8,145,178,0.45); }
  .lane-tag { font-size: 18px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; margin-bottom: 14px; }
  .lane.win .lane-tag { color: #0891b2; }
  .lane-row { display: flex; align-items: center; gap: 16px; }
  .src { display: flex; flex-direction: column; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 12px; font-size: 27px; font-weight: 700; color: #334155; background: #f1f5f9; border-radius: 100px; padding: 10px 22px 10px 16px; width: fit-content; }
  .chip svg { color: #64748b; }
  .lane.win .chip { background: rgba(8,145,178,0.10); }
  .lane.win .chip svg { color: #0891b2; }
  .arr { color: #94a3b8; flex-shrink: 0; }
  .lane.win .arr { color: #0891b2; }
  .biz { margin-left: auto; font-size: 28px; font-weight: 800; color: #0f172a; border: 2px solid #e2e8f0; border-radius: 16px; padding: 18px 24px; background: #f8fafc; display: flex; align-items: center; gap: 12px; }
  .lane.win .biz { background: linear-gradient(135deg, #0891b2, #6366f1); color: #fff; border: none; }
  /* checklist */
  .checks { display: flex; flex-direction: column; gap: 14px; }
  .check { display: flex; align-items: center; gap: 20px; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 20px 24px; background: #fff; }
  .check-icon { width: 48px; height: 48px; border-radius: 13px; flex-shrink: 0; background: rgba(8,145,178,0.10); color: #0891b2; display: flex; align-items: center; justify-content: center; }
  .check-text { font-size: 30px; font-weight: 600; color: #334155; line-height: 1.3; }
  .check-text b { color: #0f172a; font-weight: 800; }
  .ui-head { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #64748b; margin-bottom: 22px; }
  .ui-head svg { color: #0891b2; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="counter"><div class="counter-line"></div><span class="counter-text">Sinal <b>04</b> / 05</span><span class="kind">Sinal de crescimento</span></div>
    <div class="title">Seus clientes só chegam<br><em class="g">por indicação</em></div>
    <div class="flow">
      <div class="lane">
        <div class="lane-tag">Hoje</div>
        <div class="lane-row"><div class="src"><span class="chip"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg>Indicação</span></div><span class="arr"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></span><div class="biz"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h4" /><path d="M10 8h4" /><path d="M14 21v-3a2 2 0 0 0-4 0v3" /><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" /><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" /></svg>Seu negócio</div></div>
      </div>
      <div class="lane win">
        <div class="lane-tag">Com site</div>
        <div class="lane-row"><div class="src"><span class="chip"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><path d="M16 3.128a4 4 0 0 1 0 7.744" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></svg>Indicação</span><span class="chip"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></svg>Google</span><span class="chip"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" /></svg>Assistentes de IA</span></div><span class="arr"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg></span><div class="biz"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h4" /><path d="M10 8h4" /><path d="M14 21v-3a2 2 0 0 0-4 0v3" /><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" /><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" /></svg>Seu negócio</div></div>
      </div>
    </div>
    <p class="note"><b>Indicação é ótima, mas tem teto:</b> depende de alguém se lembrar de você. O site abre outras portas sem fechar essa.</p>
  </div>
  <div class="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
