<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #ffffff; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 52px 72px 88px 80px; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }
  .blob-1 { position: absolute; top: -120px; right: -120px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 70%); pointer-events: none; }
  .blob-2 { position: absolute; bottom: -120px; left: -120px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99,102,241,0.05) 0%, transparent 70%); pointer-events: none; }

  .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; margin-bottom: 12px; }
  .title { font-size: 72px; font-weight: 900; color: #0f172a; line-height: 1.0; letter-spacing: -0.03em; }
  .title em { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .url-pill { display: inline-flex; align-items: center; gap: 12px; width: fit-content; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 100px; padding: 12px 26px; }
  .url-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  .url-text { font-size: 26px; font-weight: 700; color: #0f172a; letter-spacing: -0.01em; }

  .features { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .feat { display: flex; align-items: center; gap: 20px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 26px 28px; }
  .feat-icon { width: 54px; height: 54px; border-radius: 14px; flex-shrink: 0; background: linear-gradient(135deg, rgba(6,182,212,0.12), rgba(99,102,241,0.10)); display: flex; align-items: center; justify-content: center; color: #06b6d4; }
  .feat-label { font-size: 26px; font-weight: 700; color: #0f172a; line-height: 1.25; }

  .lh-section {}
  .lh-title { font-size: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8; margin-bottom: 26px; display: flex; align-items: center; gap: 12px; }
  .lh-title::before { content: ''; display: block; width: 32px; height: 2px; background: linear-gradient(90deg, #06b6d4, #6366f1); border-radius: 2px; }
  .lh-scores { display: flex; gap: 20px; }
  .lh-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .lh-circle { position: relative; width: 180px; height: 180px; }
  .lh-circle svg { width: 180px; height: 180px; }
  .lh-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 900; color: #0f172a; }
  .lh-label { font-size: 20px; font-weight: 700; color: #64748b; text-align: center; line-height: 1.2; }

  .progress { position: absolute; bottom: 44px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .handle { position: absolute; bottom: 38px; right: 72px; font-size: 20px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body>
<div class="slide">

  <div class="accent-left"></div><div class="accent-top"></div>

    <div class="feat">

  </div>

  <div class="lh-section">
    <div class="lh-title">Lighthouse Score</div>
    <div class="lh-scores">

  <div class="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot active"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
