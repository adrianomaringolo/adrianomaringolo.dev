<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Manrope', sans-serif; }

  .slide {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 76px 88px 104px;
  }

  .bg-photo {
    position: absolute; inset: 0;
    background: url('bg.jpg') center 30% / cover no-repeat;
    filter: url(#duoBlue) saturate(1.05) contrast(1.02);
  }

  .bg-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      165deg,
      rgba(9, 33, 70, 0.72) 0%,
      rgba(16, 50, 97, 0.52) 45%,
      rgba(7, 27, 58, 0.80) 100%
    );
  }

  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(12,44,89,0.10) 1.5px, transparent 1.5px);
    background-size: 40px 40px;
  }

  .accent-left {
    position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: linear-gradient(180deg, #06b6d4, #6366f1, #06b6d4);
  }
  .accent-top {
    position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #06b6d4, #6366f1);
  }

  .handle {
    position: absolute; bottom: 42px; right: 72px;
    font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.50);
    letter-spacing: 0.01em;
    z-index: 10;
  }
  .handle em { color: #06b6d4; font-style: normal; }

  .content {
    position: relative; z-index: 10;
    flex: 1; display: flex; flex-direction: column;
    justify-content: center;
    gap: 40px;
  }

  .label {
    display: inline-flex; align-items: center; gap: 10px; width: fit-content;
    background: rgba(6,182,212,0.15);
    border: 1.5px solid rgba(6,182,212,0.35);
    border-radius: 100px; padding: 12px 26px;
  }
  .label-dot { width: 9px; height: 9px; background: #06b6d4; border-radius: 50%; }
  .label-text { font-size: 18px; font-weight: 700; color: #22d3ee; letter-spacing: 0.1em; text-transform: uppercase; }

  /* --- Typographic composition --- */
  .quote-text { letter-spacing: -0.03em; }

  .l-sm {
    display: block;
    font-size: 48px; font-weight: 700;
    color: rgba(255,255,255,0.92);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .l-lg {
    display: block;
    font-size: 78px; font-weight: 800;
    color: #f8fafc;
    line-height: 1.08;
  }

  .l-xl {
    display: block;
    font-size: 104px; font-weight: 900;
    line-height: 1.2;
  }

  .grad {
    background: linear-gradient(90deg, #cfe3ff 0%, #f3ecff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* "SÓ" — badge chip, rotated for a hand-placed sticker feel */
  .chip-so {
    display: inline-block;
    background: linear-gradient(100deg, #cfe3ff, #f3ecff);
    color: #1e2b4d;
    font-size: 62px; font-weight: 900;
    padding: 4px 26px 10px;
    border-radius: 16px;
    transform: rotate(-4deg);
    box-shadow: 0 14px 34px rgba(207,227,255,0.30);
    margin-right: 18px;
    vertical-align: -8px;
  }

  /* "endereço seu" — highlighter-marker box behind gradient text */
  .mark-box {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(243,236,255,0.45);
    border-radius: 18px;
    padding: 4px 22px 12px;
    margin: 6px 0;
  }

  /* "te encontra." — hand-drawn underline swoosh for the payoff line */
  .underline-wrap { position: relative; display: inline-block; }
  .underline-wrap svg {
    position: absolute; left: -4px; right: -4px; bottom: -22px;
    width: calc(100% + 8px); height: 26px;
  }

</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute;">
  <filter id="duoBlue" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="
      0.2126 0.7152 0.0722 0 0
      0.2126 0.7152 0.0722 0 0
      0.2126 0.7152 0.0722 0 0
      0      0      0      1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.055 0.85"/>
      <feFuncG type="table" tableValues="0.184 0.92"/>
      <feFuncB type="table" tableValues="0.396 1.0"/>
    </feComponentTransfer>
  </filter>
</svg>
<div class="slide">
  <div class="bg-photo"></div>
  <div class="bg-overlay"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">

    <div class="label">
      <div class="label-dot"></div>
      <span class="label-text">Presença Digital</span>
    </div>

    <div class="quote-text">
      <span class="l-sm">Presença digital não é</span>
      <span class="l-lg"><span class="chip-so">SÓ</span>ter perfil no</span>
      <span class="l-xl grad">Instagram.</span>
      <span class="l-sm" style="margin-top: 4px;">É ter um</span>
      <span class="l-lg"><span class="mark-box"><span class="grad">endereço seu</span></span></span>
      <span class="l-sm" style="margin-top: 8px;">onde quem te procura,</span>
      <span class="l-xl">
        <span class="underline-wrap">
          <span class="grad">te encontra.</span>
          <svg viewBox="0 0 400 26" preserveAspectRatio="none" fill="none">
            <path d="M4 16C60 6 140 4 200 10C260 16 340 20 396 12" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="400" y2="0"><stop stop-color="#cfe3ff"/><stop offset="1" stop-color="#f3ecff"/></linearGradient></defs>
          </svg>
        </span>
      </span>
    </div>

  </div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
