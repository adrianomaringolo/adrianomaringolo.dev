<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 820px; height: 820px; top: -300px; right: -280px; background: radial-gradient(circle, rgba(8,145,178,0.10) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 820px; height: 820px; bottom: -320px; left: -300px; background: radial-gradient(circle, rgba(99,102,241,0.09) 0%, transparent 70%); }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  .content { position: absolute; inset: 0; z-index: 10; padding: 100px 84px 150px; display: flex; flex-direction: column; justify-content: center; }
  .counter { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .counter-line { width: 44px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .counter-text { font-size: 16px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; }
  .title { font-size: 66px; font-weight: 900; color: #0f172a; line-height: 1.08; letter-spacing: -0.03em; margin-bottom: 40px; }
  .title em { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .list { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 22px; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 24px 28px; }
  .ico { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(100,116,139,0.12); color: #64748b; }
  .row-text { font-size: 28px; font-weight: 600; color: #334155; line-height: 1.35; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 9px; z-index: 30; }
  .dot { width: 24px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 44px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 22px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>

  <div class="content">
    <div class="counter"><div class="counter-line"></div><span class="counter-text">Onde ela para</span></div>
    <div class="title">O que ela <em>não faz</em></div>
    <div class="list">
      <div class="row">
        <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        <div class="row-text">Entender o seu cliente e o que faz ele comprar.</div>
      </div>
      <div class="row">
        <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        <div class="row-text">Definir a estratégia de conversão do site.</div>
      </div>
      <div class="row">
        <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        <div class="row-text">Julgar performance, SEO, segurança e acessibilidade.</div>
      </div>
      <div class="row">
        <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        <div class="row-text">Assumir a responsabilidade quando algo dá errado.</div>
      </div>
    </div>
  </div>

  <div class="progress">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
