<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  em.g { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .dark em.g { background-image: linear-gradient(90deg, #06b6d4, #6366f1); }
  .handle { position: absolute; z-index: 30; font-size: 24px; font-weight: 700; color: #94a3b8; }
  .handle em { font-style: normal; color: #0891b2; }
  .dark .handle { color: #f1f5f9; }
  .dark .handle em { color: #06b6d4; }
  .bg-dots { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(15,23,42,0.045) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .dark .bg-dots { background-image: radial-gradient(circle, rgba(241,245,249,0.06) 1.5px, transparent 1.5px); }
  .blob-1 { position: absolute; width: 760px; height: 760px; border-radius: 50%; top: -260px; right: -260px;
    background: radial-gradient(circle, rgba(8,145,178,0.12), transparent 65%); }
  .blob-2 { position: absolute; width: 820px; height: 820px; border-radius: 50%; bottom: -320px; left: -300px;
    background: radial-gradient(circle, rgba(99,102,241,0.12), transparent 65%); }
  .dark .blob-1 { background: radial-gradient(circle, rgba(6,182,212,0.18), transparent 65%); }
  .dark .blob-2 { background: radial-gradient(circle, rgba(99,102,241,0.22), transparent 65%); }
  body, .slide { background: #0f172a; }
  .content { position: absolute; inset: 0; z-index: 10; padding: 96px 84px 140px;
    display: flex; flex-direction: column; justify-content: center; }
  .card { position: relative; width: 640px; height: 760px; margin-bottom: 56px; }
  .card::before { content: ''; position: absolute; inset: -10px; border-radius: 52px;
    background: linear-gradient(135deg, #06b6d4, #6366f1); opacity: 0.9; }
  .card img { position: relative; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%;
    border-radius: 44px; display: block; box-shadow: 0 40px 90px -30px rgba(99,102,241,0.6); }
  .tag { position: absolute; z-index: 2; right: -230px; top: 600px; padding: 18px 28px; border-radius: 22px;
    background: #ffffff; color: #0f172a; font-size: 28px; font-weight: 800; letter-spacing: -0.01em;
    box-shadow: 0 24px 50px -18px rgba(6,182,212,0.55); }
  .tag::after { content: ''; position: absolute; left: -12px; top: 22px; width: 24px; height: 24px;
    background: #ffffff; transform: rotate(45deg); border-radius: 4px; }
  .headline { font-size: 88px; font-weight: 900; line-height: 1.02; letter-spacing: -0.04em; color: #f1f5f9; }
  .subtitle { margin-top: 26px; font-size: 32px; font-weight: 500; color: #cbd5e1; line-height: 1.45; max-width: 760px; text-wrap: balance; }
  .handle { right: 84px; bottom: 72px; }
</style>
</head>
<body>
<div class="slide dark">
  <div class="blob-1"></div><div class="blob-2"></div><div class="bg-dots"></div>
  <div class="accent-left"></div><div class="accent-top"></div>

  <div class="content">
    <div class="card">
      <img src="../../assets/images-perfil/3x/02-ideia.png" alt="">
      <div class="tag">O que o seu cliente procura?</div>
    </div>
    <h1 class="headline">Antes do código,<br><em class="g">a pergunta certa</em>.</h1>
    <p class="subtitle">Todo projeto começa pelo seu negócio. A tecnologia vem depois.</p>
  </div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
