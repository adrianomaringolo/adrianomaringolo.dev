<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 820px; height: 820px; top: -300px; right: -280px; background: radial-gradient(circle, rgba(8,145,178,0.10) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 820px; height: 820px; bottom: -320px; left: -300px; background: radial-gradient(circle, rgba(99,102,241,0.09) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 110px 84px 0 84px; display: flex; flex-direction: column; }
  .eyebrow { font-size: 20px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #0891b2; margin-bottom: 28px; }
  .headline { font-size: 84px; font-weight: 900; line-height: 1.05; letter-spacing: -0.035em; color: #0f172a; }
  .art { margin-top: 50px; }
  .art svg { width: 100%; height: auto; display: block; }
  .cta { position: absolute; bottom: 150px; left: 84px; right: 84px; z-index: 15; padding-top: 34px; border-top: 2px solid #e2e8f0; }
  .cta-label { font-size: 29px; font-weight: 600; color: #64748b; margin-bottom: 12px; }
  .cta-site { font-size: 66px; font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="eyebrow">Conversa honesta</div>
    <h1 class="headline">Na dúvida,<br><em class="g">pergunte antes</em>.</h1>
    <div class="art"><svg viewBox="0 0 912 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
        <filter id="sk" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="9" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/>
        </filter>
      </defs>
      <g filter="url(#sk)" fill="none" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M430 500 C 430 430, 330 390, 120 372" />
        <path d="M482 500 C 482 430, 582 390, 792 372" />
        <path d="M120 372 L 30 366" stroke-dasharray="9 9"/>
        <path d="M792 372 L 882 366" stroke-dasharray="9 9"/>
        <line x1="456" y1="440" x2="456" y2="70"/>
        <path d="M444 110 H128 l-40 44 40 44 H444 z" fill="#ffffff"/>
        <path d="M468 222 H784 l40 44 -40 44 H468 z" fill="url(#g)" stroke="none"/>
        <path d="M468 222 H784 l40 44 -40 44 H468 z"/>
        <ellipse cx="456" cy="446" rx="60" ry="12" fill="#e2e8f0" stroke="none"/>
      </g>
      <g font-family="Manrope, sans-serif" font-weight="800" font-size="32">
        <text x="276" y="165" text-anchor="middle" fill="#0f172a">Construtor pronto</text>
        <text x="636" y="277" text-anchor="middle" fill="#ffffff">Sob medida</text>
      </g>
      <g font-family="Manrope, sans-serif" font-weight="700" font-size="23" fill="#64748b">
        <text x="40" y="420">rápido para começar</text>
        <text x="872" y="420" text-anchor="end">feito para crescer</text>
      </g>
    </svg></div>
  </div>
  <div class="cta">
    <div class="cta-label">Eu te digo qual caminho faz sentido:</div>
    <div class="cta-site">adrianomaringolo.dev</div>
  </div>
  <div class="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot active"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
