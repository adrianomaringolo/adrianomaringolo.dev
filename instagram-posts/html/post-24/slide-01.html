<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #080f1e; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; }

  .bg-grid { position: absolute; inset: 0; background-color: #080f1e;
    background-image:
      linear-gradient(rgba(99,102,241,0.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,102,241,0.09) 1px, transparent 1px);
    background-size: 54px 54px; }
  .bg-vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 30%, transparent 40%, rgba(8,15,30,0.6) 100%); }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }

  .content { position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: 88px 80px 0 88px; display: flex; flex-direction: column; gap: 18px; }

  .eyebrow { font-size: 23px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: #64748b; }
  .headline { font-size: 94px; font-weight: 900; line-height: 1.0; letter-spacing: -0.032em; color: #f1f5f9; }
  .headline-kicker { display: block; font-size: 50px; font-weight: 700; letter-spacing: -0.01em; color: #06b6d4; margin-bottom: 12px; }
  .headline-gradient { background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { font-size: 36px; font-weight: 500; color: #cbd5e1; line-height: 1.45; max-width: 850px; }

  .preview-wrap { position: absolute; bottom: 122px; left: 72px; right: 72px; z-index: 15; }
  .preview-glow { position: absolute; inset: -24px; border-radius: 28px;
    background: radial-gradient(ellipse at center, rgba(6,182,212,0.22), transparent 70%); filter: blur(28px); }
  .preview-frame { position: relative; border-radius: 18px; overflow: hidden;
    border: 1.5px solid rgba(148,163,184,0.22); box-shadow: 0 32px 80px rgba(0,0,0,0.55); background: #0f172a; }
  .preview-topbar { height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #1e293b; }
  .preview-topbar span { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #ef4444; } .dot-y { background: #eab308; } .dot-g { background: #22c55e; }
  .shot { height: 624px; overflow: hidden; }
  .shot img { width: 100%; display: block; object-fit: cover; object-position: top center; }

  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 26px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 46px; background: linear-gradient(90deg, #06b6d4, #6366f1); }

  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #f1f5f9; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-grid"></div>
  <div class="bg-vignette"></div>
  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">
    <div class="eyebrow">Case de projeto</div>
    <h1 class="headline">
      <span class="headline-kicker">Gota de Cura</span>
      O catálogo que <span class="headline-gradient">sustenta</span> uma causa
    </h1>
    <p class="subtitle">Aromaterapia artesanal, sem fins lucrativos. Toda a renda vai para trabalho assistencial.</p>
  </div>

  <div class="preview-wrap">
    <div class="preview-glow"></div>
    <div class="preview-frame">
      <div class="preview-topbar"><span class="dot-r"></span><span class="dot-y"></span><span class="dot-g"></span></div>
      <div class="shot"><img src="01-hero.jpg" alt=""></div>
    </div>
  </div>

  <div class="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
