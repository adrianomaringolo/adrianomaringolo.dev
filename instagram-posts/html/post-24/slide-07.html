<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0f172a;
    display: flex; flex-direction: column; justify-content: center; gap: 36px; padding: 84px 88px 140px; }

  .bg-dots { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.04) 1.5px, transparent 1.5px);
    background-size: 40px 40px; }
  .blob-1 { position: absolute; top: -120px; right: -140px; width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(6,182,212,0.13) 0%, transparent 70%); }
  .blob-2 { position: absolute; bottom: -140px; left: -120px; width: 640px; height: 640px;
    background: radial-gradient(circle, rgba(99,102,241,0.11) 0%, transparent 70%); }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }

  .content { position: relative; z-index: 10; display: flex; flex-direction: column; gap: 32px; }

  .label { display: inline-flex; align-items: center; gap: 11px; width: fit-content;
    background: rgba(6,182,212,0.10); border: 1.5px solid rgba(6,182,212,0.25);
    border-radius: 100px; padding: 12px 26px; }
  .label-dot { width: 9px; height: 9px; background: #06b6d4; border-radius: 50%; }
  .label-text { font-size: 17px; font-weight: 700; color: #06b6d4; letter-spacing: 0.1em; text-transform: uppercase; }

  .headline { font-size: 82px; font-weight: 900; color: #f1f5f9; line-height: 1.02; letter-spacing: -0.032em; }
  .headline em { font-style: normal; background: linear-gradient(90deg, #06b6d4 0%, #6366f1 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .sub { font-size: 33px; font-weight: 500; color: #94a3b8; line-height: 1.45; max-width: 820px; }

  .visit { display: flex; align-items: center; gap: 16px; background: rgba(148,163,184,0.08);
    border: 1.5px solid rgba(148,163,184,0.18); border-radius: 18px; padding: 26px 30px; width: fit-content; }
  .visit-icon { color: #06b6d4; display: flex; }
  .visit-text { font-size: 28px; font-weight: 700; color: #e2e8f0; }
  .visit-text span { color: #94a3b8; font-weight: 500; }

  .cta-box { background: rgba(6,182,212,0.08); border: 1.5px solid rgba(6,182,212,0.22);
    border-radius: 22px; padding: 36px 42px; display: flex; flex-direction: column; gap: 10px; }
  .cta-label { font-size: 19px; font-weight: 700; color: #64748b; letter-spacing: 0.08em; text-transform: uppercase; }
  .cta-url { font-size: 54px; font-weight: 900; letter-spacing: -0.025em;
    background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 26px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 46px; background: linear-gradient(90deg, #06b6d4, #6366f1); }

  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #f1f5f9; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div>
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">
    <div class="label">
      <div class="label-dot"></div>
      <span class="label-text">Seu projeto também pode</span>
    </div>

    <div class="headline">Site bom não é<br>só <em>bonito</em>.</div>
    <div class="sub">É o que segura a operação de quem está do outro lado todo dia.</div>

    <div class="visit">
      <div class="visit-icon">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </div>
      <div class="visit-text">gotadecura.com.br <span>· conheça o projeto</span></div>
    </div>

    <div class="cta-box">
      <div class="cta-label">vamos dimensionar o seu</div>
      <div class="cta-url">adrianomaringolo.dev</div>
    </div>
  </div>

  <div class="progress"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
