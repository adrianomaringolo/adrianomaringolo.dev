<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0a1226; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #0a1226; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .bg-grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(99,102,241,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.08) 1px, transparent 1px);
    background-size: 54px 54px;
    -webkit-mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); }
  .bg-glow { position: absolute; top: -200px; right: -160px; width: 760px; height: 760px; background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 70%); }
  .bg-glow-low { position: absolute; bottom: -220px; left: -180px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 92px 84px 150px; display: flex; flex-direction: column; }
  .eyebrow { font-size: 21px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #64748b; margin-bottom: 26px; }
  .headline { font-size: 84px; font-weight: 900; line-height: 1.03; letter-spacing: -0.035em; color: #f1f5f9; margin-bottom: 44px; }
  .panel { background: #0c1730; border: 1px solid rgba(6,182,212,0.24); border-radius: 22px; box-shadow: 0 34px 80px -22px rgba(0,0,0,0.62), inset 0 1px 0 rgba(255,255,255,0.05); padding: 32px 36px 30px; }
  .footnote { margin-top: 30px; font-size: 30px; font-weight: 500; color: #94a3b8; line-height: 1.45; }
  .footnote b { color: #e2e8f0; font-weight: 700; }
  .tag { font-size: 16px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #06b6d4; background: rgba(6,182,212,0.14); border-radius: 100px; padding: 7px 14px; white-space: nowrap; }
  .line { height: 10px; border-radius: 5px; background: rgba(148,163,184,0.18); }
  .wf-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .wf { display: flex; flex-direction: column; gap: 14px; }
  .wf-box { height: 400px; border-radius: 16px; background: #0b1324; border: 1px solid rgba(148,163,184,0.18); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .wf-label { font-size: 27px; font-weight: 800; color: #f1f5f9; }
  .wf-sub { font-size: 21px; font-weight: 600; color: #94a3b8; margin-top: -6px; }
  .b { height: 11px; border-radius: 6px; background: rgba(148,163,184,0.24); }
  .b.hi { background: rgba(241,245,249,0.55); height: 15px; }
  .blk { border-radius: 9px; background: rgba(148,163,184,0.12); }
  .btn { height: 34px; width: 170px; border-radius: 17px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .r { display: flex; gap: 10px; align-items: center; }
  .navp { font-size: 15px; font-weight: 700; color: #94a3b8; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-grid"></div><div class="bg-glow"></div><div class="bg-glow-low"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="eyebrow">Formatos de site</div>
    <h1 class="headline">Landing page ou<br><span class="g">site institucional</span>?</h1>
    <div class="panel"><div class="wf-wrap">
      <div class="wf"><div class="wf-box" style="align-items:center;justify-content:center;gap:16px">
          <div class="b hi" style="width:80%"></div><div class="b" style="width:62%"></div><div class="b" style="width:50%"></div>
          <div class="btn" style="margin:10px 0"></div>
          <div class="r" style="width:86%"><div class="blk" style="flex:1;height:58px"></div><div class="blk" style="flex:1;height:58px"></div><div class="blk" style="flex:1;height:58px"></div></div>
          <div class="btn" style="width:130px;height:28px;opacity:.7"></div>
        </div><div class="wf-label">Landing page</div><div class="wf-sub">1 página, 1 objetivo</div></div>
      <div class="wf"><div class="wf-box">
          <div class="r"><div class="b" style="width:46px;background:linear-gradient(90deg,#06b6d4,#6366f1)"></div><div style="flex:1"></div><span class="navp">Sobre</span><span class="navp">Serviços</span><span class="navp">Contato</span></div>
          <div class="r" style="flex:1;align-items:stretch;margin-top:6px"><div style="flex:1.1;display:flex;flex-direction:column;gap:10px;justify-content:center"><div class="b hi" style="width:92%"></div><div class="b" style="width:74%"></div><div class="b" style="width:58%"></div></div><div class="blk" style="flex:1"></div></div>
          <div class="r"><div class="blk" style="flex:1;height:70px"></div><div class="blk" style="flex:1;height:70px"></div><div class="blk" style="flex:1;height:70px"></div></div>
          <div class="b" style="width:100%;height:30px;border-radius:8px;background:rgba(148,163,184,0.10)"></div>
        </div><div class="wf-label">Site institucional</div><div class="wf-sub">várias páginas, apresentar o negócio</div></div>
    </div></div>
    <p class="footnote">Parecem iguais na vitrine. <b>Funcionam de jeitos opostos.</b></p>
  </div>
  <div class="progress"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
