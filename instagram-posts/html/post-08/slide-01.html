<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }

  .slide {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    background: #f5f7fa;
    display: flex; flex-direction: column;
    padding: 64px 88px 92px;
  }

  .blob-1 {
    position: absolute; top: -220px; right: -180px;
    width: 720px; height: 720px; border-radius: 50%;
    background: radial-gradient(circle, rgba(8,145,178,0.14) 0%, transparent 70%);
    animation: drift-a 9s ease-in-out infinite;
  }
  .blob-2 {
    position: absolute; bottom: -260px; left: -200px;
    width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.13) 0%, transparent 70%);
    animation: drift-b 11s ease-in-out infinite;
  }
  @keyframes drift-a {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-26px, 22px) scale(1.06); }
  }
  @keyframes drift-b {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(24px, -20px) scale(1.05); }
  }

  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px);
    background-size: 40px 40px;
  }

  .accent-left {
    position: absolute; left: 0; top: 0; bottom: 0; width: 7px;
    background: linear-gradient(180deg, #0891b2, #6366f1, #0891b2);
    background-size: 100% 200%;
    animation: sweep-y 5s linear infinite;
  }
  .accent-top {
    position: absolute; top: 0; left: 0; right: 0; height: 7px;
    background: linear-gradient(90deg, #0891b2, #6366f1, #0891b2);
    background-size: 200% 100%;
    animation: sweep-x 5s linear infinite;
  }
  @keyframes sweep-x { to { background-position: -200% 0; } }
  @keyframes sweep-y { to { background-position: 0 -200%; } }

  .handle {
    position: absolute; bottom: 40px; right: 72px;
    font-size: 26px; font-weight: 700; color: #94a3b8;
    letter-spacing: 0.01em;
    animation: fade-in 0.5s ease-out 1.15s both;
  }
  .handle em { color: #0891b2; font-style: normal; }

  .content {
    position: relative; z-index: 10;
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* ---- Entradas ---- */
  @keyframes fade-in     { from { opacity: 0; }                              to { opacity: 1; } }
  @keyframes drop-in     { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: none; } }
  @keyframes rise-in     { from { opacity: 0; transform: translateY(34px); }  to { opacity: 1; transform: none; } }
  @keyframes slide-in    { from { opacity: 0; transform: translateX(-46px); } to { opacity: 1; transform: none; } }
  @keyframes pop-in      {
    0%   { opacity: 0; transform: scale(0.72); }
    70%  { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }

  .label {
    display: inline-flex; align-items: center; gap: 12px;
    background: rgba(8,145,178,0.12);
    border: 2px solid rgba(8,145,178,0.32);
    border-radius: 100px; padding: 13px 30px;
    animation: drop-in 0.6s cubic-bezier(.2,.8,.3,1) both;
  }
  .label-dot {
    width: 11px; height: 11px; background: #0891b2; border-radius: 50%;
    animation: blink 2.2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1;   box-shadow: 0 0 0 0 rgba(8,145,178,0.45); }
    50%      { opacity: 0.55; box-shadow: 0 0 0 9px rgba(8,145,178,0); }
  }
  .label-text { font-size: 21px; font-weight: 800; color: #0891b2; letter-spacing: 0.1em; text-transform: uppercase; }

  .headline {
    margin-top: 30px;
    font-size: 86px; font-weight: 900;
    color: #0f172a; line-height: 1.06;
    letter-spacing: -0.035em; text-align: center;
    animation: rise-in 0.7s cubic-bezier(.2,.8,.3,1) 0.12s both;
  }
  .headline em {
    font-style: normal;
    background: linear-gradient(90deg, #0891b2 0%, #6366f1 45%, #0891b2 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4.5s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 0; }
    50%      { background-position: 100% 0; }
  }

  /* ---- Donut ---- */
  .chart {
    margin-top: 30px;
    position: relative;
    width: 460px; height: 460px;
    animation: fade-in 0.5s ease-out 0.3s both;
  }
  .chart::before {
    content: ''; position: absolute; inset: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(8,145,178,0.18) 0%, transparent 62%);
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.94); opacity: 0.75; }
    50%      { transform: scale(1.04); opacity: 1; }
  }
  .chart svg { display: block; position: relative; }

  .slice { animation: draw 1.1s cubic-bezier(.25,.9,.3,1) 0.35s both; }
  .slice-a { --to: 942 189; }
  .slice-b { --to: 173 958; }
  @keyframes draw {
    from { stroke-dasharray: 0 1131; }
    to   { stroke-dasharray: var(--to); }
  }

  .chart-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
  }
  .chart-value {
    font-size: 112px; font-weight: 900; color: #0f172a;
    letter-spacing: -0.055em; line-height: 1;
    animation: pop-in 0.55s cubic-bezier(.2,.9,.3,1) 0.45s both;
  }
  .chart-caption {
    font-size: 24px; font-weight: 800; color: #64748b;
    letter-spacing: 0.07em; text-transform: uppercase;
    animation: fade-in 0.5s ease-out 0.85s both;
  }

  /* ---- Legenda ---- */
  .legend {
    margin-top: 34px;
    width: 100%;
    display: flex; flex-direction: column; gap: 18px;
  }
  .legend-row {
    display: flex; align-items: center; gap: 24px;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 22px;
    padding: 24px 32px;
    box-shadow: 0 4px 16px rgba(15,23,42,0.05);
    animation: slide-in 0.5s cubic-bezier(.2,.8,.3,1) both;
  }
  .legend-row:nth-child(1) {
    animation-delay: 0.85s;
    border-color: rgba(8,145,178,0.45);
    background: linear-gradient(90deg, rgba(8,145,178,0.07), #ffffff 42%);
    box-shadow: 0 6px 22px rgba(8,145,178,0.13);
  }
  .legend-row:nth-child(2) { animation-delay: 0.98s; }
  .legend-chip { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; }
  .legend-label { font-size: 36px; font-weight: 800; color: #0f172a; flex: 1; letter-spacing: -0.02em; }
  .legend-value { font-size: 52px; font-weight: 900; color: #0f172a; letter-spacing: -0.03em; }
  .legend-row:nth-child(1) .legend-value { color: #0891b2; }

  /* ---- Rodapé ---- */
  .footnote {
    margin-top: 28px;
    display: flex; align-items: center; gap: 18px;
    width: 100%;
    animation: rise-in 0.5s ease-out 1.05s both;
  }
  .footnote svg {
    color: #0891b2; flex-shrink: 0;
    animation: spark 2.6s ease-in-out infinite;
  }
  @keyframes spark {
    0%, 100% { transform: scale(1);    opacity: 1; }
    50%      { transform: scale(1.16); opacity: 0.75; }
  }
  .footnote-text { font-size: 34px; font-weight: 700; color: #475569; line-height: 1.35; }
  .footnote-text strong { color: #0f172a; font-weight: 900; }

  .source {
    margin-top: 18px;
    font-size: 21px; font-weight: 600; color: #94a3b8;
    letter-spacing: 0.02em; align-self: flex-start;
    animation: fade-in 0.5s ease-out 1.15s both;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">

    <div class="label">
      <div class="label-dot"></div>
      <span class="label-text">Stack Overflow 2025</span>
    </div>

    <div class="headline">
      Quantos devs<br>
      <em>realmente</em> usam IA?
    </div>

    <div class="chart">
      <svg width="460" height="460" viewBox="0 0 480 480">
        <!-- trilha: cor da superficie, aparece so nos vaos entre as fatias -->
        <circle cx="240" cy="240" r="180" fill="none" stroke="#f5f7fa" stroke-width="84"/>
        <g transform="rotate(-90 240 240)">
          <!-- 84% — usam ou planejam usar -->
          <circle class="slice slice-a" cx="240" cy="240" r="180" fill="none" stroke="#0891b2" stroke-width="84"
                  stroke-dasharray="942 189" stroke-dashoffset="-4"/>
          <!-- 16% — nao pretendem usar -->
          <circle class="slice slice-b" cx="240" cy="240" r="180" fill="none" stroke="#6366f1" stroke-width="84"
                  stroke-dasharray="173 958" stroke-dashoffset="-954"/>
        </g>
      </svg>
      <div class="chart-center">
        <div class="chart-value" id="value">84%</div>
        <div class="chart-caption">usam IA</div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-row">
        <div class="legend-chip" style="background:#0891b2"></div>
        <div class="legend-label">Usam ou planejam usar</div>
        <div class="legend-value">84%</div>
      </div>
      <div class="legend-row">
        <div class="legend-chip" style="background:#6366f1"></div>
        <div class="legend-label">Não pretendem usar</div>
        <div class="legend-value">16%</div>
      </div>
    </div>

    <div class="footnote">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
      <div class="footnote-text">E <strong>47%</strong> usam IA todos os dias.</div>
    </div>

    <div class="source">Fonte: Stack Overflow Developer Survey 2025 (49.000+ devs).</div>

  </div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>

<script>
  // Contagem 0 → 84 acompanhando o desenho do donut.
  // Comeca e termina bem antes do screenshot (2s), e o valor final ja esta no HTML
  // caso o script nao rode.
  (function () {
    var el = document.getElementById('value');
    var START = 350, DUR = 950, t0 = null;

    function frame(now) {
      if (t0 === null) t0 = now;
      var t = (now - t0 - START) / DUR;
      if (t < 0) { requestAnimationFrame(frame); return; }
      if (t >= 1) { el.textContent = '84%'; return; }
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(eased * 84) + '%';
      requestAnimationFrame(frame);
    }

    el.textContent = '0%';
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
