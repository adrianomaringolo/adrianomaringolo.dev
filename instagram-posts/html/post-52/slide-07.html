<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #0f172a; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(148,163,184,0.10) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 900px; height: 900px; top: -330px; left: -300px; background: radial-gradient(circle, rgba(6,182,212,0.20) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 900px; height: 900px; bottom: -340px; right: -320px; background: radial-gradient(circle, rgba(99,102,241,0.20) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 116px 88px 0 88px; display: flex; flex-direction: column; }
  .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #64748b; margin-bottom: 34px; }
  .headline { font-size: 78px; font-weight: 900; line-height: 1.06; letter-spacing: -0.035em; color: #f1f5f9; }
  .subtitle { margin-top: 34px; font-size: 36px; font-weight: 500; color: #94a3b8; line-height: 1.48; max-width: 880px; }
  .rule { margin-top: 46px; display: flex; flex-direction: column; gap: 18px; }
  .rule-item { display: flex; align-items: center; gap: 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.20); border-radius: 16px; padding: 24px 28px; }
  .rule-icon { width: 52px; height: 52px; border-radius: 13px; flex-shrink: 0; background: rgba(6,182,212,0.14); color: #06b6d4; display: flex; align-items: center; justify-content: center; }
  .rule-text { font-size: 31px; font-weight: 600; color: #e2e8f0; line-height: 1.35; }
  .cta { position: absolute; bottom: 158px; left: 88px; right: 80px; z-index: 15; }
  .cta-label { font-size: 29px; font-weight: 600; color: #94a3b8; margin-bottom: 14px; }
  .cta-site { font-size: 66px; font-weight: 900; letter-spacing: -0.03em; background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .content { bottom: 330px; }
  .outs, .ans { margin-top: auto !important; margin-bottom: auto; }
  .outs { display: flex; flex-direction: column; gap: 24px; }
  .out { display: flex; gap: 28px; align-items: center; border-radius: 24px; padding: 38px 36px; background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.20); }
  .out.hi { background: linear-gradient(135deg, rgba(6,182,212,0.14), rgba(99,102,241,0.14)); border-color: rgba(6,182,212,0.40); }
  .out-ic { width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(148,163,184,0.14); color: #cbd5e1; }
  .out.hi .out-ic { background: linear-gradient(135deg, #06b6d4, #6366f1); color: #fff; }
  .out-if { font-size: 21px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
  .out.hi .out-if { color: #67e8f9; }
  .out-then { font-size: 37px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.015em; line-height: 1.25; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="eyebrow">Minha resposta</div>
    <h1 class="headline">Vale estudar.<br><em class="g">Do jeito certo.</em></h1>
    <div class="outs"><div class="out"><div class="out-ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg></div><div><div class="out-if">Se você está começando</div><div class="out-then">Foque em fundamentos e use a IA para aprender, não para pular etapas.</div></div></div><div class="out hi"><div class="out-ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg></div><div><div class="out-if">Se você já programa</div><div class="out-then">Aprenda a revisar e a decidir. É aí que está o valor agora.</div></div></div></div>
  </div>
  <div class="cta">
    <div class="cta-label">Mais sobre carreira e IA no blog:</div>
    <div class="cta-site">adrianomaringolo.dev</div>
  </div>
  <div class="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot active"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
