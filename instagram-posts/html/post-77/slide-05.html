<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0f172a; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 26px; height: 6px; border-radius: 3px; }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 24px; font-weight: 700; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
  .g { background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .light .g { background-image: linear-gradient(90deg, #0891b2, #6366f1); }
  .dark .dot { background: rgba(255,255,255,0.18); } .dark .handle { color: #f1f5f9; }
  .light .dot { background: #e2e8f0; } .light .handle { color: #94a3b8; } .light .handle em { color: #0891b2; }
  .dark .dot.active { width: 46px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .light .dot.active { width: 46px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .bg-grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(99,102,241,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.09) 1px, transparent 1px);
    background-size: 54px 54px; }
  .bg-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 30%, transparent 40%, rgba(8,15,30,0.6) 100%); }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .dark .bg-dots { background-image: radial-gradient(circle, rgba(248,250,252,0.04) 1.5px, transparent 1.5px); }
  .blob-1 { position: absolute; top: -100px; right: -120px; width: 660px; height: 660px; background: radial-gradient(circle, rgba(8,145,178,0.11) 0%, transparent 70%); }
  .blob-2 { position: absolute; bottom: -110px; left: -100px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%); }
  .eyebrow { font-size: 21px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; }
  .light .eyebrow { color: #0891b2; } .dark .eyebrow { color: #64748b; }
  .frame { position: relative; border-radius: 18px; overflow: hidden; border: 1.5px solid rgba(148,163,184,0.25); background: #0f172a; }
  .light .frame { box-shadow: 0 30px 70px -24px rgba(15,23,42,0.35); }
  .dark .frame { box-shadow: 0 32px 80px rgba(0,0,0,0.55); }
  .topbar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1e293b; }
  .topbar span { width: 11px; height: 11px; border-radius: 50%; }
  .topbar .url { width: auto; height: auto; border-radius: 6px; margin-left: 10px; padding: 3px 12px; background: #0f172a; color: #94a3b8; font-size: 14px; font-weight: 600; }
  .r { background: #ef4444; } .y { background: #eab308; } .gg { background: #22c55e; }
  .shot { overflow: hidden; } .shot img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .phone { border-radius: 40px; padding: 12px; background: #0f172a; box-shadow: 0 30px 70px -24px rgba(15,23,42,0.45); }
  .phone img { display: block; width: 100%; border-radius: 30px; }

  .content { position: absolute; inset: 0; z-index: 10; padding: 92px 88px 140px; display: flex; flex-direction: column; justify-content: center; }
  .headline { margin-top: 26px; font-size: 80px; font-weight: 900; line-height: 1.06; letter-spacing: -0.035em; color: #f1f5f9; }
  .outs { margin-top: 56px; display: flex; flex-direction: column; gap: 20px; }
  .out { display: flex; gap: 26px; align-items: center; border-radius: 22px; padding: 30px 32px; background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.20); }
  .out.hi { background: linear-gradient(135deg, rgba(6,182,212,0.14), rgba(99,102,241,0.14)); border-color: rgba(6,182,212,0.40); }
  .out-ic { width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(148,163,184,0.14); color: #cbd5e1; }
  .out.hi .out-ic { background: linear-gradient(135deg, #06b6d4, #6366f1); color: #fff; }
  .out-if { font-size: 20px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
  .out.hi .out-if { color: #67e8f9; }
  .out-then { font-size: 36px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.015em; line-height: 1.25; }
  .cta { margin-top: 70px; }
  .cta-label { font-size: 29px; font-weight: 600; color: #94a3b8; margin-bottom: 14px; }
  .cta-site { font-size: 66px; font-weight: 900; letter-spacing: -0.03em; }
</style>
</head>
<body>
<div class="slide dark">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="eyebrow">O que mudou</div>
    <h1 class="headline">Mesmo conteúdo.<br>Agora <span class="g">parece a marca</span>.</h1>
    <div class="outs">
      <div class="out"><div class="out-ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></div><div><div class="out-if">Se a sua marca mudou e o site não</div><div class="out-then">Eu mostro o que ajustar, sem compromisso.</div></div></div>
      <div class="out hi"><div class="out-ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></div><div><div class="out-if">Se quer chegar no depois</div><div class="out-then">Orçamento com prazo e preço fechados.</div></div></div>
    </div>
    <div class="cta"><div class="cta-label">Peça um orçamento:</div><div class="cta-site g">adrianomaringolo.dev</div></div>
  </div>
  <div class="progress"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
