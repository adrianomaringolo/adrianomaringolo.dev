<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0a1226; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: #0a1226; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 26px; height: 6px; border-radius: 3px; }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 24px; font-weight: 700; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
  .g { background: linear-gradient(90deg, #06b6d4, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .light .g { background-image: linear-gradient(90deg, #0891b2, #6366f1); }
  .dark .dot { background: rgba(255,255,255,0.18); } .dark .handle { color: #f1f5f9; }
  .light .dot { background: #e2e8f0; } .light .handle { color: #94a3b8; } .light .handle em { color: #0891b2; }
  .dark .dot.active { width: 46px; background: linear-gradient(90deg, #06b6d4, #6366f1); }
  .light .dot.active { width: 46px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .bg-grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(99,102,241,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.09) 1px, transparent 1px);
    background-size: 54px 54px; }
  .bg-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 30%, transparent 40%, rgba(8,15,30,0.6) 100%); }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .dark .bg-dots { background-image: radial-gradient(circle, rgba(248,250,252,0.04) 1.5px, transparent 1.5px); }
  .blob-1 { position: absolute; top: -100px; right: -120px; width: 660px; height: 660px; background: radial-gradient(circle, rgba(8,145,178,0.11) 0%, transparent 70%); }
  .blob-2 { position: absolute; bottom: -110px; left: -100px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%); }
  .eyebrow { font-size: 21px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; }
  .light .eyebrow { color: #0891b2; } .dark .eyebrow { color: #64748b; }
  .frame { position: relative; border-radius: 18px; overflow: hidden; border: 1.5px solid rgba(148,163,184,0.25); background: #0f172a; }
  .light .frame { box-shadow: 0 30px 70px -24px rgba(15,23,42,0.35); }
  .dark .frame { box-shadow: 0 32px 80px rgba(0,0,0,0.55); }
  .topbar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #1e293b; }
  .topbar span { width: 11px; height: 11px; border-radius: 50%; }
  .topbar .url { width: auto; height: auto; border-radius: 6px; margin-left: 10px; padding: 3px 12px; background: #0f172a; color: #94a3b8; font-size: 14px; font-weight: 600; }
  .r { background: #ef4444; } .y { background: #eab308; } .gg { background: #22c55e; }
  .shot { overflow: hidden; } .shot img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .phone { border-radius: 40px; padding: 12px; background: #0f172a; box-shadow: 0 30px 70px -24px rgba(15,23,42,0.45); }
  .phone img { display: block; width: 100%; border-radius: 30px; }

  .bg-grid2 { position: absolute; inset: 0; background-image: linear-gradient(rgba(99,102,241,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.08) 1px, transparent 1px); background-size: 54px 54px;
    -webkit-mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); mask-image: radial-gradient(ellipse 85% 78% at 50% 44%, #000 34%, transparent 82%); }
  .glow1 { position: absolute; top: -200px; right: -160px; width: 760px; height: 760px; background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 70%); }
  .glow2 { position: absolute; bottom: -220px; left: -180px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 92px 84px 150px; display: flex; flex-direction: column; }
  .headline { margin-top: 26px; font-size: 86px; font-weight: 900; line-height: 1.03; letter-spacing: -0.035em; color: #f1f5f9; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .split { position: relative; display: grid; grid-template-columns: 1fr 1fr; border-radius: 26px; overflow: hidden; border: 1.5px solid rgba(148,163,184,0.22); box-shadow: 0 34px 80px -26px rgba(0,0,0,0.7); }
  .half { display: flex; flex-direction: column; }
  .half-tag { padding: 18px 24px; font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; background: rgba(255,255,255,0.04); }
  .half.after .half-tag { color: #67e8f9; background: linear-gradient(135deg, rgba(6,182,212,0.20), rgba(99,102,241,0.20)); text-align: right; }
  .half .im { height: 570px; overflow: hidden; position: relative; }
  .half .im img { position: absolute; top: 0; width: 912px; height: 570px; object-fit: cover; object-position: top; }
  .half.before .im img { left: 0; }
  .half.after .im img { right: 0; }
  .divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: linear-gradient(180deg, #06b6d4, #6366f1); }
  .knob { position: absolute; left: 50%; top: 50%; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; background: #0a1226; border: 4px solid #06b6d4; color: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 40px rgba(6,182,212,0.4); }
  .caption { margin-top: 30px; font-size: 31px; font-weight: 500; color: #94a3b8; line-height: 1.45; }
  .caption b { color: #e2e8f0; font-weight: 700; }
</style>
</head>
<body>
<div class="slide dark">
  <div class="bg-grid2"></div><div class="glow1"></div><div class="glow2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="content">
    <div class="eyebrow">Antes e depois · ASM Marketing Digital</div>
    <h1 class="headline">O mesmo site,<br>agora com <span class="g">a cara da marca</span>.</h1>
    <div class="mid">
      <div class="split">
        <div class="half before"><div class="half-tag">Antes</div><div class="im"><img src="antes-01.jpg" alt=""></div></div>
        <div class="half after"><div class="half-tag">Depois</div><div class="im"><img src="depois-01.jpg" alt=""></div></div>
        <div class="divider"></div><div class="knob"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></div>
      </div>
      <p class="caption">Redesign sobre o manual de identidade visual da ASM. <b>Deslize para ver cada mudança.</b></p>
    </div>
  </div>
  <div class="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
