<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .slide { width: 1080px; height: 1350px; background: #0f172a; position: relative; overflow: hidden; }

  .bg-dots { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(148,163,184,0.10) 1.5px, transparent 1.5px);
    background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 900px; height: 900px; top: -330px; left: -300px;
    background: radial-gradient(circle, rgba(6,182,212,0.20) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 900px; height: 900px; bottom: -300px; right: -320px;
    background: radial-gradient(circle, rgba(99,102,241,0.20) 0%, transparent 70%); }
  .glow { position: absolute; width: 660px; height: 660px; left: 220px; bottom: 195px;
    background: radial-gradient(circle, rgba(251,191,36,0.24) 0%, transparent 66%); }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #06b6d4, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #06b6d4, #6366f1); z-index: 20; }

  .content { position: absolute; inset: 0; z-index: 10; padding: 116px 88px 0 88px; display: flex; flex-direction: column; }

  .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #64748b; margin-bottom: 32px; }

  .headline { font-size: 82px; font-weight: 900; line-height: 1.06; letter-spacing: -0.035em; color: #f1f5f9; }
  .headline em { font-style: normal; background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .subtitle { margin-top: 32px; font-size: 34px; font-weight: 500; color: #94a3b8; line-height: 1.5; max-width: 840px; }

  .art { margin-top: 20px; display: flex; justify-content: center; }
  .art svg { width: 740px; height: auto; display: block; }

  .cta { position: absolute; bottom: 150px; left: 88px; right: 80px; z-index: 15; }
  .cta-label { font-size: 26px; font-weight: 600; color: #94a3b8; margin-bottom: 14px; }
  .cta-site { font-size: 60px; font-weight: 900; letter-spacing: -0.03em;
    background: linear-gradient(90deg, #06b6d4, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 9px; z-index: 30; }
  .dot { width: 24px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  .dot.active { width: 44px; background: linear-gradient(90deg, #06b6d4, #6366f1); }

  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 22px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body>
<div class="slide">

  </div>

</html>
