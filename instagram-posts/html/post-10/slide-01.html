<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }

  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }

  .bg-dots { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px);
    background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 860px; height: 860px; top: -320px; right: -300px;
    background: radial-gradient(circle, rgba(8,145,178,0.12) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 860px; height: 860px; bottom: -340px; left: -300px;
    background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%); }

  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }

  .content { position: absolute; inset: 0; z-index: 10; padding: 96px 84px 0 84px; display: flex; flex-direction: column; }

  .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #94a3b8; margin-bottom: 28px; }

  .headline { font-size: 98px; font-weight: 900; line-height: 1.03; letter-spacing: -0.038em; color: #0f172a; }
  .headline em { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .subtitle { margin-top: 30px; font-size: 41px; font-weight: 500; color: #64748b; line-height: 1.46; max-width: 920px; }

  .art { margin: 44px -6px 0; }
  .art svg { width: 114%; margin-left: -7%; height: auto; display: block; }

  .footer-row { position: absolute; bottom: 150px; left: 88px; right: 88px;
    display: flex; align-items: center; gap: 20px; z-index: 15; }
  .swipe { font-size: 26px; font-weight: 800; color: #0f172a; letter-spacing: -0.01em; }
  .arrow { color: #0891b2; display: flex; }

  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }

  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 22px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div>
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="accent-left"></div>
  <div class="accent-top"></div>

  <div class="content">
    <div class="eyebrow">Presença digital</div>
    <h1 class="headline">Que tipo de <em>site</em><br>o seu negócio<br>precisa?</h1>
    <p class="subtitle">São 6 formatos diferentes. Cada um resolve um problema. Escolher o errado custa tempo e dinheiro.</p>

          <circle cx="16" cy="13" r="3.4" fill="#cbd5e1" stroke="none"/><circle cx="28" cy="13" r="3.4" fill="#cbd5e1" stroke="none"/><circle cx="40" cy="13" r="3.4" fill="#cbd5e1" stroke="none"/>
          <rect x="22" y="40" width="106" height="30" rx="5"/><rect x="142" y="40" width="106" height="30" rx="5"/>

          <rect x="22" y="78" width="106" height="24" rx="5"/><rect x="142" y="78" width="106" height="24" rx="5"/>

        </g>

        <!-- labels -->
        <g stroke="none" fill="#64748b" font-family="Manrope, sans-serif" font-size="15" font-weight="800" text-anchor="middle">
          <text x="159" y="150">Landing</text>
          <text x="462" y="150">Institucional</text>

    </svg>
    </div>
  </div>

  <div class="footer-row">
    <div class="swipe">Arraste para ver cada um</div>
    <div class="arrow">

  <div class="progress">

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
