<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 820px; height: 820px; top: -300px; right: -280px; background: radial-gradient(circle, rgba(8,145,178,0.10) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 820px; height: 820px; bottom: -320px; left: -300px; background: radial-gradient(circle, rgba(99,102,241,0.09) 0%, transparent 70%); }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  .content { position: absolute; inset: 0; z-index: 10; padding: 96px 84px 148px; display: flex; flex-direction: column; }
  .counter { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .counter-line { width: 44px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .counter-text { font-size: 16px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; }
  .counter-text b { color: #0891b2; font-weight: 800; }
  .title { font-size: 60px; font-weight: 900; color: #0f172a; line-height: 1.06; letter-spacing: -0.03em; margin-bottom: 20px; }
  .title em { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .desc { font-size: 30px; font-weight: 500; color: #64748b; line-height: 1.5; max-width: 880px; margin-bottom: 24px; }
  .ideal { display: inline-flex; align-items: center; gap: 14px; align-self: flex-start; background: #fff; border: 1.5px solid #e2e8f0; border-left: 4px solid #0891b2; border-radius: 14px; padding: 16px 22px; margin-bottom: 26px; }
  .ideal span { font-size: 15px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8; }
  .ideal strong { font-size: 23px; font-weight: 800; color: #0f172a; }
  .mock { flex: 1; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 24px; box-shadow: 0 20px 50px rgba(15,23,42,0.08); padding: 26px 30px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .mock svg { width: 100%; height: 100%; display: block; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 22px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>

  <div class="content">
    <div class="counter"><div class="counter-line"></div><span class="counter-text">Tipo <b>06</b> / 06</span></div>
    <div class="title">Sistema web <em>(web app)</em></div>
    <div class="desc">Software sob medida com área de login, painéis e automações. Não é um site que informa: é uma ferramenta que trabalha.</div>
    <div class="ideal"><span>Ideal para</span><strong>Negócios com processo próprio e produtos SaaS</strong></div>

          </g>
        </g>
      </svg>
    </div>
  </div>

  <div class="progress">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot active"></div><div class="dot"></div>
  </div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
