<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f7fa; font-family: 'Manrope', sans-serif; }
  .slide { width: 1080px; height: 1350px; background: #f5f7fa; position: relative; overflow: hidden; }
  .accent-left { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(180deg, #0891b2, #6366f1); z-index: 20; }
  .accent-top  { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0891b2, #6366f1); z-index: 20; }
  .progress { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 30; }
  .dot { width: 28px; height: 6px; border-radius: 3px; background: rgba(15,23,42,0.12); }
  .dot.active { width: 48px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .handle { position: absolute; bottom: 44px; right: 72px; font-size: 25px; font-weight: 700; color: #94a3b8; z-index: 30; }
  .handle em { font-style: normal; color: #0891b2; }
  em.g, .g { font-style: normal; background: linear-gradient(90deg, #0891b2, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,23,42,0.05) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .blob-1 { position: absolute; width: 820px; height: 820px; top: -300px; right: -280px; background: radial-gradient(circle, rgba(8,145,178,0.10) 0%, transparent 70%); }
  .blob-2 { position: absolute; width: 820px; height: 820px; bottom: -320px; left: -300px; background: radial-gradient(circle, rgba(99,102,241,0.09) 0%, transparent 70%); }
  .content { position: absolute; inset: 0; z-index: 10; padding: 100px 84px 150px; display: flex; flex-direction: column; justify-content: center; }
  .counter { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .counter-line { width: 44px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #0891b2, #6366f1); }
  .counter-text { font-size: 19px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8; }
  .counter-text b { color: #0891b2; font-weight: 800; }
  .eyebrow { font-size: 19px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #0891b2; margin-bottom: 26px; }
  .icon-wrap { width: 78px; height: 78px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: rgba(8,145,178,0.10); color: #0891b2; margin-bottom: 30px; }
  .bg-num { position: absolute; top: 24px; right: -46px; font-size: 440px; font-weight: 900; letter-spacing: -0.06em; line-height: 1; background: linear-gradient(135deg, rgba(8,145,178,0.08) 0%, rgba(99,102,241,0.05) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .title { font-size: 66px; font-weight: 900; color: #0f172a; line-height: 1.08; letter-spacing: -0.03em; margin-bottom: 26px; }
  .desc { font-size: 33px; font-weight: 500; color: #475569; line-height: 1.48; max-width: 912px; margin-bottom: 40px; }
  .desc b { color: #0f172a; font-weight: 700; }
  .rows { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; flex-direction: column; gap: 8px; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 22px 26px; }
  .row.warn { border-left: 4px solid #94a3b8; }
  .row.do { border-left: 4px solid #0891b2; }
  .row-tag { font-size: 18px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; }
  .row.do .row-tag { color: #0891b2; }
  .row-text { font-size: 30px; font-weight: 600; color: #334155; line-height: 1.4; }
  .checks { display: flex; flex-direction: column; gap: 16px; }
  .check { display: flex; align-items: center; gap: 22px; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 22px 26px; }
  .check-icon { width: 50px; height: 50px; border-radius: 13px; flex-shrink: 0; background: rgba(8,145,178,0.10); color: #0891b2; display: flex; align-items: center; justify-content: center; }
  .check-icon.no { background: rgba(148,163,184,0.16); color: #64748b; }
  .check-text { font-size: 30px; font-weight: 600; color: #334155; line-height: 1.38; }
  .check-text b { color: #0f172a; font-weight: 800; }
  .highlight { background: linear-gradient(135deg, #f0f9ff 0%, #ede9fe 100%); border: 1.5px solid #e0f2fe; border-radius: 20px; padding: 34px 38px; font-size: 32px; font-weight: 700; color: #0f172a; line-height: 1.45; }
  .highlight span { display: block; margin-top: 12px; font-size: 25px; font-weight: 500; color: #64748b; }
  .note { margin-top: 30px; font-size: 26px; font-weight: 500; color: #64748b; line-height: 1.5; padding-left: 22px; border-left: 3px solid #e2e8f0; }
  .note b { color: #0f172a; font-weight: 700; }
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .vs-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 28px 28px 30px; display: flex; flex-direction: column; gap: 14px; }
  .vs-card.win { border-left: 5px solid #0891b2; box-shadow: 0 18px 40px -24px rgba(8,145,178,0.45); }
  .vs-tag { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8; }
  .vs-card.win .vs-tag { color: #0891b2; }
  .vs-text { font-size: 29px; font-weight: 600; color: #334155; line-height: 1.42; }
  .vs-card:not(.win) .vs-text { color: #64748b; }
  .steps { display: flex; gap: 14px; margin-bottom: 44px; }
  .step { flex: 1; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; color: #94a3b8; }
  .step .n { font-size: 17px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .step .l { font-size: 27px; font-weight: 800; color: #94a3b8; letter-spacing: -0.01em; line-height: 1.15; }
  .step.on { border: none; background: linear-gradient(135deg, #0891b2, #6366f1); color: #e0f2fe; box-shadow: 0 20px 44px -22px rgba(99,102,241,0.6); }
  .step.on .l { color: #fff; }
  .step.done { color: #0891b2; }
  .step.done .l { color: #0f172a; }
  .myth { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 18px; padding: 28px 30px; margin-bottom: 18px; }
  .myth .vs-tag { margin-bottom: 10px; }
  .myth-text { font-size: 34px; font-weight: 700; color: #94a3b8; text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: #cbd5e1; }
  .table { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 20px; overflow: hidden; }
  .tr { display: grid; grid-template-columns: 210px 1fr 1fr; border-top: 1px solid #eef2f6; }
  .tr:first-child { border-top: none; background: #f8fafc; }
  .td { padding: 20px 22px; font-size: 26px; font-weight: 600; color: #334155; line-height: 1.32; }
  .td.k { font-size: 18px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8; display: flex; align-items: center; }
  .th { font-size: 22px; font-weight: 800; color: #0891b2; letter-spacing: 0.02em; }
  .vs { grid-template-columns: 1fr; gap: 18px; }
  .vs-text { font-size: 31px; }
  .vs-card.win .vs-text { color: #0f172a; font-weight: 700; }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-dots"></div><div class="blob-1"></div><div class="blob-2"></div>
  <div class="accent-left"></div><div class="accent-top"></div>
  <div class="bg-num">02</div>
  <div class="content">
    <div class="counter"><div class="counter-line"></div><span class="counter-text">Etapa <b>02</b> / 04</span></div>
    <div class="icon-wrap"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg></div>
    <div class="title"><em class="g">Projetar</em></div>
    <div class="vs">
      <div class="vs-card"><div class="vs-tag"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Na obra</div><div class="vs-text">Planta, estrutura, elétrica e hidráulica antes do primeiro tijolo.</div></div>
      <div class="vs-card win"><div class="vs-tag"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>No software</div><div class="vs-text">Desenhar a solução: telas, dados e regras antes da primeira linha de código.</div></div>
    </div>
    <p class="note">Mudar uma planta custa pouco. Mudar uma parede pronta custa muito.</p>
  </div>
  <div class="progress"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
