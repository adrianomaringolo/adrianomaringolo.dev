<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>The three Liskov rules translated to React props: preconditions can't be strengthened, postconditions can't be weakened, invariants must be preserved</title>
  <defs>
    <pattern id="grid-lsp-rules" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cbd5e1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect width="800" height="450" fill="url(#grid-lsp-rules)"/>

  <circle cx="60" cy="56" r="26" fill="#0f172a"/>
  <text x="60" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="24" fill="#ffffff">L</text>
  <text x="420" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">three rules, translated to props</text>

  <!-- Row 1: precondition -->
  <rect x="80" y="106" width="640" height="92" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="122" y="130" width="44" height="44" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <g stroke="#0e7490" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130,140 L144,162 L158,140"/>
    <path d="M144,162 L144,168"/>
  </g>
  <text x="196" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#0f172a">Precondition</text>
  <text x="196" y="164" font-family="system-ui, sans-serif" font-size="13" fill="#334155">can't demand more than the contract demands</text>
  <text x="196" y="184" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">no extra required prop, no hidden dependency</text>

  <!-- Row 2: postcondition -->
  <rect x="80" y="210" width="640" height="92" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="122" y="234" width="44" height="44" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <path d="M132,257 L141,267 L158,244" stroke="#0e7490" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="196" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#0f172a">Postcondition</text>
  <text x="196" y="268" font-family="system-ui, sans-serif" font-size="13" fill="#334155">can't deliver less than the contract promises</text>
  <text x="196" y="288" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">a visible section, not a silent null</text>

  <!-- Row 3: invariant -->
  <rect x="80" y="314" width="640" height="92" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="122" y="338" width="44" height="44" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <path d="M136,358 L136,349 A8,8 0 0 1 152,349 L152,358" stroke="#0e7490" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="132" y="357" width="24" height="17" rx="3" fill="none" stroke="#0e7490" stroke-width="3"/>
  <text x="196" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="15" fill="#0f172a">Invariant</text>
  <text x="196" y="372" font-family="system-ui, sans-serif" font-size="13" fill="#334155">can't do what the others don't do</text>
  <text x="196" y="392" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">no navigation, no side effect during render</text>
</svg>
