<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Three profile extensions with matching shapes but different contracts, forcing a conditional on the caller, refactored into a single ProfileExtension contract with no conditional</title>
  <defs>
    <pattern id="grid-lsp" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cbd5e1" opacity="0.5"/>
    </pattern>
    <marker id="arrow-lsp" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect width="800" height="450" fill="url(#grid-lsp)"/>

  <!-- before: same shape, three different contracts -->
  <text x="190" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">same shape, three contracts</text>

  <rect x="90" y="112" width="200" height="46" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="104" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#334155">AdminFields</text>
  <text x="104" y="149" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">user</text>

  <rect x="90" y="170" width="200" height="46" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="104" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#334155">PartnerFields</text>
  <text x="104" y="207" font-family="system-ui, sans-serif" font-size="10" fill="#b45309">user · navigates on render</text>

  <rect x="90" y="228" width="200" height="46" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="104" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#334155">SupplierFields</text>
  <text x="104" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#b45309">user + onSave · may return null</text>

  <path d="M190,282 L190,314" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-lsp)"/>

  <rect x="90" y="322" width="200" height="58" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6,5"/>
  <text x="190" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">caller</text>
  <text x="190" y="365" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#b45309">if (kind === 'supplier')</text>
  <text x="190" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">it has to know which one it got</text>

  <!-- arrow -->
  <path d="M330,240 L390,240" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-lsp)"/>

  <!-- after: one contract -->
  <text x="610" y="100" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#0e7490">ProfileExtension</text>

  <g fill="#ffffff" stroke="#0891b2" stroke-width="2">
    <rect x="510" y="112" width="200" height="46" rx="9"/>
    <rect x="510" y="170" width="200" height="46" rx="9"/>
    <rect x="510" y="228" width="200" height="46" rx="9"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#334155">
    <text x="524" y="132">AdminFields</text>
    <text x="524" y="190">PartnerFields</text>
    <text x="524" y="248">SupplierFields</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="10" fill="#0e7490">
    <text x="524" y="149">user · always renders</text>
    <text x="524" y="207">user · always renders</text>
    <text x="524" y="265">user · always renders</text>
  </g>

  <path d="M610,282 L610,314" stroke="#0891b2" stroke-width="2.5" fill="none" marker-end="url(#arrow-lsp)"/>

  <rect x="510" y="322" width="200" height="58" rx="9" fill="#0f172a"/>
  <text x="610" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">caller</text>
  <text x="610" y="365" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f8fafc">&lt;Extension user={user} /&gt;</text>
  <text x="610" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">no conditional, any extension fits</text>

  <circle cx="60" cy="60" r="26" fill="#0f172a"/>
  <text x="60" y="69" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="24" fill="#ffffff">L</text>
</svg>
