<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>UserProfile with a variant prop branching into conditionals, refactored into a closed component with composed extension components</title>
  <defs>
    <pattern id="grid-ocp" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cbd5e1" opacity="0.5"/>
    </pattern>
    <marker id="arrow-ocp" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect width="800" height="450" fill="url(#grid-ocp)"/>

  <!-- before: one component holding every case -->
  <rect x="130" y="120" width="200" height="220" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="230" y="145" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#475569">UserProfile</text>
  <text x="230" y="163" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">variant: admin | partner | …</text>

  <g fill="#ffffff" stroke="#64748b" stroke-width="1.8">
    <rect x="152" y="180" width="156" height="40" rx="6"/>
    <rect x="152" y="234" width="156" height="40" rx="6"/>
    <rect x="152" y="288" width="156" height="40" rx="6"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#475569">
    <text x="168" y="205">if admin</text>
    <text x="168" y="259">if partner</text>
    <text x="168" y="313">if …</text>
  </g>
  <g stroke="#64748b" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M275,207 L275,197 L285,187 L292,194 L282,204 Z M275,207 L282,205"/>
    <path d="M275,261 L275,251 L285,241 L292,248 L282,258 Z M275,261 L282,259"/>
    <path d="M275,315 L275,305 L285,295 L292,302 L282,312 Z M275,315 L282,313"/>
  </g>
  <text x="230" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">every new case reopens this file</text>

  <!-- arrow -->
  <path d="M348,230 L408,230" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow-ocp)"/>

  <!-- after: closed core -->
  <rect x="428" y="185" width="112" height="92" rx="12" fill="#0f172a"/>
  <g transform="translate(484,231)" stroke="#f8fafc" stroke-width="2.6" fill="none">
    <rect x="-14" y="-4" width="28" height="23" rx="3"/>
    <path d="M-9,-4 L-9,-14 A9,9 0 0 1 9,-14 L9,-4"/>
  </g>
  <text x="484" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#475569">UserProfile</text>
  <text x="484" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">unchanged</text>

  <!-- connectors -->
  <g stroke="#0891b2" stroke-width="2">
    <line x1="540" y1="205" x2="580" y2="130"/>
    <line x1="540" y1="231" x2="580" y2="231"/>
    <line x1="540" y1="257" x2="580" y2="332"/>
  </g>
  <g fill="#0891b2">
    <circle cx="540" cy="205" r="4"/>
    <circle cx="540" cy="231" r="4"/>
    <circle cx="540" cy="257" r="4"/>
  </g>

  <!-- extensions -->
  <g fill="#ffffff" stroke="#0891b2" stroke-width="2.2" stroke-dasharray="6,5">
    <rect x="580" y="102" width="160" height="56" rx="9"/>
    <rect x="580" y="203" width="160" height="56" rx="9"/>
    <rect x="580" y="304" width="160" height="56" rx="9"/>
  </g>
  <g text-anchor="middle" fill="#0e7490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="660" y="126">AdminFields</text>
    <text x="660" y="227">PartnerFields</text>
    <text x="660" y="328">SupplierFields</text>
  </g>
  <g text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">
    <text x="660" y="143">new file</text>
    <text x="660" y="244">new file</text>
    <text x="660" y="345">new file</text>
  </g>

  <circle cx="60" cy="60" r="26" fill="#0f172a"/>
  <text x="60" y="69" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="24" fill="#ffffff">O</text>
</svg>
