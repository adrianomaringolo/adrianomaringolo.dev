<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Manrope', sans-serif; }
  .scene { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
  .handle { position: absolute; bottom: 64px; right: 64px; font-size: 34px; font-weight: 700; color: #94a3b8; animation: fadeIn 0.4s ease 0.6s both; }
  .handle em { font-style: normal; color: #06b6d4; }
  svg { display: block; overflow: visible; }
  .anim { transform-box: fill-box; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-28px); } to { opacity: 1; transform: none; } }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    70%  { opacity: 1; transform: scale(1.08) rotate(0deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes stampIn {
    0%   { opacity: 0; transform: scale(1.9); }
    60%  { opacity: 1; transform: scale(0.94); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes bobX { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes driftA { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-30px, 24px) scale(1.06); } }
  @keyframes driftB { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(28px, -22px) scale(1.05); } }

  body { background: #0f172a; }
  .scene { background: #0f172a; }
  .bg-dots { position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px); background-size: 48px 48px; }
  .blob-1 { position: absolute; top: -120px; right: -160px; width: 780px; height: 780px; background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 62%); animation: driftA 9s ease-in-out 0.9s infinite; }
  .blob-2 { position: absolute; bottom: -160px; left: -180px; width: 760px; height: 760px; background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 62%); animation: driftB 11s ease-in-out 0.9s infinite; }
  .accent-left { position: absolute; left: 0; top: 0; width: 8px; height: 100%; background: linear-gradient(180deg, #06b6d4 0%, #6366f1 100%); }
  .grad { background: linear-gradient(90deg, #22d3ee, #818cf8); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 0.08em; }

  .content { position: absolute; top: 290px; left: 88px; width: 842px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; background: rgba(6,182,212,0.14); border: 2px solid rgba(6,182,212,0.38); border-radius: 100px;
    padding: 14px 32px; font-size: 30px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #06b6d4; animation: dropIn 0.45s ease 0s both; }
  .eyebrow svg { width: 34px; height: 34px; }
  .list { margin-top: 56px; display: flex; flex-direction: column; gap: 30px; }
  .item { display: flex; align-items: center; gap: 32px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.10); border-radius: 28px; padding: 26px 32px; }
  .check { flex: 0 0 84px; width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(135deg, #06b6d4, #6366f1); display: flex; align-items: center; justify-content: center; }
  .check svg { width: 48px; height: 48px; }
  .label { font-size: 46px; font-weight: 900; color: #f8fafc; letter-spacing: -0.02em; line-height: 1.15; }
  .sub { font-size: 38px; font-weight: 700; color: #22d3ee; margin-top: 4px; }
  .shine { animation: shine 2.4s ease-in-out infinite; }
  @keyframes shine { 0%, 100% { box-shadow: 0 0 0 0 rgba(6,182,212,0); } 50% { box-shadow: 0 0 0 10px rgba(6,182,212,0.18); } }
  .item:nth-child(1) { animation: fadeUp 0.4s ease 0.3s both; }
  .item:nth-child(1) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 0.45s both, shine 2.4s ease-in-out 2.6s infinite; }
  .item:nth-child(2) { animation: fadeUp 0.4s ease 0.6s both; }
  .item:nth-child(2) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 0.75s both, shine 2.4s ease-in-out 3.0s infinite; }
  .item:nth-child(3) { animation: fadeUp 0.4s ease 0.9s both; }
  .item:nth-child(3) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 1.05s both, shine 2.4s ease-in-out 3.4s infinite; }
  .item:nth-child(4) { animation: fadeUp 0.4s ease 1.2s both; }
  .item:nth-child(4) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 1.35s both, shine 2.4s ease-in-out 3.8s infinite; }
  .item:nth-child(5) { animation: fadeUp 0.4s ease 1.5s both; }
  .item:nth-child(5) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 1.65s both, shine 2.4s ease-in-out 4.2s infinite; }
  .item:nth-child(6) { animation: fadeUp 0.4s ease 1.8s both; }
  .item:nth-child(6) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 1.95s both, shine 2.4s ease-in-out 4.6s infinite; }

  /* sincronia com a fala */
  .item:nth-child(1) { animation-delay: 0.05s; }
  .item:nth-child(1) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 0.15s both, shine 2.4s ease-in-out 0.95s infinite; }
.item:nth-child(2) { animation-delay: 1.62s; }
  .item:nth-child(2) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 1.72s both, shine 2.4s ease-in-out 2.52s infinite; }
.item:nth-child(3) { animation-delay: 2.84s; }
  .item:nth-child(3) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 2.94s both, shine 2.4s ease-in-out 3.74s infinite; }
.item:nth-child(4) { animation-delay: 3.86s; }
  .item:nth-child(4) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 3.96s both, shine 2.4s ease-in-out 4.76s infinite; }
.item:nth-child(5) { animation-delay: 5.04s; }
  .item:nth-child(5) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 5.14s both, shine 2.4s ease-in-out 5.94s infinite; }
.item:nth-child(6) { animation-delay: 6.59s; }
  .item:nth-child(6) .check { animation: popIn 0.35s cubic-bezier(.2,.8,.3,1) 6.69s both, shine 2.4s ease-in-out 7.49s infinite; }
</style>
</head>
<body data-duration="8.69">
<div class="scene">
  <div class="blob-1"></div><div class="blob-2"></div><div class="bg-dots"></div><div class="accent-left"></div>
  <div class="content">
    <div class="eyebrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Versão certa</div>
    <div class="list">
      <div class="item"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div><div class="label">Endereço claro</div><div class="sub">seunegocio.com.br</div></div></div>
      <div class="item"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div><div class="label">Porta na frente</div><div class="sub">WhatsApp à vista</div></div></div>
      <div class="item"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div><div class="label">Cadeado na porta</div><div class="sub">site seguro (HTTPS)</div></div></div>
      <div class="item"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div><div class="label">Abre na hora</div><div class="sub">carrega rápido</div></div></div>
      <div class="item"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div><div class="label">Aparece no mapa</div><div class="sub">o Google encontra</div></div></div>
      <div class="item"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div><div class="label">Cabe em qualquer terreno</div><div class="sub">funciona no celular</div></div></div>
    </div>
  </div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
