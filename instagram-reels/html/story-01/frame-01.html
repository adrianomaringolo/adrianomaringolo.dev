<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .frame {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    padding: 268px 72px 320px 96px;
  }

  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .blob {
    position: absolute; top: -140px; right: -160px; width: 820px; height: 820px;
    background: radial-gradient(circle, rgba(6,182,212,0.20) 0%, transparent 62%);
    animation: drift 10s ease-in-out infinite;
  }
  .blob-2 {
    position: absolute; bottom: -220px; left: -220px; width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 62%);
    animation: drift 13s ease-in-out infinite reverse;
  }
  @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-30px,24px) scale(1.06); } }
  .accent-left { position: absolute; left: 0; top: 0; width: 9px; height: 100%; background: linear-gradient(180deg, #06b6d4, #6366f1); }

  /* ---- Ícone gigante de fundo (lâmpada = ideia/esclarecimento) — decorativo, baixa opacidade, atrás do texto ---- */
  .bg-icon {
    position: absolute; top: -70px; right: -120px; width: 760px; height: 760px;
    color: #fbbf24; opacity: 0.10;
    animation: bgIconIn 0.8s ease both, bgIconLife 11s ease-in-out infinite;
    animation-delay: 0.1s, 1s;
  }
  .bg-icon svg { width: 100%; height: 100%; }
  @keyframes bgIconIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 0.10; transform: scale(1); } }
  @keyframes bgIconLife { 0%, 100% { opacity: 0.08; transform: scale(1); } 50% { opacity: 0.14; transform: scale(1.03); } }

  .badge {
    display: inline-flex; align-items: center; gap: 16px;
    padding: 14px 30px 14px 22px; border-radius: 100px;
    background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.30);
    margin-bottom: 34px;
    animation: dropIn 0.5s cubic-bezier(.2,.9,.3,1) both; animation-delay: 0.1s;
  }
  .badge .ico { display: flex; color: #22d3ee; animation: tilt 4.5s ease-in-out 1s infinite; }
  .badge .ico svg { width: 34px; height: 34px; }
  .badge span { font-size: 24px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #22d3ee; }
  @keyframes tilt { 0%,100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(12deg) scale(1.08); } }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }

  .quote {
    font-size: 62px; font-weight: 600; color: #94a3b8; line-height: 1.2;
    margin-bottom: 28px;
    animation: fadeUp 0.5s ease both; animation-delay: 0.3s;
  }
  .quote .q { color: #475569; }

  .head-wrap { position: relative; align-self: stretch; }
  .head-glow {
    position: absolute; left: -60px; top: -30px; right: -20px; bottom: -20px; z-index: -1;
    background: radial-gradient(ellipse at 30% 50%, rgba(6,182,212,0.30) 0%, rgba(99,102,241,0.14) 45%, transparent 74%);
    animation: breathe 3.6s ease-in-out 1.2s infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 0.5; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1.05); } }

  h1 {
    font-size: 188px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.98; color: #f8fafc;
  }
  h1 .l { display: block; overflow: hidden; padding: 0.06em 0; margin: -0.06em 0; }
  h1 .l span { display: block; animation: rise 0.62s cubic-bezier(.2,.85,.25,1) both; }
  h1 .l1 span { animation-delay: 0.48s; }
  h1 .l2 span { animation-delay: 0.64s; }
  h1 .l3 span { animation-delay: 0.80s; }
  @keyframes rise { from { opacity: 0; transform: translateY(108%); } to { opacity: 1; transform: none; } }

  h1 .accent {
    background: linear-gradient(100deg, #22d3ee, #6366f1, #22d3ee);
    background-size: 220% 100%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    animation: shimmer 4s ease-in-out 1.3s infinite;
  }
  @keyframes shimmer { 0%,100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }

  .underline {
    height: 16px; width: 440px; margin-top: 44px; border-radius: 8px;
    background: linear-gradient(90deg, #06b6d4, #6366f1, transparent);
    transform-origin: left center;
    animation: wipeX 0.55s cubic-bezier(.2,.85,.25,1) both; animation-delay: 1.05s;
  }

  .sticker-slot { position: absolute; left: 0; right: 0; bottom: 96px; height: 240px; }

  .handle {
    position: absolute; bottom: 272px; right: 96px; z-index: 5;
    font-size: 28px; font-weight: 600; color: #94a3b8;
    animation: fadeIn 0.4s ease both; animation-delay: 1.3s;
  }
  .handle em { font-style: normal; color: #06b6d4; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes wipeX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
</head>
<body data-duration="6">
<div class="frame">
  <div class="bg-dots"></div>
  <div class="blob"></div>
  <div class="blob-2"></div>

  <div class="bg-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
      <path d="M9 18h6"/>
      <path d="M10 22h4"/>
    </svg>
  </div>

  <div class="accent-left"></div>

  <div class="badge">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg></span>
    <span>Presença digital</span>
  </div>

  <div class="quote"><span class="q">&ldquo;</span>Preciso de um site.<span class="q">&rdquo;</span></div>

  <div class="head-wrap">
    <div class="head-glow"></div>
    <h1>
      <span class="l l1"><span>Tá. Mas</span></span>
      <span class="l l2"><span>de qual</span></span>
      <span class="l l3"><span class="accent">tipo?</span></span>
    </h1>
  </div>

  <div class="underline"></div>

  <div class="sticker-slot"></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
