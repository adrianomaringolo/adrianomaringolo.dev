<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .frame {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    padding: 280px 96px 340px 112px;
  }

  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .blob {
    position: absolute; bottom: -180px; left: -160px; width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 62%);
    animation: drift 11s ease-in-out infinite;
  }
  @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(28px,-22px) scale(1.06); } }
  .accent-left { position: absolute; left: 0; top: 0; width: 8px; height: 100%; background: linear-gradient(180deg, #06b6d4, #6366f1); }

  /* partículas subindo — decorativo, atrás do conteúdo */
  .particles { position: absolute; inset: 0; z-index: 0; }
  .particles i {
    position: absolute; bottom: 340px; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(34,211,238,0.5);
    animation: rise 6s linear infinite;
  }
  .particles i:nth-child(1) { left: 20%; animation-delay: 1.0s; }
  .particles i:nth-child(2) { left: 46%; animation-delay: 2.4s; }
  .particles i:nth-child(3) { left: 72%; animation-delay: 3.6s; }
  .particles i:nth-child(4) { left: 88%; animation-delay: 4.8s; }
  @keyframes rise {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    12%  { opacity: 0.8; }
    100% { transform: translateY(-720px) scale(0.4); opacity: 0; }
  }

  .eyebrow {
    position: relative; z-index: 2;
    font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: #22d3ee; margin-bottom: 30px;
    animation: fadeIn 0.4s ease both; animation-delay: 0.1s;
  }

  h2 {
    position: relative; z-index: 2;
    font-size: 76px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.08; color: #f8fafc;
    max-width: 900px; margin-bottom: 58px;
    animation: fadeUp 0.5s ease both; animation-delay: 0.28s;
  }
  h2 .accent { color: #22d3ee; }

  .list { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 26px; }
  .item {
    display: flex; align-items: center; gap: 28px;
    font-size: 50px; font-weight: 700; color: #e2e8f0;
    animation: itemIn 0.5s cubic-bezier(.2,.8,.3,1) both;
  }
  .item .ico {
    flex: none; width: 74px; height: 74px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    color: #22d3ee;
    background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.30);
    animation: icoFloat 3.6s ease-in-out infinite;
  }
  .item .ico svg { width: 38px; height: 38px; }

  .item:nth-child(1) { animation-delay: 0.50s; }
  .item:nth-child(2) { animation-delay: 0.64s; }
  .item:nth-child(3) { animation-delay: 0.78s; }
  .item:nth-child(4) { animation-delay: 0.92s; }
  .item:nth-child(5) { animation-delay: 1.06s; }
  .item:nth-child(6) { animation-delay: 1.20s; }
  .item:nth-child(1) .ico { animation-delay: 1.8s; }
  .item:nth-child(2) .ico { animation-delay: 2.1s; }
  .item:nth-child(3) .ico { animation-delay: 2.4s; }
  .item:nth-child(4) .ico { animation-delay: 2.7s; }
  .item:nth-child(5) .ico { animation-delay: 3.0s; }
  .item:nth-child(6) .ico { animation-delay: 3.3s; }

  .sticker-slot { position: absolute; left: 0; right: 0; bottom: 96px; height: 240px; }

  .handle {
    position: absolute; bottom: 272px; right: 96px; z-index: 5;
    font-size: 28px; font-weight: 600; color: #94a3b8;
    animation: fadeIn 0.4s ease both; animation-delay: 1.4s;
  }
  .handle em { font-style: normal; color: #06b6d4; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes itemIn { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes icoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
</style>
</head>
<body data-duration="10">
<div class="frame">
  <div class="bg-dots"></div>
  <div class="blob"></div>
  <div class="accent-left"></div>
  <div class="particles"><i></i><i></i><i></i><i></i></div>

  <div class="eyebrow">São 6 formatos</div>
  <h2>Cada um resolve um <span class="accent">problema diferente.</span></h2>

  <div class="list">
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>
      Landing page
    </div>
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg></span>
      Site institucional
    </div>
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></span>
      Portfólio
    </div>
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
      Blog ou site de conteúdo
    </div>
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
      Loja virtual
    </div>
    <div class="item">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span>
      Sistema web
    </div>
  </div>

  <div class="sticker-slot"></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
