<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .frame {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    padding: 280px 96px 340px 112px;
  }

  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .blob-a {
    position: absolute; top: -160px; right: -180px; width: 820px; height: 820px;
    background: radial-gradient(circle, rgba(6,182,212,0.20) 0%, transparent 62%);
    animation: drift 10s ease-in-out infinite;
  }
  .blob-b {
    position: absolute; bottom: -220px; left: -200px; width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 62%);
    animation: drift 12s ease-in-out infinite reverse;
  }
  @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-26px,22px) scale(1.06); } }
  .accent-left { position: absolute; left: 0; top: 0; width: 8px; height: 100%; background: linear-gradient(180deg, #06b6d4, #6366f1); }

  .sparkles { position: absolute; inset: 0; z-index: 1; }
  .sparkles i {
    position: absolute; color: #22d3ee; opacity: 0;
    animation: spark 2.6s ease-in-out infinite;
  }
  .sparkles i svg { width: 26px; height: 26px; }
  .sparkles i:nth-child(1) { top: 1380px; left: 240px; animation-delay: 1.4s; }
  .sparkles i:nth-child(2) { top: 1430px; left: 640px; animation-delay: 2.6s; }
  .sparkles i:nth-child(3) { top: 900px;  left: 900px; animation-delay: 3.4s; }
  @keyframes spark {
    0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
    35%, 65% { opacity: 1; transform: scale(1) rotate(180deg); }
  }

  .eyebrow {
    position: relative; z-index: 2;
    font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: #22d3ee; margin-bottom: 40px;
    animation: fadeIn 0.4s ease both; animation-delay: 0.1s;
  }

  .icon-wrap {
    position: relative; z-index: 2;
    width: 138px; height: 138px; border-radius: 36px; margin-bottom: 46px;
    display: flex; align-items: center; justify-content: center;
    color: #0f172a; background: linear-gradient(135deg, #22d3ee, #6366f1);
    animation: popIn 0.6s cubic-bezier(.2,1.2,.3,1) both; animation-delay: 0.3s;
  }
  .icon-wrap svg { width: 66px; height: 66px; }
  .icon-ring {
    position: absolute; inset: 0; border-radius: 36px; border: 3px solid #22d3ee;
    animation: ring 2.4s ease-out 1.1s infinite;
  }
  @keyframes ring {
    0%   { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }

  h2 {
    position: relative; z-index: 2;
    font-size: 104px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.03; color: #f8fafc;
    max-width: 940px;
    animation: fadeUp 0.5s ease both; animation-delay: 0.5s;
  }
  h2 .accent {
    color: #22d3ee;
    animation: hueGlow 3.4s ease-in-out 1.2s infinite;
  }
  @keyframes hueGlow {
    0%, 100% { color: #22d3ee; text-shadow: 0 0 0 transparent; }
    50%      { color: #38bdf8; text-shadow: 0 0 28px rgba(34,211,238,0.45); }
  }

  .sub {
    position: relative; z-index: 2;
    margin-top: 34px; font-size: 46px; font-weight: 500; color: #94a3b8; line-height: 1.4; max-width: 820px;
    animation: fadeUp 0.5s ease both; animation-delay: 0.72s;
  }

  .sticker-slot { position: absolute; left: 0; right: 0; bottom: 96px; height: 240px; }

  .handle {
    position: absolute; bottom: 272px; right: 96px; z-index: 5;
    font-size: 28px; font-weight: 600; color: #94a3b8;
    animation: fadeIn 0.4s ease both; animation-delay: 1s;
  }
  .handle em { font-style: normal; color: #06b6d4; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body data-duration="8">
<div class="frame">
  <div class="bg-dots"></div>
  <div class="blob-a"></div>
  <div class="blob-b"></div>
  <div class="accent-left"></div>
  <div class="sparkles">
    <i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9Z"/></svg></i>
    <i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9Z"/></svg></i>
    <i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9Z"/></svg></i>
  </div>

  <div class="eyebrow">Todo dia um pouco mais claro</div>

  <div class="icon-wrap">
    <div class="icon-ring"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>
    </svg>
  </div>

  <h2>Me siga para <span class="accent">se informar.</span></h2>
  <div class="sub">Sem site amador, sem cair em promessa furada. Uma dica de cada vez.</div>

  <div class="sticker-slot"></div>
  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
