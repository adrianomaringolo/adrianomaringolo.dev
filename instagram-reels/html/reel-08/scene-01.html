<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* IMPORTANTE: o export (captureHtml) pausa e faz scrub das animacoes via
     querySelectorAll('*'), que NAO alcanca pseudo-elementos. Toda animacao
     precisa estar em um elemento real, senao ela roda em tempo de parede
     durante a captura e pisca entre frames. */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .scene {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
    padding: 100px 48px 100px 64px;
  }

  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .blob-top {
    position: absolute; top: -80px; right: -120px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(6,182,212,0.20) 0%, transparent 62%);
    animation: driftA 9s ease-in-out infinite;
  }
  .blob-bot {
    position: absolute; bottom: -120px; left: -140px;
    width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 62%);
    animation: driftB 11s ease-in-out infinite;
  }
  .blob-red {
    position: absolute; top: 780px; left: -220px;
    width: 900px; height: 700px;
    background: radial-gradient(ellipse, rgba(239,68,68,0.16) 0%, transparent 65%);
    animation: redRise 1.6s cubic-bezier(.2,.8,.3,1) 1.15s both;
  }
  @keyframes driftA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-34px, 26px) scale(1.07); }
  }
  @keyframes driftB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(30px, -24px) scale(1.06); }
  }
  @keyframes redRise {
    from { opacity: 0; transform: translateY(70px) scale(0.85); }
    to   { opacity: 1; transform: none; }
  }

  .accent-left {
    position: absolute; left: 0; top: 0; width: 9px; height: 100%;
    background: linear-gradient(180deg, #06b6d4, #6366f1, #ef4444, #06b6d4);
    background-size: 100% 300%;
    animation: sweepY 6s linear infinite;
  }
  @keyframes sweepY { to { background-position: 0 -300%; } }

  /* ---- Tag ---- */
  .tag {
    display: inline-flex; align-items: center; gap: 16px;
    background: rgba(6,182,212,0.14);
    border: 2px solid rgba(6,182,212,0.38);
    border-radius: 100px; padding: 16px 38px;
    font-size: 34px; font-weight: 800;
    letter-spacing: 0.1em; text-transform: uppercase; color: #06b6d4;
    margin-bottom: 62px;
    animation: dropIn 0.55s cubic-bezier(.2,.8,.3,1) 0.05s both;
  }
  .tag-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #06b6d4;
    animation: dotPulse 1.8s ease-in-out 0.8s infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.35; transform: scale(1);   box-shadow: 0 0 0 0 rgba(6,182,212,0.5); }
    50%      { opacity: 1;    transform: scale(1.3); box-shadow: 0 0 0 16px rgba(6,182,212,0); }
  }

  /* ---- Headline ---- */
  h1 { font-weight: 900; letter-spacing: -0.04em; color: #f8fafc; }

  .line {
    overflow: hidden;
    padding: 0.1em 0;
    margin: -0.1em 0;
    font-size: 122px; line-height: 1.02;
  }
  .line span { display: block; animation: unmask 0.62s cubic-bezier(.2,.85,.25,1) both; }
  @keyframes unmask {
    from { opacity: 0; transform: translateY(105%) skewY(3deg); }
    to   { opacity: 1; transform: none; }
  }
  .l1 span { animation-delay: 0.22s; }
  .l2 span { animation-delay: 0.42s; }
  .l3 span { animation-delay: 0.62s; }

  /* ---- Punchline ---- */
  .punch {
    position: relative;
    margin-top: 12px;
    padding: 0 26px 0 0;
    align-self: stretch;
  }
  .punch-glow {
    position: absolute; left: -70px; top: -60px;
    width: 1000px; height: 300px;
    background: radial-gradient(ellipse at center, rgba(239,68,68,0.55) 0%, rgba(239,68,68,0.18) 42%, transparent 72%);
    animation: glowIn 0.7s ease-out 1.25s both, glowPulse 2.4s ease-in-out 1.95s infinite;
  }
  @keyframes glowIn   { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; transform: scale(0.97); }
    50%      { opacity: 1;    transform: scale(1.06); }
  }

  .punch-word {
    position: relative;
    font-size: 148px; font-weight: 900;
    letter-spacing: -0.05em; line-height: 1.06;
    background: linear-gradient(100deg, #fb7185 0%, #ef4444 38%, #f87171 62%, #ef4444 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: punchIn 0.66s cubic-bezier(.18,.9,.28,1) 1.15s both,
               shimmer 3.6s ease-in-out 2.0s infinite;
  }
  @keyframes punchIn {
    0%   { opacity: 0; transform: scale(0.78) translateY(40px); }
    72%  { opacity: 1; transform: scale(1.045) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 0; }
    50%      { background-position: 100% 0; }
  }

  .punch-underline {
    position: relative;
    height: 12px; width: 100%; max-width: 900px;
    margin-top: 22px; border-radius: 6px;
    background: linear-gradient(90deg, #ef4444 0%, #fb7185 55%, transparent 100%);
    transform-origin: left center;
    animation: wipeX 0.62s cubic-bezier(.2,.85,.25,1) 1.62s both;
  }
  @keyframes wipeX { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ---- Divisor + subtitulo ---- */
  .divider {
    width: 160px; height: 7px;
    background: linear-gradient(90deg, #06b6d4, transparent);
    border-radius: 4px; margin: 66px 0 46px;
    transform-origin: left center;
    animation: wipeX 0.5s ease-out 2.1s both;
  }

  .sub {
    font-size: 68px; font-weight: 600; line-height: 1.34;
    color: #94a3b8; max-width: 940px;
    animation: riseIn 0.6s cubic-bezier(.2,.8,.3,1) 2.25s both;
  }
  .sub strong {
    position: relative; display: inline-block;
    color: #f8fafc; font-weight: 900;
  }
  .sub-mark {
    position: absolute; left: -12px; right: -12px; bottom: 6px; height: 24px;
    background: linear-gradient(90deg, rgba(6,182,212,0.45), rgba(99,102,241,0.30));
    border-radius: 6px; z-index: -1;
    transform-origin: left center;
    animation: wipeX 0.5s cubic-bezier(.2,.85,.25,1) 2.62s both;
  }

  @keyframes dropIn { from { opacity: 0; transform: translateY(-32px); } to { opacity: 1; transform: none; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(38px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .handle {
    position: absolute; bottom: 64px; right: 60px;
    font-size: 36px; font-weight: 700; color: #94a3b8;
    animation: fadeIn 0.5s ease both; animation-delay: 2.9s;
  }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body data-duration="6.2">
<div class="scene">
  <div class="blob-top"></div>
  <div class="blob-bot"></div>
  <div class="blob-red"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>

  <div class="tag"><span class="tag-dot"></span>Prestadores de serviço</div>

  <h1>
    <div class="line l1"><span>Seu cliente</span></div>
    <div class="line l2"><span>procurou.</span></div>
    <div class="line l3"><span>Achou o seu</span></div>
  </h1>

  <div class="punch">
    <div class="punch-glow"></div>
    <div class="punch-word">concorrente.</div>
    <div class="punch-underline"></div>
  </div>

  <div class="divider"></div>

  <div class="sub"><strong>5 razões<span class="sub-mark"></span></strong> para ter um site profissional.</div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
