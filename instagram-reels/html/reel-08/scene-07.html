<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .scene {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 100px 90px;
    text-align: center;
  }

  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .blob-top {
    position: absolute; top: -140px; right: -160px;
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(6,182,212,0.22) 0%, transparent 62%);
    animation: breathe 4s ease-in-out infinite;
    animation-delay: 0.9s;
  }
  .blob-bot {
    position: absolute; bottom: -180px; left: -180px;
    width: 780px; height: 780px;
    background: radial-gradient(circle, rgba(99,102,241,0.20) 0%, transparent 62%);
    animation: breathe 4s ease-in-out infinite;
    animation-delay: 1.9s;
  }
  .accent-left {
    position: absolute; left: 0; top: 0; width: 6px; height: 100%;
    background: linear-gradient(180deg, #06b6d4 0%, #6366f1 100%);
  }

  /* Sparkles decorativos */
  .sparkle { position: absolute; color: #06b6d4; opacity: 0; }
  .sp-1 { top: 300px; left: 130px;  animation: sparkle 2.4s ease-in-out infinite; animation-delay: 1.0s; }
  .sp-2 { top: 520px; right: 150px; animation: sparkle 2.4s ease-in-out infinite; animation-delay: 1.6s; }
  .sp-3 { bottom: 420px; left: 170px; animation: sparkle 2.4s ease-in-out infinite; animation-delay: 2.2s; }

  .eyebrow {
    font-size: 27px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: #06b6d4; margin-bottom: 44px;
    animation: fadeIn 0.35s ease both; animation-delay: 0.05s;
  }

  h2 {
    font-size: 92px; font-weight: 900;
    letter-spacing: -0.035em; line-height: 1.08; color: #f8fafc;
    animation: fadeUp 0.5s ease both; animation-delay: 0.25s;
  }
  h2 .accent {
    background: linear-gradient(90deg, #06b6d4 0%, #818cf8 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .sub {
    margin-top: 46px;
    font-size: 44px; font-weight: 500; line-height: 1.45;
    color: #94a3b8; max-width: 820px;
    animation: fadeUp 0.5s ease both; animation-delay: 0.55s;
  }

  .card {
    margin-top: 76px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(6,182,212,0.35);
    border-radius: 28px;
    padding: 44px 72px;
    animation: fadeUp 0.5s ease both, cardGlow 2.6s ease-in-out infinite;
    animation-delay: 0.85s, 1.3s;
  }
  .card-label {
    font-size: 24px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: #94a3b8;
  }
  .card-site {
    font-size: 58px; font-weight: 900; letter-spacing: -0.025em; color: #f8fafc;
  }

  .kicker {
    margin-top: 62px;
    display: inline-flex; align-items: center; gap: 18px;
    font-size: 40px; font-weight: 700; color: #f8fafc;
    animation: fadeUp 0.5s ease both; animation-delay: 1.15s;
  }
  .kicker svg { color: #06b6d4; animation: nudge 1.4s ease-in-out infinite; animation-delay: 1.6s; }

  .handle {
    position: absolute; bottom: 64px; right: 72px;
    font-size: 32px; font-weight: 600; color: #94a3b8;
    animation: fadeIn 0.4s ease both; animation-delay: 1.35s;
  }
  .handle em { font-style: normal; color: #06b6d4; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes cardGlow {
    0%, 100% { border-color: rgba(6,182,212,0.35); box-shadow: 0 0 0 rgba(6,182,212,0); }
    50%       { border-color: rgba(6,182,212,0.85); box-shadow: 0 0 44px rgba(6,182,212,0.30); }
  }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
  @keyframes sparkle {
    0%       { opacity: 0; transform: scale(0) rotate(0deg); }
    30%, 70% { opacity: 1; transform: scale(1) rotate(180deg); }
    100%     { opacity: 0; transform: scale(0) rotate(360deg); }
  }
</style>
</head>
<body data-duration="7.7">
<div class="scene">
  <div class="blob-top"></div>
  <div class="blob-bot"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>

  <div class="sparkle sp-1">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg>
  </div>
  <div class="sparkle sp-2">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg>
  </div>
  <div class="sparkle sp-3">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg>
  </div>

  <div class="eyebrow">Vamos conversar?</div>

  <h2>Posso construir<br><span class="accent">o seu site.</span></h2>

  <div class="sub">Sob medida para prestadores de serviço que querem crescer.</div>

  <div class="card">
    <div class="card-label">Me encontra aqui</div>
    <div class="card-site">adrianomaringolo.dev</div>
  </div>

  <div class="kicker">
    Chame no direct
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>
    </svg>
  </div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
