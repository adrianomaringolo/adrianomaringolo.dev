<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .scene {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: flex-end;
    padding: 100px 90px 190px 110px;
  }

  /* ---- Foto de fundo com Ken Burns continuo ---- */
  .bg-photo {
    position: absolute; inset: -60px;
    background: url('img-03.jpg') center 30% / cover no-repeat;
    transform-origin: 70% 35%;
    animation: kenburns 9s ease-in-out infinite alternate;
  }
  /* Degrade escuro: leve no topo, solido onde entra o texto */
  .bg-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      180deg,
      rgba(15,23,42,0.72) 0%,
      rgba(15,23,42,0.55) 26%,
      rgba(15,23,42,0.86) 56%,
      rgba(15,23,42,0.97) 78%,
      #0f172a 100%
    );
  }
  .bg-tint {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 78% 22%, rgba(6,182,212,0.20) 0%, transparent 58%);
  }
  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.045) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .accent-left {
    position: absolute; left: 0; top: 0; width: 6px; height: 100%;
    background: linear-gradient(180deg, #06b6d4 0%, #6366f1 100%);
  }

  .ghost-num {
    position: absolute; right: -30px; bottom: 120px;
    font-size: 460px; font-weight: 900; letter-spacing: -0.06em;
    color: rgba(248,250,252,0.05); line-height: 1;
  }

  .content { position: relative; z-index: 5; }

  .tag {
    display: inline-flex; align-items: center; gap: 14px;
    background: rgba(6,182,212,0.16);
    border: 1px solid rgba(6,182,212,0.36);
    border-radius: 100px; padding: 13px 30px;
    font-size: 25px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: #22d3ee;
    margin-bottom: 40px;
    animation: fadeIn 0.35s ease both; animation-delay: 0.05s;
  }
  .tag-dot {
    width: 11px; height: 11px; border-radius: 50%; background: #22d3ee;
    animation: dotPulse 1.6s ease-in-out infinite; animation-delay: 0.9s;
  }

  .icon-wrap {
    margin-bottom: 36px; color: #06b6d4;
    filter: drop-shadow(0 0 22px rgba(6,182,212,0.55));
    animation: fadeIn 0.4s ease both, floatUp 1.8s ease-in-out infinite;
    animation-delay: 0.15s, 0.95s;
  }

  h2 {
    font-size: 78px; font-weight: 900;
    letter-spacing: -0.03em; line-height: 1.08; color: #f8fafc;
    text-shadow: 0 4px 30px rgba(15,23,42,0.6);
    animation: fadeUp 0.5s ease both; animation-delay: 0.32s;
  }
  h2 .accent { color: #22d3ee; text-shadow: 0 0 34px rgba(6,182,212,0.45); }

  .divider {
    width: 90px; height: 5px;
    background: linear-gradient(90deg, #06b6d4, transparent);
    border-radius: 3px; margin: 40px 0;
    animation: fadeIn 0.4s ease both; animation-delay: 0.55s;
  }

  .desc {
    font-size: 44px; font-weight: 500; line-height: 1.48;
    color: #cbd5e1; max-width: 850px;
    text-shadow: 0 2px 20px rgba(15,23,42,0.7);
    animation: fadeUp 0.5s ease both; animation-delay: 0.72s;
  }

  .handle {
    position: absolute; bottom: 64px; right: 72px; z-index: 5;
    font-size: 32px; font-weight: 600; color: #94a3b8;
    animation: fadeIn 0.4s ease both; animation-delay: 0.95s;
  }
  .handle em { font-style: normal; color: #06b6d4; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes floatUp { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes dotPulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.4); } }
  @keyframes kenburns { from { transform: scale(1.04); } to { transform: scale(1.14); } }
</style>
</head>
<body data-duration="7">
<div class="scene">
  <div class="bg-photo"></div>
  <div class="bg-overlay"></div>
  <div class="bg-tint"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>
  <div class="ghost-num">03</div>

  <div class="content">
    <div class="tag"><span class="tag-dot"></span>Razão 03 / 05</div>

    <div class="icon-wrap">
      <svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>

    <h2>Trabalhando por você<br><span class="accent">24 horas por dia.</span></h2>

    <div class="divider"></div>

    <div class="desc">Ele apresenta e capta contatos enquanto você atende ou descansa.</div>
  </div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
