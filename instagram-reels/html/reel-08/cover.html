<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .scene {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding: 90px 80px 210px; text-align: center;
  }

  .bg-photo {
    position: absolute; inset: 0;
    background: url('img-04.jpg') center 26% / cover no-repeat;
  }
  /* Foto legivel no topo, escurece rapido onde o texto comeca */
  .bg-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(15,23,42,0.35) 0%,
      rgba(15,23,42,0.28) 22%,
      rgba(15,23,42,0.72) 42%,
      rgba(15,23,42,0.95) 56%,
      #0f172a 68%,
      #0f172a 100%);
  }
  .bg-tint {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 78%, rgba(6,182,212,0.16) 0%, transparent 55%);
  }
  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .accent-left {
    position: absolute; left: 0; top: 0; width: 8px; height: 100%;
    background: linear-gradient(180deg, #06b6d4 0%, #6366f1 100%);
  }

  .content { position: relative; z-index: 5; }

  .tag {
    display: inline-block;
    background: rgba(6,182,212,0.18);
    border: 2px solid rgba(6,182,212,0.50);
    border-radius: 100px; padding: 16px 40px;
    font-size: 30px; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase; color: #22d3ee;
    margin-bottom: 44px;
  }

  .num {
    font-size: 240px; font-weight: 900; line-height: 0.9;
    letter-spacing: -0.06em;
    background: linear-gradient(180deg, #22d3ee 0%, #6366f1 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 12px;
  }

  h1 {
    font-size: 96px; font-weight: 900;
    letter-spacing: -0.035em; line-height: 1.06; color: #f8fafc;
    text-shadow: 0 6px 40px rgba(15,23,42,0.8);
  }

  .sub {
    margin-top: 52px;
    font-size: 46px; font-weight: 700; line-height: 1.4;
    color: #cbd5e1; max-width: 820px;
    text-shadow: 0 2px 24px rgba(15,23,42,0.8);
  }

  .handle {
    position: absolute; bottom: 70px; right: 72px; z-index: 5;
    font-size: 34px; font-weight: 700; color: #94a3b8;
  }
  .handle em { font-style: normal; color: #06b6d4; }
</style>
</head>
<body data-duration="0">
<div class="scene">
  <div class="bg-photo"></div>
  <div class="bg-overlay"></div>
  <div class="bg-tint"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>

  <div class="content">
    <div class="tag">Prestadores de serviço</div>
    <div class="num">5</div>
    <h1>razões para ter<br>um site profissional</h1>
    <div class="sub">E parar de depender só de indicação.</div>
  </div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
