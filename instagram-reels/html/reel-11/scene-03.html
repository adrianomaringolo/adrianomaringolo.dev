<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Special+Elite&family=Share+Tech+Mono&family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Reel fora da identidade da marca (criatividade: Ousado), estética de documentário policial.
     Toda animação fica em elemento real (o export faz scrub via querySelectorAll('*')). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #1c1c1c 0%, #0a0a0a 65%, #000 100%); }
  .grain { position: absolute; inset: -60px; z-index: 30; pointer-events: none; opacity: 0.14;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 0.5s steps(4) 0s infinite; }
  @keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-30px, 20px); } 50% { transform: translate(20px, -30px); } 75% { transform: translate(-20px, -10px); } 100% { transform: translate(0, 0); } }
  .vignette { position: absolute; inset: 0; z-index: 29; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,0.75) 100%); }
  .flicker { position: absolute; inset: 0; z-index: 28; pointer-events: none; background: #fff; animation: flick 3.1s steps(1) 0.6s infinite; opacity: 0; }
  @keyframes flick { 0%, 100% { opacity: 0; } 47% { opacity: 0.035; } 49% { opacity: 0; } 83% { opacity: 0.025; } 84% { opacity: 0; } }
  .cutin { position: absolute; inset: 0; z-index: 31; background: #000; animation: cutIn 0.25s ease-out 0s both; }
  @keyframes cutIn { from { opacity: 1; } to { opacity: 0; } }
  .hud { position: absolute; left: 70px; right: 70px; top: 110px; display: flex; justify-content: space-between; z-index: 20;
    font: 34px 'Share Tech Mono', monospace; color: rgba(255,255,255,0.55); letter-spacing: 0.08em; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slamIn { 0% { opacity: 0; transform: scale(1.6); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes stamp { 0% { opacity: 0; scale: 2.2; } 70% { opacity: 1; scale: 0.95; } 100% { opacity: 1; scale: 1; } }
  
  .board { position: absolute; left: 0; right: 0; top: 230px; display: flex; flex-direction: column; align-items: center; }
  .stamp-time { font: 170px 'Share Tech Mono', monospace; color: #ff3b3b; text-shadow: 0 0 34px rgba(255,59,59,0.55); white-space: nowrap; }
  .hm { display: inline-block; animation: slamIn 0.35s cubic-bezier(.2,.9,.3,1.3) 0.20s both; }
  .ss { display: inline-block; animation: slamIn 0.35s cubic-bezier(.2,.9,.3,1.3) 3.04s both, tick 1s steps(1) 3.94s infinite; }
  @keyframes tick { 50% { opacity: 0.5; } }
  .photo { position: relative; margin-top: 50px; background: #fff; padding: 22px 22px 80px; transform: rotate(-3deg); box-shadow: 0 30px 70px rgba(0,0,0,0.7);
    animation: slideIn 0.5s cubic-bezier(.2,.8,.3,1) 0.1s both; }
  @keyframes slideIn { from { transform: translateY(160px) rotate(4deg); opacity: 0; } to { transform: rotate(-3deg); opacity: 1; } }
  .pin { position: absolute; top: -18px; left: 50%; margin-left: -18px; width: 36px; height: 36px; border-radius: 50%; background: #d11; box-shadow: 0 4px 0 #700; }
  .photo .cap { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font: 30px 'Special Elite', monospace; color: #333; white-space: nowrap; }
  .phone { width: 380px; height: 640px; border-radius: 52px; background: #111; padding: 14px; filter: grayscale(0.4) contrast(1.1); }
  .screen { position: relative; height: 100%; border-radius: 40px; background: #1d1d1d; overflow: hidden; }
  .site { position: absolute; inset: 0; background: #f4f4f4; padding: 70px 28px; display: flex; flex-direction: column; gap: 22px; animation: fadeIn 0.35s ease 5.86s both; }
  .site i { display: block; height: 18px; background: #cfcfcf; border-radius: 6px; }
  .site .big { height: 120px; background: #bdbdbd; }
  .spinner { position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; margin: -45px; border-radius: 50%; border: 10px solid #444; border-top-color: #ddd; animation: rot 0.9s linear 0.3s infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* legenda de documentário */
  .captions { position: absolute; left: 70px; right: 150px; top: 1300px; height: 280px; z-index: 20; }
  .phrase { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; column-gap: 20px; row-gap: 2px; text-align: center; }
  .w { display: inline-block; font: 700 84px 'Oswald', sans-serif; line-height: 1.12; text-transform: uppercase; color: #fff;
    -webkit-text-stroke: 10px #000; paint-order: stroke fill; letter-spacing: 0.01em; }
@keyframes ph0 { 0%, 2.090% { opacity: 0; visibility: hidden; } 2.104%, 41.923% { opacity: 1; visibility: visible; } 41.937%, 100% { opacity: 0; visibility: hidden; } }
@keyframes w0_0 { 0%, 2.791% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 2.805% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 4.488% { transform: scale(1); } 13.181% { color: #ffd400; } 13.883%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w0_1 { 0%, 13.167% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 13.181% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 14.864% { transform: scale(1); } 32.451% { color: #ffd400; } 33.153%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes ph1 { 0%, 41.923% { opacity: 0; visibility: hidden; } 41.937%, 74.419% { opacity: 1; visibility: visible; } 74.433%, 100% { opacity: 0; visibility: hidden; } }
@keyframes w1_0 { 0%, 42.625% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 42.639% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 44.322% { transform: scale(1); } 45.751% { color: #ffd400; } 46.452%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w1_1 { 0%, 45.737% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 45.751% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 47.434% { transform: scale(1); } 48.863% { color: #ffd400; } 49.564%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w1_2 { 0%, 48.849% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 48.863% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 50.546% { transform: scale(1); } 60.689% { color: #ffd400; } 61.391%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes ph2 { 0%, 74.419% { opacity: 0; visibility: hidden; } 74.433%, 99.986% { opacity: 1; visibility: visible; } 100.000%, 100% { opacity: 0; visibility: hidden; } }
@keyframes w2_0 { 0%, 75.120% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 75.134% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 76.817% { transform: scale(1); } 78.409% { color: #ffd400; } 79.110%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_1 { 0%, 78.395% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 78.409% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 80.092% { transform: scale(1); } 83.866% { color: #ffd400; } 84.567%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_2 { 0%, 83.852% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 83.866% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 85.549% { transform: scale(1); } 86.412% { color: #ffd400; } 87.114%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_3 { 0%, 86.398% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 86.412% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 88.095% { transform: scale(1); } 89.687% { color: #ffd400; } 90.388%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_4 { 0%, 89.673% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 89.687% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 91.370% { transform: scale(1); } 93.689% { color: #ffd400; } 94.390%, 100% { opacity: 1; transform: none; color: #fff; } }

</style>
</head>
<body data-duration="7.13">
<div class="stage">
  <div class="hud"><span>CASO Nº 0417</span><span>ARQUIVO 03/07</span></div>

  <div class="board">
    <div class="stamp-time"><span class="hm">21:14</span><span class="ss">:03</span></div>
    <div class="photo"><div class="pin"></div>
      <div class="phone"><div class="screen"><div class="spinner"></div>
        <div class="site"><i class="big"></i><i style="width:90%"></i><i style="width:70%"></i><i style="width:80%"></i><i class="big"></i><i style="width:60%"></i></div>
      </div></div>

  </div>
  <div class="captions">
    <div class="phrase" style="animation: ph0 7.13s linear 0s both"><span class="w" style="animation: w0_0 7.13s linear 0s both">Às</span> <span class="w" style="animation: w0_1 7.13s linear 0s both">21h14...</span></div>
    <div class="phrase" style="animation: ph1 7.13s linear 0s both"><span class="w" style="animation: w1_0 7.13s linear 0s both">e</span> <span class="w" style="animation: w1_1 7.13s linear 0s both">3</span> <span class="w" style="animation: w1_2 7.13s linear 0s both">segundos...</span></div>
    <div class="phrase" style="animation: ph2 7.13s linear 0s both"><span class="w" style="animation: w2_0 7.13s linear 0s both">ele</span> <span class="w" style="animation: w2_1 7.13s linear 0s both">entrou</span> <span class="w" style="animation: w2_2 7.13s linear 0s both">no</span> <span class="w" style="animation: w2_3 7.13s linear 0s both">seu</span> <span class="w" style="animation: w2_4 7.13s linear 0s both">site.</span></div>

</div>
</body>
</html>
