<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Special+Elite&family=Share+Tech+Mono&family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Reel fora da identidade da marca (criatividade: Ousado), estética de documentário policial.
     Toda animação fica em elemento real (o export faz scrub via querySelectorAll('*')). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #1c1c1c 0%, #0a0a0a 65%, #000 100%); }
  .grain { position: absolute; inset: -60px; z-index: 30; pointer-events: none; opacity: 0.14;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 0.5s steps(4) 0s infinite; }
  @keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-30px, 20px); } 50% { transform: translate(20px, -30px); } 75% { transform: translate(-20px, -10px); } 100% { transform: translate(0, 0); } }
  .vignette { position: absolute; inset: 0; z-index: 29; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,0.75) 100%); }
  .flicker { position: absolute; inset: 0; z-index: 28; pointer-events: none; background: #fff; animation: flick 3.1s steps(1) 0.6s infinite; opacity: 0; }
  @keyframes flick { 0%, 100% { opacity: 0; } 47% { opacity: 0.035; } 49% { opacity: 0; } 83% { opacity: 0.025; } 84% { opacity: 0; } }
  .cutin { position: absolute; inset: 0; z-index: 31; background: #000; animation: cutIn 0.25s ease-out 0s both; }
  @keyframes cutIn { from { opacity: 1; } to { opacity: 0; } }
  .hud { position: absolute; left: 70px; right: 70px; top: 110px; display: flex; justify-content: space-between; z-index: 20;
    font: 34px 'Share Tech Mono', monospace; color: rgba(255,255,255,0.55); letter-spacing: 0.08em; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slamIn { 0% { opacity: 0; transform: scale(1.6); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes stamp { 0% { opacity: 0; scale: 2.2; } 70% { opacity: 1; scale: 0.95; } 100% { opacity: 1; scale: 1; } }
  
  .dossier { position: absolute; left: 110px; top: 250px; width: 860px; height: 900px; background: #e9dfc7; transform: rotate(-2deg);
    box-shadow: 0 30px 70px rgba(0,0,0,0.7); padding: 60px 64px; font-family: 'Special Elite', monospace; color: #2b2b2b;
    animation: slideIn 0.5s cubic-bezier(.2,.8,.3,1) 0.05s both; }
  @keyframes slideIn { from { transform: translateY(160px) rotate(4deg); opacity: 0; } to { transform: rotate(-2deg); opacity: 1; } }
  .d-head { font-size: 40px; letter-spacing: 0.12em; border-bottom: 3px solid #2b2b2b; padding-bottom: 16px; }
  .d-top { display: flex; gap: 40px; margin-top: 40px; }
  .polaroid { width: 270px; background: #fff; padding: 16px 16px 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.35); transform: rotate(3deg); position: relative; }
  .polaroid .ph { height: 250px; background: #cfcfcf; padding: 30px; }
  .polaroid .q { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 30px; }
  .clip { position: absolute; top: -26px; left: 110px; width: 50px; height: 70px; border: 7px solid #8a8a8a; border-radius: 20px; }
  .d-id { font-size: 38px; line-height: 1.5; }
  .d-id b { font-weight: normal; color: #7a1a1a; }
  .fields { margin-top: 56px; display: flex; flex-direction: column; gap: 34px; }
  .field { display: flex; align-items: center; justify-content: space-between; font-size: 44px; border-bottom: 2px dashed #8b7d60; padding-bottom: 14px; }
  .yes { color: #b01515; border: 5px solid #b01515; padding: 2px 20px; transform: rotate(-5deg); font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: 0.06em; }
  .f1 { animation: fadeIn 0.3s ease 0.20s both; } .f1 .yes { animation: stamp 0.3s cubic-bezier(.2,.9,.3,1.2) 0.65s both; }
  .f2 { animation: fadeIn 0.3s ease 2.23s both; } .f2 .yes { animation: stamp 0.3s cubic-bezier(.2,.9,.3,1.2) 2.58s both; }
  .f3 { animation: fadeIn 0.3s ease 3.90s both; } .f3 .yes { animation: stamp 0.3s cubic-bezier(.2,.9,.3,1.2) 4.50s both, glowR 1.4s ease-in-out 5.10s infinite; }
  @keyframes glowR { 0%, 100% { box-shadow: 0 0 0 rgba(176,21,21,0); } 50% { box-shadow: 0 0 26px rgba(176,21,21,0.55); } }

  /* legenda de documentário */
  .captions { position: absolute; left: 70px; right: 150px; top: 1300px; height: 280px; z-index: 20; }
  .phrase { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; column-gap: 20px; row-gap: 2px; text-align: center; }
  .w { display: inline-block; font: 700 84px 'Oswald', sans-serif; line-height: 1.12; text-transform: uppercase; color: #fff;
    -webkit-text-stroke: 10px #000; paint-order: stroke fill; letter-spacing: 0.01em; }
@keyframes ph0 { 0%, 2.415% { opacity: 0; visibility: hidden; } 2.431%, 35.272% { opacity: 1; visibility: visible; } 35.288%, 100% { opacity: 0; visibility: hidden; } }
@keyframes w0_0 { 0%, 3.225% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 3.241% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 5.186% { transform: scale(1); } 7.375% { color: #ffd400; } 8.185%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w0_1 { 0%, 7.358% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 7.375% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 9.319% { transform: scale(1); } 13.345% { color: #ffd400; } 14.155%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w0_2 { 0%, 13.328% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 13.345% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 15.290% { transform: scale(1); } 16.559% { color: #ffd400; } 17.370%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w0_3 { 0%, 16.543% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 16.559% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 18.504% { transform: scale(1); } 25.285% { color: #ffd400; } 26.095%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes ph1 { 0%, 35.272% { opacity: 0; visibility: hidden; } 35.288%, 62.434% { opacity: 1; visibility: visible; } 62.451%, 100% { opacity: 0; visibility: hidden; } }
@keyframes w1_0 { 0%, 36.082% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 36.099% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 38.043% { transform: scale(1); } 42.257% { color: #ffd400; } 43.068%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w1_1 { 0%, 42.241% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 42.257% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 44.202% { transform: scale(1); } 51.258% { color: #ffd400; } 52.069%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes ph2 { 0%, 62.434% { opacity: 0; visibility: hidden; } 62.451%, 99.984% { opacity: 1; visibility: visible; } 100.000%, 100% { opacity: 0; visibility: hidden; } }
@keyframes w2_0 { 0%, 63.245% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 63.261% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 65.206% { transform: scale(1); } 65.526% { color: #ffd400; } 66.336%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_1 { 0%, 65.510% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 65.526% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 67.471% { transform: scale(1); } 72.321% { color: #ffd400; } 73.131%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_2 { 0%, 72.305% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 72.321% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 74.266% { transform: scale(1); } 79.116% { color: #ffd400; } 79.927%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_3 { 0%, 79.100% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 79.116% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 81.061% { transform: scale(1); } 83.193% { color: #ffd400; } 84.004%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_4 { 0%, 83.177% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 83.193% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 85.138% { transform: scale(1); } 92.707% { color: #ffd400; } 93.517%, 100% { opacity: 1; transform: none; color: #fff; } }

</style>
</head>
<body data-duration="6.17">
<div class="stage">
  <div class="hud"><span>CASO Nº 0417</span><span>ARQUIVO 02/07</span></div>

  <div class="dossier">
    <div class="d-head">FICHA · CASO Nº 0417</div>
    <div class="d-top">
      <div class="polaroid"><div class="clip"></div><div class="ph"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 22c0-4.7 3.8-8 8.5-8s8.5 3.3 8.5 8"/></svg></div><div class="q">identidade: ?</div></div>
      <div class="d-id">Nome: <b>desconhecido</b><br>Perfil: <b>cliente em potencial</b><br>Visto: <b>pelo celular</b></div>

    <div class="phrase" style="animation: ph0 6.17s linear 0s both"><span class="w" style="animation: w0_0 6.17s linear 0s both">Ele</span> <span class="w" style="animation: w0_1 6.17s linear 0s both">tinha</span> <span class="w" style="animation: w0_2 6.17s linear 0s both">um</span> <span class="w" style="animation: w0_3 6.17s linear 0s both">problema.</span></div>
    <div class="phrase" style="animation: ph1 6.17s linear 0s both"><span class="w" style="animation: w1_0 6.17s linear 0s both">Tinha</span> <span class="w" style="animation: w1_1 6.17s linear 0s both">dinheiro...</span></div>

  </div>
  <div class="flicker"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="cutin"></div>
</div>
</body>
</html>
