<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Special+Elite&family=Share+Tech+Mono&family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Reel fora da identidade da marca (criatividade: Ousado), estética de documentário policial.
     Toda animação fica em elemento real (o export faz scrub via querySelectorAll('*')). */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0a; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #1c1c1c 0%, #0a0a0a 65%, #000 100%); }
  .grain { position: absolute; inset: -60px; z-index: 30; pointer-events: none; opacity: 0.14;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 0.5s steps(4) 0s infinite; }
  @keyframes grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-30px, 20px); } 50% { transform: translate(20px, -30px); } 75% { transform: translate(-20px, -10px); } 100% { transform: translate(0, 0); } }
  .vignette { position: absolute; inset: 0; z-index: 29; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,0.75) 100%); }
  .flicker { position: absolute; inset: 0; z-index: 28; pointer-events: none; background: #fff; animation: flick 3.1s steps(1) 0.6s infinite; opacity: 0; }
  @keyframes flick { 0%, 100% { opacity: 0; } 47% { opacity: 0.035; } 49% { opacity: 0; } 83% { opacity: 0.025; } 84% { opacity: 0; } }
  .cutin { position: absolute; inset: 0; z-index: 31; background: #000; animation: cutIn 0.25s ease-out 0s both; }
  @keyframes cutIn { from { opacity: 1; } to { opacity: 0; } }
  .hud { position: absolute; left: 70px; right: 70px; top: 110px; display: flex; justify-content: space-between; z-index: 20;
    font: 34px 'Share Tech Mono', monospace; color: rgba(255,255,255,0.55); letter-spacing: 0.08em; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slamIn { 0% { opacity: 0; transform: scale(1.6); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes stamp { 0% { opacity: 0; scale: 2.2; } 70% { opacity: 1; scale: 0.95; } 100% { opacity: 1; scale: 1; } }
  
  .board { position: absolute; left: 0; right: 0; top: 260px; display: flex; flex-direction: column; align-items: center; }
  .stamp-time { font: 170px 'Share Tech Mono', monospace; color: #ff3b3b; text-shadow: 0 0 34px rgba(255,59,59,0.55); white-space: nowrap; }
  .hm { display: inline-block; animation: slamIn 0.35s cubic-bezier(.2,.9,.3,1.3) 0.20s both; }
  .ss { display: inline-block; animation: slamIn 0.35s cubic-bezier(.2,.9,.3,1.3) 2.94s both, tick 1s steps(1) 3.84s infinite; }
  @keyframes tick { 50% { opacity: 0.5; } }
  .gbar { margin-top: 90px; width: 880px; height: 120px; border-radius: 60px; background: #fff; display: flex; align-items: center; gap: 24px; padding: 0 44px;
    font: 500 48px 'Manrope', sans-serif; color: #202124; box-shadow: 0 20px 60px rgba(0,0,0,0.6); animation: fadeIn 0.4s ease 5.51s both; }
  .gtext { white-space: nowrap; overflow: hidden; width: 0; animation: typeW 0.8s steps(23) 5.81s both; }
  @keyframes typeW { to { width: 560px; } }
  .backarrow { margin-top: 70px; width: 260px; height: 260px; color: #ff3b3b; animation: slamIn 0.35s cubic-bezier(.2,.9,.3,1.3) 5.51s both, nudgeL 1s ease-in-out 6.11s infinite; }
  @keyframes nudgeL { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-24px); } }
  .redflash { position: absolute; inset: 0; z-index: 6; animation: flash 0.6s ease-out 5.51s both; }
  @keyframes flash { 0% { background: rgba(200,0,0,0); } 20% { background: rgba(200,0,0,0.35); } 100% { background: rgba(200,0,0,0); } }

  /* legenda de documentário */
  .captions { position: absolute; left: 70px; right: 150px; top: 1300px; height: 280px; z-index: 20; }
  .phrase { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; column-gap: 20px; row-gap: 2px; text-align: center; }
  .w { display: inline-block; font: 700 84px 'Oswald', sans-serif; line-height: 1.12; text-transform: uppercase; color: #fff;
    -webkit-text-stroke: 10px #000; paint-order: stroke fill; letter-spacing: 0.01em; }
@keyframes ph0 { 0%, 1.918% { opacity: 0; visibility: hidden; } 1.931%, 37.178% { opacity: 1; visibility: visible; } 37.191%, 100% { opacity: 0; visibility: hidden; } }
@keyframes w0_0 { 0%, 2.561% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 2.574% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 4.118% { transform: scale(1); } 11.103% { color: #ffd400; } 11.746%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w0_1 { 0%, 11.090% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 11.103% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 12.647% { transform: scale(1); } 26.942% { color: #ffd400; } 27.585%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes ph1 { 0%, 37.178% { opacity: 0; visibility: hidden; } 37.191%, 70.321% { opacity: 1; visibility: visible; } 70.334%, 100% { opacity: 0; visibility: hidden; } }
@keyframes w1_0 { 0%, 37.821% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 37.834% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 39.378% { transform: scale(1); } 40.591% { color: #ffd400; } 41.234%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w1_1 { 0%, 40.578% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 40.591% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 42.135% { transform: scale(1); } 43.347% { color: #ffd400; } 43.991%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w1_2 { 0%, 43.334% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 43.347% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 44.892% { transform: scale(1); } 53.822% { color: #ffd400; } 54.466%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes ph2 { 0%, 70.321% { opacity: 0; visibility: hidden; } 70.334%, 99.987% { opacity: 1; visibility: visible; } 100.000%, 100% { opacity: 0; visibility: hidden; } }
@keyframes w2_0 { 0%, 70.965% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 70.978% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 72.522% { transform: scale(1); } 73.811% { color: #ffd400; } 74.454%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_1 { 0%, 73.798% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 73.811% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 75.355% { transform: scale(1); } 78.532% { color: #ffd400; } 79.176%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_2 { 0%, 78.520% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 78.532% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 80.077% { transform: scale(1); } 81.366% { color: #ffd400; } 82.009%, 100% { opacity: 1; transform: none; color: #fff; } }
@keyframes w2_3 { 0%, 81.353% { opacity: 0.0; transform: translateY(14px) scale(0.9); color: #fff; } 81.366% { opacity: 1; transform: translateY(0) scale(1.08); color: #ffd400; } 82.910% { transform: scale(1); } 86.087% { color: #ffd400; } 86.731%, 100% { opacity: 1; transform: none; color: #fff; } }

</style>
</head>
<body data-duration="7.77">
<div class="stage">
  <div class="hud"><span>CASO Nº 0417</span><span>ARQUIVO 05/07</span></div>

  <div class="board">
    <div class="stamp-time"><span class="hm">21:14</span><span class="ss">:06</span></div>
    <div class="backarrow"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></div>
    <div class="gbar"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="gtext">eletricista em campinas</span></div>

</body>
</html>
