<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Toda animacao fica em elemento real: o export faz scrub via querySelectorAll('*'),
     que nao alcanca ::before / ::after. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .scene {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 100px 72px 100px 88px;
  }
  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .blob-1 {
    position: absolute; top: -120px; right: -160px;
    width: 780px; height: 780px;
    background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 62%);
    animation: driftA 9s ease-in-out 0.9s infinite;
  }
  .blob-2 {
    position: absolute; bottom: -160px; left: -180px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 62%);
    animation: driftB 11s ease-in-out 0.9s infinite;
  }
  .accent-left {
    position: absolute; left: 0; top: 0; width: 8px; height: 100%;
    background: linear-gradient(180deg, #06b6d4 0%, #6366f1 100%);
  }
  .handle {
    position: absolute; bottom: 64px; right: 64px;
    font-size: 34px; font-weight: 700; color: #94a3b8;
    animation: fadeIn 0.4s ease 0.6s both;
  }
  .handle em { font-style: normal; color: #06b6d4; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 16px; align-self: flex-start;
    background: rgba(6,182,212,0.14);
    border: 2px solid rgba(6,182,212,0.38);
    border-radius: 100px; padding: 16px 36px;
    font-size: 32px; font-weight: 800;
    letter-spacing: 0.1em; text-transform: uppercase; color: #06b6d4;
    animation: dropIn 0.5s cubic-bezier(.2,.8,.3,1) 0.05s both;
  }
  .eyebrow-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #06b6d4;
    animation: dotPulse 1.8s ease-in-out 0.9s infinite;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-28px); } to { opacity: 1; transform: none; } }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    70%  { opacity: 1; transform: scale(1.08) rotate(0deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes wipeX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes driftA { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-30px, 24px) scale(1.06); } }
  @keyframes driftB { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(28px, -22px) scale(1.05); } }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.35; transform: scale(1);   box-shadow: 0 0 0 0 rgba(6,182,212,0.5); }
    50%      { opacity: 1;    transform: scale(1.3); box-shadow: 0 0 0 16px rgba(6,182,212,0); }
  }

  .scene { align-items: center; text-align: center; padding: 100px 90px; }
  .blob-1 { animation: breathe 4s ease-in-out 0.9s infinite; }
  .blob-2 { animation: breathe 4s ease-in-out 1.9s infinite; }
  @keyframes breathe { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

  .sparkle { position: absolute; color: #06b6d4; opacity: 0; }
  .sp-1 { top: 330px; left: 130px;  animation: sparkle 2.4s ease-in-out 1.0s infinite; }
  .sp-2 { top: 560px; right: 140px; animation: sparkle 2.4s ease-in-out 1.6s infinite; }
  .sp-3 { bottom: 440px; left: 160px; animation: sparkle 2.4s ease-in-out 2.2s infinite; }
  @keyframes sparkle {
    0%       { opacity: 0; transform: scale(0) rotate(0deg); }
    30%, 70% { opacity: 1; transform: scale(1) rotate(180deg); }
    100%     { opacity: 0; transform: scale(0) rotate(360deg); }
  }

  .eyebrow { align-self: center; margin-bottom: 56px; }
  h2 { font-size: 100px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.06; color: #f8fafc; animation: fadeUp 0.5s ease 0.25s both; }
  h2 .accent { background: linear-gradient(90deg, #06b6d4 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .sub { margin-top: 52px; max-width: 860px; font-size: 52px; font-weight: 600; line-height: 1.4; color: #94a3b8; animation: fadeUp 0.5s ease 0.55s both; }
  .sub strong { color: #f8fafc; font-weight: 900; }

  .card {
    margin-top: 76px;
    display: inline-flex; align-items: center; gap: 22px;
    background: rgba(255,255,255,0.05); border: 2px solid rgba(6,182,212,0.35);
    border-radius: 100px; padding: 34px 60px;
    font-size: 52px; font-weight: 900; color: #f8fafc; letter-spacing: -0.02em;
    animation: fadeUp 0.5s ease 0.85s both, cardGlow 2.6s ease-in-out 1.4s infinite;
  }
  .card svg { color: #06b6d4; animation: nudge 1.4s ease-in-out 1.6s infinite; }
  @keyframes cardGlow {
    0%, 100% { border-color: rgba(6,182,212,0.35); box-shadow: 0 0 0 rgba(6,182,212,0); }
    50%      { border-color: rgba(6,182,212,0.85); box-shadow: 0 0 44px rgba(6,182,212,0.30); }
  }
  @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }

</style>
</head>
<body data-duration="8">
<div class="scene">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>
  <div class="sparkle sp-1"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg></div>
  <div class="sparkle sp-2"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg></div>
  <div class="sparkle sp-3"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg></div>

  <div class="eyebrow"><span class="eyebrow-dot"></span>Sua vez</div>

  <h2>Abra o seu site<br><span class="accent">no celular agora.</span></h2>

  <div class="sub">Não passou? <strong>Me mande o link</strong> que eu faço o teste com você.</div>

  <div class="card">Chame no direct <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg></div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
