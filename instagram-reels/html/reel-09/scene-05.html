<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Toda animacao fica em elemento real: o export faz scrub via querySelectorAll('*'),
     que nao alcanca ::before / ::after. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .scene {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 100px 72px 100px 88px;
  }
  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .blob-1 {
    position: absolute; top: -120px; right: -160px;
    width: 780px; height: 780px;
    background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 62%);
    animation: driftA 9s ease-in-out 0.9s infinite;
  }
  .blob-2 {
    position: absolute; bottom: -160px; left: -180px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 62%);
    animation: driftB 11s ease-in-out 0.9s infinite;
  }
  .accent-left {
    position: absolute; left: 0; top: 0; width: 8px; height: 100%;
    background: linear-gradient(180deg, #06b6d4 0%, #6366f1 100%);
  }
  .handle {
    position: absolute; bottom: 64px; right: 64px;
    font-size: 34px; font-weight: 700; color: #94a3b8;
    animation: fadeIn 0.4s ease 0.6s both;
  }
  .handle em { font-style: normal; color: #06b6d4; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 16px; align-self: flex-start;
    background: rgba(6,182,212,0.14);
    border: 2px solid rgba(6,182,212,0.38);
    border-radius: 100px; padding: 16px 36px;
    font-size: 32px; font-weight: 800;
    letter-spacing: 0.1em; text-transform: uppercase; color: #06b6d4;
    animation: dropIn 0.5s cubic-bezier(.2,.8,.3,1) 0.05s both;
  }
  .eyebrow-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #06b6d4;
    animation: dotPulse 1.8s ease-in-out 0.9s infinite;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-28px); } to { opacity: 1; transform: none; } }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    70%  { opacity: 1; transform: scale(1.08) rotate(0deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes wipeX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes driftA { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-30px, 24px) scale(1.06); } }
  @keyframes driftB { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(28px, -22px) scale(1.05); } }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.35; transform: scale(1);   box-shadow: 0 0 0 0 rgba(6,182,212,0.5); }
    50%      { opacity: 1;    transform: scale(1.3); box-shadow: 0 0 0 16px rgba(6,182,212,0); }
  }

  .scene { align-items: center; text-align: center; justify-content: center; padding-top: 120px; }
  .clock-row { position: absolute; top: 150px; left: 0; right: 0; justify-content: center; }

  /* cronômetro linear no topo: 1 segmento por pergunta */
  .clock-row { display: flex; align-items: center; gap: 30px; animation: dropIn 0.45s cubic-bezier(.2,.8,.3,1) 0.05s both; }
  .clock-pill {
    display: inline-flex; align-items: center; gap: 14px;
    background: rgba(6,182,212,0.14); border: 2px solid rgba(6,182,212,0.40);
    border-radius: 100px; padding: 12px 30px 12px 22px;
    font-size: 44px; font-weight: 900; color: #22d3ee; letter-spacing: -0.01em;
  }
  .segs { display: flex; gap: 12px; }
  .seg { position: relative; width: 150px; height: 18px; border-radius: 9px; background: rgba(248,250,252,0.10); overflow: hidden; }
  .seg-fill { position: absolute; inset: 0; border-radius: 9px; background: linear-gradient(90deg, #22d3ee, #6366f1); transform-origin: left center; }
  .seg-fill.now { animation: wipeX 0.7s ease-out 0.3s both, segPulse 1.6s ease-in-out 1.1s infinite; }
  @keyframes segPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  .label {
    margin-top: 0;
    font-size: 30px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #94a3b8;
    animation: fadeIn 0.4s ease 0.2s both;
  }
  h2 {
    margin-top: 18px; max-width: 920px;
    font-size: 100px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.04; color: #f8fafc;
    animation: fadeUp 0.5s ease 0.3s both;
  }
  h2 .q { color: #22d3ee; }

  /* celular com wireframe do site */
  .phone {
    position: relative; margin-top: 60px;
    width: 500px; height: 860px; border-radius: 70px;
    background: #020617; padding: 16px;
    border: 3px solid rgba(248,250,252,0.14);
    box-shadow: 0 40px 90px rgba(2,6,23,0.6), 0 0 0 1px rgba(6,182,212,0.15);
    animation: fadeUp 0.6s cubic-bezier(.2,.8,.3,1) 0.55s both;
  }
  .screen {
    position: relative; height: 100%; border-radius: 48px; overflow: hidden;
    background: #f8fafc; padding: 84px 36px 36px;
    display: flex; flex-direction: column; gap: 28px; text-align: left;
  }
  .notch { position: absolute; top: 16px; left: 50%; margin-left: -60px; width: 120px; height: 32px; border-radius: 20px; background: #020617; }
  .mk { position: relative; transition: none; }
  .mk-nav { display: flex; align-items: center; justify-content: space-between; }
  .mk-logo { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #0ea5e9, #6366f1); }
  .mk-menu { display: flex; flex-direction: column; gap: 7px; }
  .mk-menu i { display: block; width: 38px; height: 5px; border-radius: 3px; background: #94a3b8; }
  .mk-hero { font-size: 54px; font-weight: 900; line-height: 1.05; letter-spacing: -0.03em; color: #0f172a; }
  .mk-lines { display: flex; flex-direction: column; gap: 10px; }
  .mk-lines i { display: block; height: 12px; border-radius: 6px; background: #cbd5e1; }
  .mk-loc { display: inline-flex; align-items: center; gap: 10px; font-size: 32px; font-weight: 800; color: #334155; align-self: flex-start; }
  .mk-loc svg { color: #0891b2; }
  .mk-img { height: 190px; border-radius: 20px; background: linear-gradient(135deg, #e2e8f0, #cbd5e1); }
  .mk-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    border-radius: 18px; padding: 26px 0; background: #16a34a;
    font-size: 36px; font-weight: 900; color: #fff;
  }

  /* destaque: o resto do site apaga e o alvo ganha anel pulsante */
  .dim { animation: dimOut 0.5s ease 1.0s both; }
  @keyframes dimOut { from { opacity: 1; } to { opacity: 0.22; } }
  .hl-ring {
    position: absolute; inset: -12px -14px; border-radius: 18px;
    border: 5px solid #06b6d4; box-shadow: 0 0 32px rgba(6,182,212,0.55);
    animation: fadeIn 0.4s ease 1.05s both, ringPulse 1.6s ease-in-out 1.5s infinite;
  }
  @keyframes ringPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: 0.55; } }

  .answer {
    margin-top: 64px; max-width: 900px;
    font-size: 56px; font-weight: 600; line-height: 1.32; color: #94a3b8;
    animation: fadeUp 0.5s ease 1.25s both;
  }
  .answer strong { color: #f8fafc; font-weight: 900; }

</style>
</head>
<body data-duration="7">
<div class="scene">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>

  <div class="clock-row">
    <div class="clock-pill"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>3s</div>
    <div class="segs"><div class="seg"><div class="seg-fill"></div></div><div class="seg"><div class="seg-fill"></div></div><div class="seg"><div class="seg-fill now"></div></div></div>
  </div>

  <div class="label">Pergunta 3</div>
  <h2><span class="q">“</span>Como falo com você?<span class="q">”</span></h2>

  <div class="phone">
    <div class="screen">
      <div class="notch"></div>
      <div class="mk dim mk-nav"><div class="mk-logo"></div><div class="mk-menu"><i></i><i></i><i></i></div></div>
      <div class="mk dim mk-hero">Eletricista residencial</div>
      <div class="mk dim mk-lines"><i style="width:92%"></i><i style="width:70%"></i></div>
      <div class="mk dim mk-loc"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Campinas e região</div>
      <div class="mk dim mk-img"></div>
      <div class="mk mk-btn"><div class="hl-ring"></div><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>WhatsApp</div>
    </div>
  </div>

  <div class="answer"><strong>Botão de WhatsApp à vista</strong>, sem rolar a página.</div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
