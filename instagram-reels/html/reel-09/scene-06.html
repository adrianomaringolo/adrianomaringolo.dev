<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Toda animacao fica em elemento real: o export faz scrub via querySelectorAll('*'),
     que nao alcanca ::before / ::after. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .scene {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 100px 72px 100px 88px;
  }
  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .blob-1 {
    position: absolute; top: -120px; right: -160px;
    width: 780px; height: 780px;
    background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 62%);
    animation: driftA 9s ease-in-out 0.9s infinite;
  }
  .blob-2 {
    position: absolute; bottom: -160px; left: -180px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 62%);
    animation: driftB 11s ease-in-out 0.9s infinite;
  }
  .accent-left {
    position: absolute; left: 0; top: 0; width: 8px; height: 100%;
    background: linear-gradient(180deg, #06b6d4 0%, #6366f1 100%);
  }
  .handle {
    position: absolute; bottom: 64px; right: 64px;
    font-size: 34px; font-weight: 700; color: #94a3b8;
    animation: fadeIn 0.4s ease 0.6s both;
  }
  .handle em { font-style: normal; color: #06b6d4; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 16px; align-self: flex-start;
    background: rgba(6,182,212,0.14);
    border: 2px solid rgba(6,182,212,0.38);
    border-radius: 100px; padding: 16px 36px;
    font-size: 32px; font-weight: 800;
    letter-spacing: 0.1em; text-transform: uppercase; color: #06b6d4;
    animation: dropIn 0.5s cubic-bezier(.2,.8,.3,1) 0.05s both;
  }
  .eyebrow-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #06b6d4;
    animation: dotPulse 1.8s ease-in-out 0.9s infinite;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-28px); } to { opacity: 1; transform: none; } }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    70%  { opacity: 1; transform: scale(1.08) rotate(0deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes wipeX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes driftA { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-30px, 24px) scale(1.06); } }
  @keyframes driftB { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(28px, -22px) scale(1.05); } }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.35; transform: scale(1);   box-shadow: 0 0 0 0 rgba(6,182,212,0.5); }
    50%      { opacity: 1;    transform: scale(1.3); box-shadow: 0 0 0 16px rgba(6,182,212,0); }
  }

  .eyebrow { margin-bottom: 60px; }
  h2 { font-size: 116px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.04; color: #f8fafc; animation: fadeUp 0.5s ease 0.2s both; }

  .checks { margin-top: 70px; display: flex; flex-direction: column; gap: 28px; align-self: stretch; }
  .check {
    display: flex; align-items: center; gap: 30px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10);
    border-radius: 28px; padding: 30px 40px;
    font-size: 54px; font-weight: 800; color: #f8fafc; letter-spacing: -0.02em;
  }
  .check:nth-child(1) { animation: fadeUp 0.45s ease 0.5s both; }
  .check:nth-child(2) { animation: fadeUp 0.45s ease 0.7s both; }
  .check:nth-child(3) { animation: fadeUp 0.45s ease 0.9s both; }
  .tick {
    flex-shrink: 0; width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(34,197,94,0.16); border: 3px solid rgba(34,197,94,0.55); color: #4ade80;
  }
  .check:nth-child(1) .tick { animation: popIn 0.4s cubic-bezier(.2,.9,.3,1.3) 0.85s both, tickPulse 2.4s ease-in-out 1.6s infinite; }
  .check:nth-child(2) .tick { animation: popIn 0.4s cubic-bezier(.2,.9,.3,1.3) 1.05s both, tickPulse 2.4s ease-in-out 2.0s infinite; }
  .check:nth-child(3) .tick { animation: popIn 0.4s cubic-bezier(.2,.9,.3,1.3) 1.25s both, tickPulse 2.4s ease-in-out 2.4s infinite; }
  @keyframes tickPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.45); }
    50%      { box-shadow: 0 0 0 18px rgba(34,197,94,0); }
  }

  .verdict { margin-top: 76px; font-size: 62px; font-weight: 600; line-height: 1.34; color: #94a3b8; animation: fadeUp 0.5s ease 1.5s both; }
  .verdict strong { color: #f8fafc; font-weight: 900; }
  .verdict .ok { color: #4ade80; font-weight: 900; }

</style>
</head>
<body data-duration="7.5">
<div class="scene">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>

  <div class="eyebrow"><span class="eyebrow-dot"></span>O resultado</div>

  <h2>Respondeu as 3?</h2>

  <div class="checks">
    <div class="check"><div class="tick"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>O que você faz</div>
    <div class="check"><div class="tick"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>Onde você atende</div>
    <div class="check"><div class="tick"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>Como falar com você</div>
  </div>

  <div class="verdict"><span class="ok">Passou.</span><br>Faltou uma? <strong>O visitante foi embora.</strong></div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
