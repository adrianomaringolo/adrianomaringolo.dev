<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* Toda animacao fica em elemento real: o export faz scrub via querySelectorAll('*'),
     que nao alcanca ::before / ::after. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #0f172a; font-family: 'Manrope', sans-serif; }

  .scene {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 100px 72px 100px 88px;
  }
  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(248,250,252,0.05) 1.5px, transparent 1.5px);
    background-size: 48px 48px;
  }
  .blob-1 {
    position: absolute; top: -120px; right: -160px;
    width: 780px; height: 780px;
    background: radial-gradient(circle, rgba(6,182,212,0.18) 0%, transparent 62%);
    animation: driftA 9s ease-in-out 0.9s infinite;
  }
  .blob-2 {
    position: absolute; bottom: -160px; left: -180px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 62%);
    animation: driftB 11s ease-in-out 0.9s infinite;
  }
  .accent-left {
    position: absolute; left: 0; top: 0; width: 8px; height: 100%;
    background: linear-gradient(180deg, #06b6d4 0%, #6366f1 100%);
  }
  .handle {
    position: absolute; bottom: 64px; right: 64px;
    font-size: 34px; font-weight: 700; color: #94a3b8;
    animation: fadeIn 0.4s ease 0.6s both;
  }
  .handle em { font-style: normal; color: #06b6d4; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 16px; align-self: flex-start;
    background: rgba(6,182,212,0.14);
    border: 2px solid rgba(6,182,212,0.38);
    border-radius: 100px; padding: 16px 36px;
    font-size: 32px; font-weight: 800;
    letter-spacing: 0.1em; text-transform: uppercase; color: #06b6d4;
    animation: dropIn 0.5s cubic-bezier(.2,.8,.3,1) 0.05s both;
  }
  .eyebrow-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #06b6d4;
    animation: dotPulse 1.8s ease-in-out 0.9s infinite;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-28px); } to { opacity: 1; transform: none; } }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    70%  { opacity: 1; transform: scale(1.08) rotate(0deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes wipeX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes driftA { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-30px, 24px) scale(1.06); } }
  @keyframes driftB { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(28px, -22px) scale(1.05); } }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.35; transform: scale(1);   box-shadow: 0 0 0 0 rgba(6,182,212,0.5); }
    50%      { opacity: 1;    transform: scale(1.3); box-shadow: 0 0 0 16px rgba(6,182,212,0); }
  }

  .timer { position: relative; width: 380px; height: 380px; flex-shrink: 0; }
  .timer-glow {
    position: absolute; inset: -60px;
    background: radial-gradient(circle, rgba(6,182,212,0.35) 0%, transparent 65%);
    animation: glowPulse 1s ease-in-out 0.9s infinite;
  }
  .timer svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring-track { stroke: rgba(248,250,252,0.10); }
  .ring-fill  { stroke: url(#ringGrad); stroke-dasharray: 942.5; stroke-dashoffset: 0; }
  .timer-digit {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 230px; font-weight: 900; letter-spacing: -0.06em; line-height: 1;
    color: #f8fafc;
  }
  @keyframes glowPulse { 0%, 100% { opacity: 0.5; transform: scale(0.96); } 50% { opacity: 1; transform: scale(1.06); } }

  .scene { align-items: center; text-align: center; padding: 100px 80px 220px; }
  .blob-1, .blob-2, .timer-glow, .handle { animation: none; }
  .ring-fill.cover { stroke-dashoffset: 314; }
  .timer { width: 380px; height: 380px; transform: scale(1.35); margin: 60px 0 120px; }
  .eyebrow { align-self: center; animation: none; margin-bottom: 70px; font-size: 36px; }
  .eyebrow-dot { animation: none; }
  h1 { font-size: 132px; font-weight: 900; letter-spacing: -0.045em; line-height: 1.0; color: #f8fafc; }
  h1 .accent { background: linear-gradient(90deg, #22d3ee 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub { margin-top: 56px; font-size: 62px; font-weight: 800; color: #cbd5e1; }

</style>
</head>
<body data-duration="0">
<div class="scene">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="bg-dots"></div>
  <div class="accent-left"></div>

  <div class="eyebrow"><span class="eyebrow-dot"></span>Teste rápido</div>

  <div class="timer">
    <div class="timer-glow"></div>
      <svg class="ring" width="380" height="380" viewBox="0 0 380 380">
        <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#6366f1"/></linearGradient></defs>
        <circle class="ring-track" cx="190" cy="190" r="150" fill="none" stroke-width="26"/>
        <circle class="ring-fill cover" cx="190" cy="190" r="150" fill="none" stroke-width="26" stroke-linecap="round"/>
      </svg>
    <div class="timer-digit">3</div>
  </div>

  <h1>O teste dos<br><span class="accent">3 segundos</span></h1>
  <div class="sub">O seu site passa?</div>

  <div class="handle"><em>@</em>adrianomaringolo.dev</div>
</div>
</body>
</html>
